<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Activate your CHAMA LIVE member account."
  >

  <title>Activate Account — CHAMA LIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f7fb;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand p {
      margin: 8px 0 0;
      color: #667085;
      font-size: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 30px;
      box-shadow:
        0 10px 30px rgba(16, 24, 40, 0.08);
      border: 1px solid #eaecf0;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 750;
    }

    .intro {
      margin: 0 0 24px;
      color: #667085;
      line-height: 1.5;
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 650;
      color: #344054;
    }

    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      padding: 11px 13px;
      font-size: 15px;
      color: #101828;
      background: #ffffff;
      outline: none;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    input:focus {
      border-color: #667085;
      box-shadow:
        0 0 0 3px rgba(102, 112, 133, 0.12);
    }

    input:disabled {
      background: #f9fafb;
      color: #667085;
    }

    .help {
      margin-top: 6px;
      font-size: 12px;
      color: #667085;
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      background: #101828;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition:
        opacity 0.15s ease,
        transform 0.05s ease;
    }

    button:hover {
      opacity: 0.94;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.error {
      background: #fef3f2;
      border: 1px solid #fecdca;
      color: #b42318;
    }

    .message.success {
      background: #ecfdf3;
      border: 1px solid #abefc6;
      color: #067647;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #98a2b3;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 22px;
      }

      .brand h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="brand">
      <h1>CHAMA LIVE</h1>

      <p>
        Digital management for your chama
      </p>
    </header>

    <section class="card">

      <h2>Activate Your Account</h2>

      <p class="intro">
        Complete your account setup using the membership details
        provided by your chama administrator.
      </p>

      <div
        id="error"
        class="message error"
        role="alert"
        aria-live="polite"
      ></div>

      <div
        id="success"
        class="message success"
        role="status"
        aria-live="polite"
      ></div>

      <form
        id="activateForm"
        novalidate
      >

        <div class="field">

          <label for="membershipNumber">
            Membership Number
          </label>

          <input
            id="membershipNumber"
            name="membershipNumber"
            type="text"
            inputmode="numeric"
            autocomplete="username"
            placeholder="Enter your membership number"
            required
          >

          <div class="help">
            Enter the membership number registered by your chama.
          </div>

        </div>

        <div class="field">

          <label for="email">
            Registered Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >

        </div>

        <div class="field">

          <label for="password">
            New Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Create a password"
            minlength="8"
            required
          >

          <div class="help">
            Password must contain at least 8 characters.
          </div>

        </div>

        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Enter your password again"
            minlength="8"
            required
          >

        </div>

        <button
          id="activateButton"
          type="submit"
        >
          Activate Account
        </button>

      </form>

    </section>

    <footer class="footer">
      © CHAMA LIVE
    </footer>

  </main>

  <!--
    MEMBER ACTIVATION FLOW

    This page intentionally does NOT:

      - import confirm.html
      - require an existing Supabase session
      - call getSession()
      - call getUser()
      - exchange an email confirmation code
      - perform onboarding_new_group()

    The member activation request is handled by
    js/activate-account.js through the activate-account
    Edge Function.

    Supported invitation query parameters:

      ?membership_number=XXXX&email=user@example.com

    js/activate-account.js is responsible for:

      - reading invitation parameters
      - validating the form
      - invoking activate-account
      - displaying success/error
      - redirecting to login.html after activation
  -->

  <script type="module">
    import "./js/activate-account.js";
  </script>

</body>
</html>
