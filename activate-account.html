<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate Account — Chama Live</title><link rel="stylesheet" href="css/app.css"></head><body><div class="auth"><main class="card"><h1>Activate account</h1><p class="muted">Use the email and one-time access code from your invitation.</p><div id="msg" class="alert hidden"></div><form id="form" autocomplete="off"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field" style="margin-top:12px"><label for="code">One-time access code</label><input id="code" name="code" type="text" required autocomplete="one-time-code"></div><div class="field" style="margin-top:12px"><label for="password">Create password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field" style="margin-top:12px"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" minlength="8" required autocomplete="new-password"></div><button id="submit" class="btn full" style="margin-top:16px">ACTIVATE ACCOUNT</button></form></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-client.js"></script><script>const db=window.chamaSupabase;const f=document.getElementById('form'),m=document.getElementById('msg'),b=document.getElementById('submit');f.addEventListener('submit',async e=>{e.preventDefault();if(!f.checkValidity()){f.reportValidity();return}b.disabled=true;b.textContent='ACTIVATING...';m.className='alert hidden';try{const email=document.getElementById('email').value.trim().toLowerCase(),code=document.getElementById('code').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm)throw new Error('Passwords do not match.');await db.auth.signOut({scope:'local'});const {data:invite,error:ve}=await db.rpc('verify_group_invite',{p_email:email,p_access_code:code});if(ve)throw ve;if(!invite?.success)throw new Error(invite?.message||'Invalid access code.');const {data,error}=await db.functions.invoke('activate-account',{body:{invite_id:invite.invite_id,email,password,access_code:code}});if(error)throw error;if(!data?.success)throw new Error(data?.message||'Activation failed.');await db.auth.signOut({scope:'local'});const {error:le}=await db.auth.signInWithPassword({email,password});if(le)throw le;location.href='dashboard.html'}catch(x){m.textContent=x.message||'Activation failed.';m.className='alert'}finally{b.disabled=false;b.textContent='ACTIVATE ACCOUNT'}});</script></body></html>
