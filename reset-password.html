<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Create New Password — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="brand">
        CHAMA <span>LIVE</span>
      </div>

      <h1>Create New Password</h1>

      <p>
        Enter a new password for your CHAMA LIVE account.
      </p>


      <div
        id="error"
        class="alert alert-error"
        hidden
        role="alert"
      ></div>


      <div
        id="success"
        class="alert alert-success"
        hidden
        role="status"
      ></div>


      <form id="resetPasswordForm">

        <div class="form-group">

          <label for="password">
            New Password
          </label>

          <input
            type="password"
            id="password"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            minlength="8"
            required
          >

        </div>


        <div class="form-group">

          <label for="confirmPassword">
            Confirm New Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            autocomplete="new-password"
            placeholder="Repeat your new password"
            minlength="8"
            required
          >

        </div>


        <button
          type="submit"
          id="resetPasswordButton"
          class="btn btn-primary"
        >
          Update Password
        </button>

      </form>


      <div
        style="
          margin-top:20px;
          text-align:center;
        "
      >

        <a href="login.html">
          ← Back to Sign In
        </a>

      </div>

    </section>

  </main>


  <script
    type="module"
    src="js/reset-password.js"
  ></script>

</body>

</html>
