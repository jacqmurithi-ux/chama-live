<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Chama Live</title><link rel="stylesheet" href="css/app.css"></head><body><div class="shell"><header class="top"><div class="brand">Chama Live</div><button id="logout" class="btn">LOGOUT</button></header><main class="container"><div class="card"><h1 id="groupName">Dashboard</h1><p id="memberInfo" class="muted">Loading your group...</p></div><div class="stats"><div class="card stat"><span>Members</span><strong id="members">—</strong></div><div class="card stat"><span>Contributions</span><strong id="contrib">KSh 0</strong></div><div class="card stat"><span>Expenses</span><strong id="expenses">KSh 0</strong></div><div class="card stat"><span>Balance</span><strong id="balance">KSh 0</strong></div></div><div class="card"><h2>Modules</h2><div class="nav"><a class="btn" href="members.html">Members</a><a class="btn" href="contributions.html">Contributions</a><a class="btn" href="expenses.html">Expenses</a><a class="btn" href="meetings.html">Meetings</a><a class="btn" href="reports.html">Reports</a></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-client.js"></script><script>const db=window.chamaSupabase;async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}const {data:member}=await db.from('members').select('group_id,name,role').eq('auth_user_id',session.user.id).maybeSingle();if(!member){await db.auth.signOut({scope:'local'});location.href='login.html';return}const {data:group}=await db.from('groups').select('name').eq('id',member.group_id).single();document.getElementById('groupName').textContent=group?.name||'Dashboard';document.getElementById('memberInfo').textContent=member.name+' · '+member.role;const [{count:mc},{data:cs},{data:es},{data:bal}]=await Promise.all([db.from('members').select('*',{count:'exact',head:true}).eq('group_id',member.group_id),db.from('contributions').select('amount').eq('group_id',member.group_id),db.from('expenses').select('amount').eq('group_id',member.group_id),db.from('group_balances').select('current_balance').eq('group_id',member.group_id).maybeSingle()]);document.getElementById('members').textContent=mc??0;document.getElementById('contrib').textContent='KSh '+(cs||[]).reduce((a,x)=>a+Number(x.amount||0),0).toLocaleString();document.getElementById('expenses').textContent='KSh '+(es||[]).reduce((a,x)=>a+Number(x.amount||0),0).toLocaleString();document.getElementById('balance').textContent='KSh '+Number(bal?.current_balance||0).toLocaleString()}boot();document.getElementById('logout').onclick=async()=>{await db.auth.signOut({scope:'local'});location.href='login.html'};</script></body></html>
