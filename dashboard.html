    /* =====================================================
       QUICK ACTIONS
    ====================================================== */

    .visual-actions {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 14px;

      margin-bottom: 24px;

    }


    .visual-action {

      text-decoration: none;

      color: inherit;

      background:
        var(--card-bg, #fff);

      border:
        1px solid rgba(0,0,0,.08);

      border-radius: 18px;

      padding: 18px 14px;

      display: flex;

      align-items: center;

      gap: 12px;

      min-height: 82px;

      box-shadow:
        0 4px 14px rgba(0,0,0,.05);

      transition:
        transform .2s ease,
        box-shadow .2s ease;

    }


    .visual-action:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 8px 22px rgba(0,0,0,.09);

    }


    .visual-action-icon {

      width: 48px;

      height: 48px;

      border-radius: 14px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-weight: 800;

      font-size: 18px;

      flex-shrink: 0;

      background:
        #f1f5f9;

    }


    .visual-action strong {

      display: block;

      font-size: 14px;

      margin-bottom: 4px;

    }


    .visual-action small {

      display: block;

      font-size: 11px;

      opacity: .65;

      line-height: 1.3;
