<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Login — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>


<main
  style="
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  "
>


<section
  class="card"
  style="
    width:100%;
    max-width:420px;
  "
>


<div
  style="
    text-align:center;
    margin-bottom:25px;
  "
>

  <h1>
    CHAMA <span>LIVE</span>
  </h1>

  <p class="muted">
    Sign in to your group account
  </p>

</div>


<div
  id="error"
  class="error"
  hidden
  style="margin-bottom:15px;"
></div>


<form
  id="loginForm"
  autocomplete="on"
>


<div style="margin-bottom:15px;">

  <label for="email">
    Email address
  </label>

  <input
    type="email"
    id="email"
    name="email"
    autocomplete="username"
    required
    style="width:100%;"
  >

</div>


<div style="margin-bottom:20px;">

  <label for="password">
    Password
  </label>

  <input
    type="password"
    id="password"
    name="password"
    autocomplete="current-password"
    required
    style="width:100%;"
  >

</div>


<button
  class="btn btn-primary"
  type="submit"
  id="loginButton"
  style="width:100%;"
>
  Sign in
</button>


</form>


<div
  id="status"
  class="muted"
  style="
    text-align:center;
    margin-top:15px;
  "
></div>


<hr style="margin:25px 0;">


<p
  class="muted"
  style="text-align:center;"
>
  Don't have a group account?
</p>


<a
  href="create-group.html"
  class="btn btn-secondary"
  style="
    display:block;
    text-align:center;
  "
>
  Create Group Account
</a>


</section>


</main>



<script type="module">

import {
  supabase
} from "./js/supabase.js";


import {
  clearAuthCache,
  getMyMember,
  getMyGroup
} from "./js/auth.js";



const form =
  document.getElementById(
    "loginForm"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const button =
  document.getElementById(
    "loginButton"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const statusBox =
  document.getElementById(
    "status"
  );



/* =====================================================
   URL CLEANUP
===================================================== */

if (
  window.location.search
) {

  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );

}



/* =====================================================
   ERROR
===================================================== */

function showError(
  message
) {

  errorBox.hidden =
    false;

  errorBox.textContent =
    message;

}


function clearError() {

  errorBox.hidden =
    true;

  errorBox.textContent =
    "";

}



/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    clearError();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    const password =
      passwordInput.value;


    button.disabled =
      true;


    button.textContent =
      "Signing in...";


    statusBox.textContent =
      "";


    try {


      /*
       * SUPABASE AUTH
       */

      const {
        data,
        error
      } =
        await supabase.auth
          .signInWithPassword({

            email,

            password

          });


      if (error) {
        throw error;
      }


      if (!data?.session) {

        throw new Error(
          "No login session was created."
        );

      }


      clearAuthCache();


      statusBox.textContent =
        "Loading your group...";


      /*
       * MEMBER
       */

      const member =
        await getMyMember(
          true
        );


      if (!member) {

        await supabase.auth.signOut();

        throw new Error(
          "This email is not linked to a CHAMA LIVE member account."
        );

      }


      /*
       * MEMBER STATUS
       */

      if (
        member.status &&
        member.status.toLowerCase() !==
          "active"
      ) {

        await supabase.auth.signOut();

        throw new Error(
          "Your member account is inactive. Please contact your group administrator."
        );

      }


      /*
       * GROUP
       */

      const group =
        await getMyGroup(
          true
        );


      if (!group) {

        await supabase.auth.signOut();

        throw new Error(
          "Your account is not linked to a valid group."
        );

      }


      /*
       * SUCCESS
       */

      statusBox.textContent =
        `Welcome ${member.name || ""}. Redirecting...`;


      window.location.replace(
        "dashboard.html"
      );


    } catch (error) {

      console.error(
        "LOGIN ERROR:",
        error
      );


      let message =
        error?.message ||
        "Unable to sign in.";


      const lower =
        message.toLowerCase();


      if (
        lower.includes(
          "invalid login credentials"
        )
      ) {

        message =
          "Incorrect email or password.";

      }


      if (
        lower.includes(
          "email not confirmed"
        )
      ) {

        message =
          "Please confirm your email address before signing in.";

      }


      showError(
        message
      );


      button.disabled =
        false;

      button.textContent =
        "Sign in";

      statusBox.textContent =
        "";

    }

  }
);

</script>


</body>

</html>
