<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sign In — CHAMA LIVE</title>

  <link rel="stylesheet" href="css/app.css">
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="brand">
        CHAMA <span>LIVE</span>
      </div>

      <h1>Sign in to your group account</h1>

      <p>
        Manage members, contributions, expenses and group activities.
      </p>

      <div
        id="error"
        class="alert alert-error"
        hidden
        role="alert"
      ></div>

      <div
        id="success"
        class="alert alert-success"
        hidden
        role="status"
      ></div>

      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >

        </div>

        <div style="text-align:right;margin:8px 0 16px;">

          <a
            href="forgot-password.html"
            id="forgotPasswordLink"
          >
            Forgot password?
          </a>

        </div>

        <button
          type="submit"
          id="loginButton"
          class="btn btn-primary"
        >
          Sign In
        </button>

      </form>

      <div style="margin-top:20px;text-align:center;">

        <p>
          Don't have a group account?
        </p>

        <a href="create-group.html">
          Create Group Account
        </a>

      </div>

      <div style="margin-top:12px;text-align:center;">

        <p>
          Already registered by your administrator?
        </p>

        <a href="activate-account.html">
          Activate Your Account
        </a>

      </div>

    </section>

  </main>

  <script type="module" src="js/login.js"></script>

</body>
</html>
