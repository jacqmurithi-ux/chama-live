
<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Login — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>


<main
  style="
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  "
>


<section
  class="card"
  style="
    width:100%;
    max-width:420px;
  "
>


<div
  style="
    text-align:center;
    margin-bottom:25px;
  "
>

  <h1>
    CHAMA <span>LIVE</span>
  </h1>

  <p class="muted">
    Sign in to your group account
  </p>

</div>



<div
  id="error"
  class="error"
  hidden
  style="margin-bottom:15px;"
></div>



<div
  id="success"

    display:none;
    margin-bottom:15px;
    padding:12px;
    border-radius:8px;

    color:#166534;
  "
></div>



<form id="loginForm">


<div style="margin-bottom:15px;">

<label for="email">
Email address
</label>

<input
  type="email"
  id="email"
  autocomplete="email"
  required
  style="width:100%;"
>

</div>



<div style="margin-bottom:20px;">

<label for="password">
Password
</label>

<input
  type="password"
  id="password"

  required
  style="width:100%;"
>

</div>

  class="btn btn-primary"
  type="submit"
  id="loginButton"

    text-align:center;
    margin-top:15px;

></div>

  style="text-align:center;"

Don't have a group account?

  class="btn btn-secondary"
  style="
    display:block;
    text-align:center;
  "
>
Create Group Account
</a>


</section>


</main>

<script type="module">

import {
  signIn,
  getMyMember,
  getMyGroup
} from "./js/auth.js";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "loginForm"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const button =
  document.getElementById(
    "loginButton"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const successBox =
  document.getElementById(
    "success"
  );


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  errorBox.hidden = false;

  errorBox.textContent =
    message || "Unable to sign in.";
}


function clearError() {

  errorBox.hidden = true;

  errorBox.textContent = "";
}


/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    clearError();

    successBox.style.display =
      "none";

    statusBox.textContent =
      "";


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    const password =
      passwordInput.value;


    if (!email || !password) {

      showError(
        "Enter your email and password."
      );

      return;
    }


    button.disabled = true;

    button.textContent =
      "Signing in...";

    statusBox.textContent =
      "Connecting to CHAMA LIVE...";


    try {

      /* ===============================================
         SIGN IN
      =============================================== */

      await signIn(
        email,
        password
      );


      statusBox.textContent =
        "Login successful. Checking your member account...";


      /* ===============================================
         CHECK MEMBER
      =============================================== */

      const member =
        await getMyMember();


      if (!member) {

        throw new Error(
          "Your login worked, but your account is not linked to an active CHAMA member account."
        );
      }


      console.log(
        "CHAMA LIVE MEMBER:",
        member
      );


      statusBox.textContent =
        "Member account found. Checking your group...";


      /* ===============================================
         CHECK GROUP
      =============================================== */

      const group =
        await getMyGroup();


      if (!group) {

        throw new Error(
          "Your member account was found, but it is not linked to an active group."
        );
      }


      console.log(
        "CHAMA LIVE GROUP:",
        group
      );


      /* ===============================================
         SUCCESS
      =============================================== */

      const memberName =
        member.name ||
        member.full_name ||
        "Member";


      const groupName =
        group.name ||
        group.group_name ||
        "CHAMA";


      successBox.textContent =
        `Welcome ${memberName}. ${groupName} is ready. Redirecting...`;


      successBox.style.display =
        "block";


      statusBox.textContent =
        "";


      button.textContent =
        "Success";


      /*
       * Give the browser a moment to persist
       * the Supabase session before navigation.
       */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            300
          )
      );


      window.location.replace(
        "./dashboard.html"
      );


    } catch (error) {

      console.error(
        "CHAMA LOGIN FAILED:",
        error
      );


      showError(
        error?.message ||
        "Unable to sign in."
      );


      statusBox.textContent =
        "";


      button.disabled =
        false;


      button.textContent =
        "Sign in";
    }

  }
);

</script>
