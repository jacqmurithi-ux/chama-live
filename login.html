<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — CHAMA LIVE</title><link rel="stylesheet" href="css/app.css"></head><body><main class="auth"><section class="card auth-card"><h1>CHAMA LIVE</h1><p class="muted">Sign in to manage your group.</p><div class="form"><div class="field"><label for="email">Email</label><input id="email" type="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" required></div><button class="btn btn-primary" id="login">Sign in</button><div class="error" data-error hidden></div></div></section></main><script type="module">import {supabase} from './js/supabase.js';import {showError} from './js/app.js';document.querySelector('#login').onclick=async()=>{try{const email=document.querySelector('#email').value.trim();const password=document.querySelector('#password').value;const {error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;location.href='dashboard.html'}catch(error){showError(error)}};</script></body></html>
