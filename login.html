<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Chama Live</title><link rel="stylesheet" href="css/app.css"></head><body><div class="auth"><main class="card"><div class="brand-big">Chama Live</div><p class="muted" style="text-align:center">Sign in to your group account.</p><div id="msg" class="alert hidden"></div><form id="form"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username"></div><div class="field" style="margin-top:12px"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><button id="submit" class="btn full" style="margin-top:16px">LOGIN</button></form><p class="muted" style="text-align:center"><a href="create-group.html">Create a new group</a> · <a href="activate-account.html">Activate account</a></p></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-client.js"></script><script>const db=window.chamaSupabase;const f=document.getElementById('form'),m=document.getElementById('msg'),b=document.getElementById('submit');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='SIGNING IN...';m.className='alert hidden';try{const email=document.getElementById('email').value.trim().toLowerCase();const password=document.getElementById('password').value;const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw new Error('No login session was created.');location.href='dashboard.html'}catch(x){m.textContent=x.message||'Login failed.';m.className='alert'}finally{b.disabled=false;b.textContent='LOGIN'}});</script></body></html>
