
<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Login — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>


<main
  style="
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  "
>


<section
  class="card"
  style="
    width:100%;
    max-width:420px;
  "
>


<div
  style="
    text-align:center;
    margin-bottom:25px;
  "
>

  <h1>
    CHAMA <span>LIVE</span>
  </h1>

  <p class="muted">
    Sign in to your group account
  </p>

</div>



<div
  id="error"
  class="error"
  hidden
  style="margin-bottom:15px;"
></div>



<div
  id="success"
  style="
    display:none;
    margin-bottom:15px;
    padding:12px;
    border-radius:8px;
    background:#dcfce7;
    color:#166534;
  "
></div>



<form id="loginForm">


<div style="margin-bottom:15px;">

<label for="email">
Email address
</label>

<input
  type="email"
  id="email"
  autocomplete="email"
  required
  style="width:100%;"
>

</div>



<div style="margin-bottom:20px;">

<label for="password">
Password
</label>

<input
  type="password"
  id="password"
  autocomplete="current-password"
  required
  style="width:100%;"
>

</div>



<button
  class="btn btn-primary"
  type="submit"
  id="loginButton"
  style="width:100%;"
>
Sign in
</button>


</form>



<div
  id="status"
  class="muted"
  style="
    text-align:center;
    margin-top:15px;
  "
></div>



<hr style="margin:25px 0;">



<p
  class="muted"
  style="text-align:center;"
>
Don't have a group account?
</p>



<a
  href="create-group.html"
  class="btn btn-secondary"
  style="
    display:block;
    text-align:center;
  "
>
Create Group Account
</a>


</section>


</main>



<script type="module">

import {
  supabase
} from "./js/supabase.js";


const form =
  document.getElementById(
    "loginForm"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const button =
  document.getElementById(
    "loginButton"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const successBox =
  document.getElementById(
    "success"
  );



/* =====================================================
   ERROR
===================================================== */

function showError(
  message
) {

  errorBox.hidden =
    false;

  errorBox.textContent =
    message;

}



function clearError() {

  errorBox.hidden =
    true;

  errorBox.textContent =
    "";

}



/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    clearError();


    successBox.style.display =
      "none";


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    const password =
      passwordInput.value;


    if (
      !email ||
      !password
    ) {

      showError(
        "Enter your email and password."
      );

      return;
    }



    button.disabled =
      true;


    button.textContent =
      "Signing in...";


    statusBox.textContent =
      "Connecting to CHAMA LIVE...";



    try {


      /* ===============================================
         SIGN IN
      =============================================== */

      const {
        data,
        error
      } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        console.error(
          "Supabase login error:",
          error
        );

        throw new Error(
          error.message
        );

      }


      if (
        !data ||
        !data.user ||
        !data.session
      ) {

        throw new Error(
          "Supabase did not return a valid login session."
        );

      }



      statusBox.textContent =
        "Login successful. Checking your group...";



      /* ===============================================
         CHECK MEMBER
      =============================================== */

      const {
        data: member,
        error: memberError
      } =
        await supabase
          .rpc(
            "get_my_member"
          );


      if (memberError) {

        console.error(
          "get_my_member error:",
          memberError
        );

        throw new Error(
          "Your login worked, but CHAMA LIVE could not load your member account: " +
          memberError.message
        );

      }


      console.log(
        "MEMBER:",
        member
      );


      if (!member) {

        throw new Error(
          "Your login worked, but your account is not linked to a group member."
        );

      }



      /* ===============================================
         CHECK GROUP
      =============================================== */

      const {
        data: group,
        error: groupError
      } =
        await supabase
          .rpc(
            "get_my_group"
          );


      if (groupError) {

        console.error(
          "get_my_group error:",
          groupError
        );

        throw new Error(
          "Your member account was found, but CHAMA LIVE could not load your group: " +
          groupError.message
        );

      }


      console.log(
        "GROUP:",
        group
      );


      if (!group) {

        throw new Error(
          "Your account is not linked to a valid group."
        );

      }



      /* ===============================================
         SUCCESS
      =============================================== */

      console.log(
        "CHAMA LOGIN SUCCESS",
        {
          user: data.user,
          member,
          group
        }
      );


      successBox.textContent =
        "Welcome " +
        (
          member.name ||
          "Member"
        ) +
        ". Redirecting...";


      successBox.style.display =
        "block";


      statusBox.textContent =
        "";


      /*
       * Give Supabase a moment to persist
       * the session in the browser.
       */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            300
          )
      );


      window.location.replace(
        "./dashboard.html"
      );


    } catch (error) {


      console.error(
        "CHAMA LOGIN FAILED:",
        error
      );


      /*
       * If group/member verification fails,
       * remove the partially authenticated
       * session.
       */

      try {

        await supabase.auth.signOut();

      } catch (
        signOutError
      ) {

        console.error(
          "Cleanup sign out error:",
          signOutError
        );

      }


      showError(
        error?.message ||
        "Unable to sign in."
      );


      statusBox.textContent =
        "";


      button.disabled =
        false;


      button.textContent =
        "Sign in";

    }

  }
);

</script>


</body>

</html>
