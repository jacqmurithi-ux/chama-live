<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login — CHAMA LIVE</title>

  <link rel="stylesheet" href="css/app.css">
</head>

<body>

<main
  style="
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  "
>

  <section
    class="card"
    style="
      width:100%;
      max-width:420px;
    "
  >

    <div style="text-align:center;margin-bottom:25px;">

      <h1>
        CHAMA <span>LIVE</span>
      </h1>

      <p class="muted">
        Sign in to your group account
      </p>

    </div>


    <div
      id="error"
      class="error"
      hidden
      style="margin-bottom:15px;"
    ></div>


    <form id="loginForm">

      <div style="margin-bottom:15px;">

        <label for="email">
          Email address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
          style="width:100%;"
        >

      </div>


      <div style="margin-bottom:20px;">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
          style="width:100%;"
        >

      </div>


      <button
        class="btn btn-primary"
        type="submit"
        id="loginButton"
        style="width:100%;"
      >
        Sign in
      </button>

    </form>


    <div
      id="status"
      class="muted"
      style="
        text-align:center;
        margin-top:15px;
      "
    ></div>


    <hr style="margin:25px 0;">


    <p
      class="muted"
      style="text-align:center;"
    >
      Don't have a group account?
    </p>


    <a
      href="create-group.html"
      class="btn btn-secondary"
      style="
        display:block;
        text-align:center;
      "
    >
      Create Group Account
    </a>

  </section>

</main>


<script type="module">

  import {
    supabase
  } from "./js/supabase.js";

  import {
    getMyMember,
    getMyGroup,
    clearAuthCache
  } from "./js/auth.js";


  const form =
    document.getElementById(
      "loginForm"
    );

  const button =
    document.getElementById(
      "loginButton"
    );

  const errorElement =
    document.getElementById(
      "error"
    );

  const statusElement =
    document.getElementById(
      "status"
    );


  function showError(
    message
  ) {

    errorElement.hidden =
      false;

    errorElement.textContent =
      message;

  }


  function clearError() {

    errorElement.hidden =
      true;

    errorElement.textContent =
      "";

  }


  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      clearError();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("password")
          .value;


      button.disabled =
        true;

      button.textContent =
        "Signing in...";


      statusElement.textContent =
        "";


      try {

        /*
         * Sign in with Supabase Auth.
         */

        const {
          data,
          error
        } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });


        if (error) {
          throw error;
        }


        if (!data?.session) {

          throw new Error(
            "Login succeeded but no session was created."
          );

        }


        /*
         * Clear cached auth information.
         */

        clearAuthCache();


        statusElement.textContent =
          "Checking your group account...";


        /*
         * Find the member record.
         */

        const member =
          await getMyMember();


        if (!member) {

          await supabase.auth.signOut();

          throw new Error(
            "Your login is not linked to a group member record. Please contact your group administrator."
          );

        }


        /*
         * Check group.
         */

        const group =
          await getMyGroup();


        if (!group) {

          await supabase.auth.signOut();

          throw new Error(
            "Your member account is not linked to a valid group."
          );

        }


        /*
         * Check member status.
         */

        if (
          member.status &&
          member.status !== "active"
        ) {

          await supabase.auth.signOut();

          throw new Error(
            "Your group membership is currently inactive. Please contact your administrator."
          );

        }


        /*
         * Successful login.
         */

        statusElement.textContent =
          `Welcome ${member.name}. Redirecting...`;


        window.location.href =
          "dashboard.html";


      } catch (error) {

        console.error(
          "Login error:",
          error
        );


        showError(
          error?.message ||
          "Unable to sign in."
        );


        button.disabled =
          false;

        button.textContent =
          "Sign in";

        statusElement.textContent =
          "";

      }

    }
  );

</script>

</body>
</html>
