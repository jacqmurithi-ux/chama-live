<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Management — CHAMA LIVE</title><link rel="stylesheet" href="css/app.css"></head><body><header class="topbar"><div class="brand">CHAMA <span>LIVE</span></div><button class="btn btn-secondary" id="logout">Sign out</button></header><div class="layout"><aside class="sidebar"><nav class="nav"><a class="" href="dashboard.html">Dashboard</a><a class="" href="members.html">Members</a><a class="" href="contributions.html">Contributions</a><a class="" href="expenses.html">Expenses</a><a class="" href="meetings.html">Meetings</a><a class="" href="reports.html">Reports</a><a class="active" href="group-management.html">Group Management</a></nav></aside><main class="main"><div class="page-head"><div><h1>Group Management</h1><p class="muted">Current group profile.</p></div></div><section class="card"><p>Group: <strong id="name">Loading…</strong></p><p>Opening balance: <strong id="opening">—</strong></p><p>Monthly contribution: <strong id="monthly">—</strong></p></section><div class="error" data-error hidden></div></main></div><script type="module">import {boot} from './js/layout.js';await boot();import {supabase,getCurrentGroupId,money,setText,showError} from './js/app.js';try{const id=await getCurrentGroupId();const {data,error}=await supabase.from('groups').select('name,opening_balance,monthly_contribution').eq('id',id).single();if(error)throw error;setText('#name',data.name);setText('#opening',money(data.opening_balance));setText('#monthly',money(data.monthly_contribution));}catch(error){showError(error)}</script></body></html>
