
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Group Management — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >
</head>

<body>

<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <button
    class="btn btn-secondary"
    id="logout"
    type="button"
  >
    Sign out
  </button>

</header>


<div class="layout">

  <aside class="sidebar">

    <nav class="nav">

      <a href="dashboard.html">
        Dashboard
      </a>

      <a href="members.html">
        Members
      </a>

      <a href="contributions.html">
        Contributions
      </a>

      <a href="expenses.html">
        Expenses
      </a>

      <a href="meetings.html">
        Meetings
      </a>

      <a href="reports.html">
        Reports
      </a>

      <a
        class="active"
        href="group-management.html"
      >
        Group Management
      </a>

    </nav>

  </aside>


  <main class="main">

    <div class="page-head">

      <div>

        <h1>
          Group Management
        </h1>

        <p class="muted">
          Manage your group's profile and financial settings.
        </p>

      </div>

    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="card"
      style="margin-bottom:20px;"
    >
      Loading group settings...
    </div>


    <!-- ERROR -->

    <div
      id="error"
      class="error"
      hidden
      style="margin-bottom:20px;"
    ></div>


    <!-- GROUP PROFILE -->

    <section class="card">

      <h2>
        Group Profile
      </h2>

      <br>

      <form id="groupForm">

        <div class="grid grid-2">

          <!-- GROUP NAME -->

          <div>

            <label
              for="groupName"
              class="muted"
            >
              Group Name
            </label>

            <input
              id="groupName"
              name="groupName"
              type="text"
              required
              autocomplete="organization"
              placeholder="Enter group name"
            >

          </div>


          <!-- OPENING BALANCE -->

          <div>

            <label
              for="openingBalance"
              class="muted"
            >
              Opening Balance
            </label>

            <input
              id="openingBalance"
              name="openingBalance"
              type="number"
              min="0"
              step="0.01"
              required
              placeholder="0.00"
            >

          </div>


          <!-- MONTHLY CONTRIBUTION -->

          <div>

            <label
              for="monthlyContribution"
              class="muted"
            >
              Monthly Contribution
            </label>

            <input
              id="monthlyContribution"
              name="monthlyContribution"
              type="number"
              min="0"
              step="0.01"
              required
              placeholder="0.00"
            >

          </div>

        </div>


        <br>


        <div>

          <button
            class="btn"
            id="saveButton"
            type="submit"
          >
            Save Changes
          </button>

        </div>

      </form>

    </section>


    <br>


    <!-- CURRENT SETTINGS -->

    <section class="card">

      <h2>
        Current Settings
      </h2>

      <br>

      <div class="grid grid-3">

        <div>

          <div class="muted">
            Group
          </div>

          <strong id="currentGroupName">
            —
          </strong>

        </div>


        <div>

          <div class="muted">
            Opening Balance
          </div>

          <strong id="currentOpeningBalance">
            KSh 0.00
          </strong>

        </div>


        <div>

          <div class="muted">
            Monthly Contribution
          </div>

          <strong id="currentMonthlyContribution">
            KSh 0.00
          </strong>

        </div>

      </div>

    </section>

  </main>

</div>

<script type="module">
  import { boot } from "./js/layout.js";
  import "./js/contributions.js";

  boot();
</script>


</body>

</html>
