<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Group Management — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>


<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <button
    class="btn btn-secondary"
    id="logout"
  >
    Sign out
  </button>

</header>


<div class="layout">


  <aside class="sidebar">

    <nav class="nav">

      <a href="dashboard.html">
        Dashboard
      </a>

      <a href="members.html">
        Members
      </a>

      <a href="contributions.html">
        Contributions
      </a>

      <a href="expenses.html">
        Expenses
      </a>

      <a href="meetings.html">
        Meetings
      </a>

      <a href="reports.html">
        Reports
      </a>

      <a
        class="active"
        href="group-management.html"
      >
        Group Management
      </a>

    </nav>

  </aside>


  <main class="main">


    <div class="page-head">

      <div>

        <h1>
          Group Management
        </h1>

        <p class="muted">
          Current group profile.
        </p>

      </div>

    </div>


    <section class="card">


      <p>

        Group:

        <strong id="name">
          Loading…
        </strong>

      </p>


      <p>

        Opening balance:

        <strong id="opening">
          —
        </strong>

      </p>


      <p>

        Monthly contribution:

        <strong id="monthly">
          —
        </strong>

      </p>


    </section>


    <div
      class="error"
      data-error
      hidden
    ></div>


  </main>


</div>


<script type="module">

import { supabase } from "./js/supabase.js";


const errorBox =
  document.querySelector("[data-error]");


function showError(error) {

  console.error(
    "CHAMA LIVE group management error:",
    error
  );

  errorBox.textContent =
    error?.message ||
    "Unable to load group information.";

  errorBox.hidden = false;
}


function money(value) {

  return new Intl.NumberFormat(
    "en-KE",
    {
      style: "currency",
      currency: "KES",
      minimumFractionDigits: 2
    }
  ).format(Number(value) || 0);

}


async function getCurrentGroupId() {

  const {
    data: { user },
    error: userError
  } = await supabase.auth.getUser();


  if (userError) {
    throw userError;
  }


  if (!user) {

    window.location.href =
      "./login.html";

    return null;
  }


  const {
    data: member,
    error
  } = await supabase
    .from("members")
    .select("group_id")
    .eq("auth_user_id", user.id)
    .maybeSingle();


  if (error) {
    throw error;
  }


  if (!member) {

    throw new Error(
      "Your account is not linked to a group."
    );

  }


  return member.group_id;

}


async function loadGroup() {

  try {


    const groupId =
      await getCurrentGroupId();


    if (!groupId) {

      throw new Error(
        "No group is linked to this account."
      );

    }


    const {
      data,
      error
    } = await supabase
      .from("groups")
      .select(
        "name, opening_balance, monthly_contribution"
      )
      .eq("id", groupId)
      .single();


    if (error) {
      throw error;
    }


    if (!data) {

      throw new Error(
        "Group information could not be found."
      );

    }


    document.querySelector("#name")
      .textContent =
      data.name ?? "—";


    document.querySelector("#opening")
      .textContent =
      money(data.opening_balance);


    document.querySelector("#monthly")
      .textContent =
      money(data.monthly_contribution);


  } catch (error) {

    showError(error);

  }

}


document
  .querySelector("#logout")
  .addEventListener(
    "click",
    async () => {

      await supabase.auth.signOut();

      window.location.href =
        "./login.html";

    }
  );


loadGroup();

</script>


</body>
</html>
