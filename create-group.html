<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Group — Chama Live</title><link rel="stylesheet" href="css/app.css"></head><body><div class="auth"><main class="card"><h1>Create your Chama</h1><p class="muted">Create the group and chairperson/admin account.</p><div id="msg" class="alert hidden"></div><form id="form" autocomplete="off"><div class="grid"><div class="field"><label for="groupName">Group name</label><input id="groupName" name="group_name" type="text" required></div><div class="field"><label for="registrationNumber">Registration number</label><input id="registrationNumber" name="registration_number" type="text"></div><div class="field"><label for="groupPhone">Group phone</label><input id="groupPhone" name="group_phone" type="tel" inputmode="tel" autocomplete="tel"></div><div class="field"><label for="groupEmail">Group email</label><input id="groupEmail" name="group_email" type="email" autocomplete="email"></div><div class="field"><label for="chairName">Chairperson full name</label><input id="chairName" name="name" type="text" required autocomplete="name"></div><div class="field"><label for="chairPhone">Chairperson phone</label><input id="chairPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required></div><div class="field"><label for="chairEmail">Chairperson email</label><input id="chairEmail" name="email" type="email" required autocomplete="email"></div></div><button id="submit" class="btn full" style="margin-top:16px">CREATE GROUP</button></form><p class="muted" style="text-align:center"><a href="login.html">Back to login</a></p></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-client.js"></script><script>const db=window.chamaSupabase;const f=document.getElementById('form'),m=document.getElementById('msg'),b=document.getElementById('submit');f.addEventListener('submit',async e=>{e.preventDefault();if(!f.checkValidity()){f.reportValidity();return}b.disabled=true;b.textContent='CREATING...';m.className='alert hidden';try{const v=id=>document.getElementById(id).value.trim();const {data,error}=await db.functions.invoke('create-group',{body:{group_name:v('groupName'),registration_number:v('registrationNumber'),group_phone:v('groupPhone'),group_email:v('groupEmail').toLowerCase(),name:v('chairName'),phone:v('chairPhone'),email:v('chairEmail').toLowerCase()}});if(error)throw error;if(!data?.success)throw new Error(data?.message||'Could not create group.');m.innerHTML='Group created. Your one-time access code is <strong>'+data.access_code+'</strong>. Use the activation link sent to the chairperson email.';m.className='alert success';f.reset()}catch(x){m.textContent=x.message||'Could not create group.';m.className='alert'}finally{b.disabled=false;b.textContent='CREATE GROUP'}});</script></body></html>
