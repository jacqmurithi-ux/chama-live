<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Group — CHAMA LIVE</title><link rel="stylesheet" href="css/app.css"></head><body><main class="auth"><section class="card auth-card"><h1>Create your group</h1><p class="muted">Start managing your chama digitally.</p><div class="form"><div class="field"><label for="name">Group name</label><input id="name" required></div><div class="field"><label for="monthly">Monthly contribution</label><input id="monthly" type="number" min="0" step="0.01"></div><div class="field"><label for="opening">Opening balance</label><input id="opening" type="number" min="0" step="0.01" value="0"></div><button class="btn btn-primary" id="create">Create group</button><div class="error" data-error hidden></div></div></section></main><script type="module">import {supabase} from './js/supabase.js';import {requireAuth,showError} from './js/app.js';await requireAuth();document.querySelector('#create').onclick=async()=>{try{const name=document.querySelector('#name').value.trim();if(!name)throw new Error('Group name is required.');const {error}=await supabase.rpc('create_group',{p_name:name});if(error)throw error;location.href='dashboard.html'}catch(error){showError(error)}};</script></body></html>
