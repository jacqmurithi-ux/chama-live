
<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Confirm Account — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>

<main
  class="main"
  style="max-width:600px;margin:60px auto;"
>

  <section class="card">

    <div
      class="brand"
      style="margin-bottom:20px;"
    >
      CHAMA <span>LIVE</span>
    </div>


    <h1>
      Confirming Your Account
    </h1>


    <p
      id="status"
      class="muted"
    >
      Please wait while we confirm your account...
    </p>


    <div
      id="error"
      class="error"
      hidden
      style="margin-top:20px;"
    ></div>

  </section>

</main>


<script type="module">

import {
  supabase
} from "./js/supabase.js";


const APP_URL =
  "https://jacqmurithi-ux.github.io/chama-live";


const PENDING_KEY =
  "chama_pending_onboarding";


const status =
  document.getElementById("status");


const error =
  document.getElementById("error");


/* =======================================================
   COMPLETE ONBOARDING
======================================================= */

async function completeOnboarding() {

  status.textContent =
    "Creating your group...";


  /* =====================================================
     GET AUTH USER
  ===================================================== */

  const {
    data: userData,
    error: userError
  } =
    await supabase.auth.getUser();


  if (userError) {
    throw userError;
  }


  const user =
    userData?.user;


  if (!user) {

    throw new Error(
      "Your account was confirmed, but an authenticated session could not be established."
    );

  }


  console.log(
    "CHAMA LIVE CONFIRMED USER:",
    user.id
  );


  /* =====================================================
     GET PENDING ONBOARDING
  ===================================================== */

  const stored =
    localStorage.getItem(
      PENDING_KEY
    );


  if (!stored) {

    throw new Error(
      "Your account was confirmed, but your group setup information could not be found. Please start the group registration again."
    );

  }


  let onboardingData;


  try {

    onboardingData =
      JSON.parse(stored);

  } catch {

    localStorage.removeItem(
      PENDING_KEY
    );

    throw new Error(
      "Your saved group setup information is invalid."
    );

  }


  if (
    !onboardingData.groupName ||
    !onboardingData.adminName
  ) {

    throw new Error(
      "Your group setup information is incomplete."
    );

  }


  console.log(
    "CHAMA LIVE PENDING DATA:",
    onboardingData
  );


  /* =====================================================
     CALL SUPABASE ONBOARDING FUNCTION
  ===================================================== */

  const {
    data: onboarding,
    error: onboardingError
  } =
    await supabase.rpc(
      "onboard_new_group",
      {

        /*
         * IMPORTANT:
         *
         * group_id is NOT supplied.
         */

        p_group_name:
          onboardingData.groupName,

        p_category:
          onboardingData.category,

        p_monthly_contribution:
          Number(
            onboardingData.monthlyContribution || 0
          ),

        p_opening_balance:
          Number(
            onboardingData.openingBalance || 0
          ),

        p_description:
          onboardingData.description ||
          null,

        p_admin_name:
          onboardingData.adminName,

        p_admin_phone:
          onboardingData.adminPhone,

        p_country:
          "Kenya"

      }
    );


  if (onboardingError) {
    throw onboardingError;
  }


  console.log(
    "CHAMA LIVE ONBOARDING RESULT:",
    onboarding
  );


  /* =====================================================
     VERIFY
  ===================================================== */

  if (
    !onboarding ||
    onboarding.success !== true
  ) {

    throw new Error(
      "Group onboarding failed."
    );

  }


  if (!onboarding.group_id) {

    throw new Error(
      "Group was created but no group ID was returned."
    );

  }


  /* =====================================================
     SUCCESS
  ===================================================== */

  console.log(
    "CHAMA LIVE GROUP CREATED:",
    onboarding.group_id
  );


  console.log(
    "CHAMA LIVE MEMBER CREATED:",
    onboarding.member_id
  );


  console.log(
    "CHAMA LIVE MEMBER NUMBER:",
    onboarding.member_number
  );


  console.log(
    "CHAMA LIVE ACCESS CODE:",
    onboarding.access_code
  );


  /* =====================================================
     REMOVE TEMPORARY DATA
  ===================================================== */

  localStorage.removeItem(
    PENDING_KEY
  );


  status.textContent =
    "✓ Account confirmed and group created successfully. Redirecting...";


  setTimeout(
    () => {

      window.location.href =
        `${APP_URL}/dashboard.html`;

    },
    800
  );

}


/* =======================================================
   INITIALIZE
======================================================= */

async function init() {

  try {

    status.textContent =
      "Checking your confirmation...";


    /*
     * Supabase's email link should establish
     * the authenticated session.
     */

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabase.auth.getSession();


    if (sessionError) {
      throw sessionError;
    }


    if (!sessionData?.session) {

      throw new Error(
        "Your account was confirmed, but your confirmation session could not be established. Please sign in and try again."
      );

    }


    console.log(
      "CHAMA LIVE: confirmation session established"
    );


    await completeOnboarding();


  } catch (err) {

    console.error(
      "CHAMA LIVE confirmation error:",
      err
    );


    status.textContent =
      "Account confirmation could not be completed.";


    error.textContent =
      err?.message ||
      "Unable to complete account confirmation.";


    error.hidden = false;

  }

}


init();

</script>

</body>

</html>
