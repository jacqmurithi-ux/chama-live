<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Confirm Account — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>

<main
  class="main"
  style="max-width:600px;margin:60px auto;"
>

  <section class="card">

    <div
      class="brand"
      style="margin-bottom:20px;"
    >
      CHAMA <span>LIVE</span>
    </div>


    <h1>
      Confirming Your Account
    </h1>


    <p
      id="status"
      class="muted"
    >
      Please wait while we confirm your account...
    </p>


    <div
      id="error"
      class="error"
      hidden
      style="margin-top:20px;"
    ></div>

  </section>

</main>


<script type="module">

import {
  supabase
} from "./js/supabase.js";


/* =======================================================
   CONFIGURATION
======================================================= */

const APP_URL =
  "https://jacqmurithi-ux.github.io/chama-live";


const LOGIN_URL =
  `${APP_URL}/login.html`;


const DASHBOARD_URL =
  `${APP_URL}/dashboard.html`;


/* =======================================================
   ELEMENTS
======================================================= */

const status =
  document.getElementById(
    "status"
  );


const error =
  document.getElementById(
    "error"
  );


/* =======================================================
   HELPERS
======================================================= */

function setStatus(message) {

  if (status) {

    status.textContent =
      message;

  }

}


function showError(message) {

  console.error(
    "CHAMA LIVE confirmation error:",
    message
  );


  setStatus(
    "Account confirmation could not be completed."
  );


  if (error) {

    error.textContent =
      message ||
      "Unable to complete account confirmation.";

    error.hidden =
      false;

  }

}


/* =======================================================
   COMPLETE ONBOARDING
======================================================= */

async function completeOnboarding(
  user
) {

  const metadata =
    user.user_metadata ||
    {};


  console.log(
    "CHAMA LIVE USER:",
    user.id
  );


  /*
   * Only accounts explicitly carrying the onboarding
   * marker may enter the group-creation boundary.
   */

  const isOnboarding =
    metadata.chama_onboarding === true;


  /*
   * Ordinary existing accounts are not allowed to
   * create a group through this confirmation page.
   */

  if (!isOnboarding) {

    setStatus(
      "Account confirmed. Redirecting to sign in..."
    );


    setTimeout(
      () => {

        window.location.replace(
          LOGIN_URL
        );

      },
      1000
    );


    return;

  }


  /* =====================================================
     READ GROUP INFORMATION
  ====================================================== */

  const groupName =
    String(
      metadata.group_name ||
      ""
    ).trim();


  const category =
    String(
      metadata.category ||
      "other"
    ).trim();


  const monthlyContribution =
    Number(
      metadata.monthly_contribution ||
      0
    );


  const openingBalance =
    Number(
      metadata.opening_balance ||
      0
    );


  const description =
    metadata.description ||
    null;


  const adminName =
    String(
      metadata.admin_name ||
      ""
    ).trim();


  const adminPhone =
    String(
      metadata.admin_phone ||
      ""
    ).trim();


  const country =
    String(
      metadata.country ||
      "Kenya"
    ).trim();


  /* =====================================================
     VALIDATE
  ====================================================== */

  if (!groupName) {

    throw new Error(
      "Your account was confirmed, but your group setup information is missing."
    );

  }


  if (!adminName) {

    throw new Error(
      "Your account was confirmed, but the administrator name is missing."
    );

  }


  if (
    !Number.isFinite(
      monthlyContribution
    ) ||
    monthlyContribution < 0
  ) {

    throw new Error(
      "Your group contribution amount is invalid."
    );

  }


  if (
    !Number.isFinite(
      openingBalance
    ) ||
    openingBalance < 0
  ) {

    throw new Error(
      "Your group opening balance is invalid."
    );

  }


  /* =====================================================
     CREATE GROUP
  ====================================================== */

  setStatus(
    "Email confirmed. Creating your group..."
  );


  const {
    data: onboarding,
    error: onboardingError
  } =
    await supabase.rpc(
      "onboard_new_group",
      {

        p_group_name:
          groupName,

        p_category:
          category,

        p_monthly_contribution:
          monthlyContribution,

        p_opening_balance:
          openingBalance,

        p_description:
          description,

        p_admin_name:
          adminName,

        p_admin_phone:
          adminPhone,

        p_country:
          country

      }
    );


  if (onboardingError) {

    throw onboardingError;

  }


  console.log(
    "CHAMA LIVE ONBOARDING RESULT:",
    onboarding
  );


  /* =====================================================
     VERIFY RESULT
  ====================================================== */

  if (
    !onboarding ||
    onboarding.success !== true
  ) {

    throw new Error(
      "Group onboarding did not complete successfully."
    );

  }


  if (!onboarding.group_id) {

    throw new Error(
      "Group was created but no group ID was returned."
    );

  }


  /* =====================================================
     RECORD SUCCESSFUL NEW-GROUP EVENT
  ====================================================== */

  /*
   * The group has now been positively verified as created.
   *
   * Getting Started reads this one-time signal and
   * displays the onboarding popup.
   *
   * No redirect or database behavior is changed.
   */

  sessionStorage.setItem(
    "chama_live_getting_started_event",
    "new-group"
  );


  /* =====================================================
     CLEAN AUTH METADATA
  ====================================================== */

  const cleanedMetadata = {
    ...metadata
  };


  delete cleanedMetadata.chama_onboarding;

  delete cleanedMetadata.admin_name;

  delete cleanedMetadata.admin_phone;

  delete cleanedMetadata.group_name;

  delete cleanedMetadata.category;

  delete cleanedMetadata.monthly_contribution;

  delete cleanedMetadata.opening_balance;

  delete cleanedMetadata.description;

  delete cleanedMetadata.country;


  /*
   * Metadata cleanup is non-blocking.
   *
   * Group creation has already completed successfully.
   */

  const {
    error: metadataError
  } =
    await supabase.auth.updateUser({
      data:
        cleanedMetadata
    });


  if (metadataError) {

    console.warn(
      "CHAMA LIVE metadata cleanup warning:",
      metadataError
    );

  }


  /* =====================================================
     SUCCESS
  ====================================================== */

  setStatus(
    "✓ Account confirmed and group created successfully. Redirecting..."
  );


  setTimeout(
    () => {

      window.location.replace(
        DASHBOARD_URL
      );

    },
    1000
  );

}


/* =======================================================
   INITIALIZE
======================================================= */

async function init() {

  try {

    setStatus(
      "Processing your email confirmation..."
    );


    /* ===================================================
       STEP 1 — CHECK AUTH CALLBACK
    =================================================== */

    const url =
      new URL(
        window.location.href
      );


    const errorParam =
      url.searchParams.get(
        "error"
      );


    const errorDescription =
      url.searchParams.get(
        "error_description"
      );


    if (errorParam) {

      throw new Error(
        errorDescription ||
        "The email confirmation link is invalid or has expired."
      );

    }


    /* ===================================================
       STEP 2 — PKCE CALLBACK
    =================================================== */

    /*
     * supabase.js is configured with:
     *
     *   detectSessionInUrl: true
     *   flowType: "pkce"
     *
     * Supabase Auth therefore processes the returned
     * authorization code.
     *
     * Do NOT call exchangeCodeForSession() here.
     */


    setStatus(
      "Confirming your email address..."
    );


    /* ===================================================
       STEP 3 — WAIT FOR AUTH SESSION
    =================================================== */

    let session =
      null;


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabase.auth.getSession();


    if (sessionError) {

      throw sessionError;

    }


    session =
      sessionData?.session ||
      null;


    if (!session) {

      session =
        await new Promise(
          async resolve => {

            let settled =
              false;

            let subscription =
              null;

            let timeout =
              null;


            const finish =
              value => {

                if (settled) {

                  return;

                }


                settled =
                  true;


                if (timeout) {

                  clearTimeout(
                    timeout
                  );

                }


                if (subscription) {

                  subscription.unsubscribe();

                }


                resolve(
                  value ||
                  null
                );

              };


            const {
              data: authListener
            } =
              supabase.auth.onAuthStateChange(
                (
                  event,
                  nextSession
                ) => {

                  console.log(
                    "CHAMA LIVE AUTH EVENT:",
                    event
                  );


                  if (
                    nextSession &&
                    (
                      event ===
                        "SIGNED_IN" ||
                      event ===
                        "INITIAL_SESSION" ||
                      event ===
                        "TOKEN_REFRESHED"
                    )
                  ) {

                    finish(
                      nextSession
                    );

                  }

                }
              );


            subscription =
              authListener?.subscription ||
              null;


            timeout =
              setTimeout(
                async () => {

                  try {

                    const {
                      data:
                        finalSessionData
                    } =
                      await supabase.auth.getSession();


                    finish(
                      finalSessionData?.session ||
                      null
                    );

                  }

                  catch (
                    sessionCheckError
                  ) {

                    console.error(
                      "CHAMA LIVE session retry error:",
                      sessionCheckError
                    );


                    finish(
                      null
                    );

                  }

                },
                2000
              );


            /*
             * Re-check after registering the listener.
             *
             * This prevents a race where the session
             * becomes available between the first
             * getSession() call and listener setup.
             */

            try {

              const {
                data:
                  currentSessionData
              } =
                await supabase.auth.getSession();


              if (
                currentSessionData?.session
              ) {

                finish(
                  currentSessionData.session
                );

              }

            }

            catch (
              currentSessionError
            ) {

              console.error(
                "CHAMA LIVE current session check error:",
                currentSessionError
              );

            }

          }
        );

    }


    if (!session) {

      throw new Error(
        "Your email was confirmed, but a login session could not be established. Please sign in and try again."
      );

    }


    /* ===================================================
       STEP 4 — CLEAN AUTH CALLBACK URL
    =================================================== */

    window.history.replaceState(
      {},
      document.title,
      `${APP_URL}/confirm.html`
    );


    /* ===================================================
       STEP 5 — GET CURRENT USER
    =================================================== */

    setStatus(
      "Loading your account..."
    );


    const {
      data: userData,
      error: userError
    } =
      await supabase.auth.getUser();


    if (userError) {

      throw userError;

    }


    const user =
      userData?.user;


    if (!user) {

      throw new Error(
        "The confirmed user could not be found."
      );

    }


    console.log(
      "CHAMA LIVE CONFIRMED USER:",
      user.id
    );


    /* ===================================================
       STEP 6 — COMPLETE GROUP ONBOARDING
    =================================================== */

    await completeOnboarding(
      user
    );

  }

  catch (err) {

    console.error(
      "CHAMA LIVE confirmation error:",
      err
    );


    showError(
      err?.message ||
      "Unable to complete account confirmation."
    );

  }

}


/* =======================================================
   START
======================================================= */

init();

</script>


</body>

</html>
