<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Confirm Account — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>

<main
  class="main"
  style="max-width:600px;margin:60px auto;"
>

  <section class="card">

    <div
      class="brand"
      style="margin-bottom:20px;"
    >
      CHAMA <span>LIVE</span>
    </div>


    <h1>
      Confirming Your Account
    </h1>


    <p
      id="status"
      class="muted"
    >
      Please wait while we confirm your account...
    </p>


    <div
      id="error"
      class="error"
      hidden
      style="margin-top:20px;"
    ></div>

  </section>

</main>


<script type="module">

  import {
    supabase
  } from "./js/supabase.js";


  /* =====================================================
     CONFIGURATION
  ===================================================== */

  const APP_URL =
    "https://jacqmurithi-ux.github.io/chama-live";


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const status =
    document.getElementById("status");

  const error =
    document.getElementById("error");


  /* =====================================================
     HELPERS
  ===================================================== */

  function setStatus(message) {

    if (status) {
      status.textContent = message;
    }

  }


  function showError(message) {

    console.error(
      "CHAMA LIVE confirmation error:",
      message
    );


    if (error) {

      error.textContent =
        message;

      error.hidden = false;

    }

  }


  /* =====================================================
     COMPLETE ONBOARDING
  ===================================================== */

  async function completeOnboarding() {

    /* ===================================================
       1. CHECK SESSION
    =================================================== */

    setStatus(
      "Checking your confirmation..."
    );


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabase.auth.getSession();


    if (sessionError) {

      throw sessionError;

    }


    const session =
      sessionData?.session;


    if (!session) {

      throw new Error(
        "Your confirmation session could not be established. Please request a new confirmation email."
      );

    }


    console.log(
      "CHAMA LIVE: authenticated session found"
    );


    /* ===================================================
       2. GET AUTH USER
    =================================================== */

    setStatus(
      "Verifying your account..."
    );


    const {
      data: userData,
      error: userError
    } =
      await supabase.auth.getUser();


    if (userError) {

      throw userError;

    }


    const user =
      userData?.user;


    if (!user) {

      throw new Error(
        "Authenticated user could not be found."
      );

    }


    console.log(
      "CHAMA LIVE USER:",
      user.id
    );


    console.log(
      "CHAMA LIVE EMAIL:",
      user.email
    );


    /* ===================================================
       3. GET ONBOARDING DATA
    =================================================== */

    setStatus(
      "Loading your group setup..."
    );


    /*
     * signup.js stored the onboarding
     * information inside Supabase Auth
     * user metadata.
     *
     * Password is NOT stored here.
     */

    const onboardingData =
      user.user_metadata?.chama_onboarding;


    if (!onboardingData) {

      throw new Error(
        "Your account was confirmed, but your group setup information could not be found. Please contact support."
      );

    }


    console.log(
      "CHAMA LIVE ONBOARDING DATA:",
      onboardingData
    );


    /* ===================================================
       4. VALIDATE ONBOARDING DATA
    =================================================== */

    if (
      !onboardingData.group_name
    ) {

      throw new Error(
        "Group name is missing from your onboarding information."
      );

    }


    if (
      !onboardingData.admin_name
    ) {

      throw new Error(
        "Administrator name is missing from your onboarding information."
      );

    }


    if (
      !onboardingData.admin_phone
    ) {

      throw new Error(
        "Administrator phone number is missing from your onboarding information."
      );

    }


    /* ===================================================
       5. CREATE GROUP
    =================================================== */

    setStatus(
      "Email confirmed. Creating your group..."
    );


    /*
     * IMPORTANT:
     *
     * There is NO group_id here.
     *
     * onboard_new_group() obtains:
     *
     * auth.uid()
     *
     * from the authenticated Supabase session.
     *
     * The database creates:
     *
     * groups
     * members
     * financial_periods
     */

    const {
      data: onboarding,
      error: onboardingError
    } =
      await supabase.rpc(
        "onboard_new_group",
        {

          p_group_name:
            onboardingData.group_name,

          p_category:
            onboardingData.category ||
            "other",

          p_monthly_contribution:
            Number(
              onboardingData.monthly_contribution || 0
            ),

          p_opening_balance:
            Number(
              onboardingData.opening_balance || 0
            ),

          p_description:
            onboardingData.description ||
            null,

          p_admin_name:
            onboardingData.admin_name,

          p_admin_phone:
            onboardingData.admin_phone,

          p_country:
            onboardingData.country ||
            "Kenya"

        }
      );


    if (onboardingError) {

      throw onboardingError;

    }


    console.log(
      "CHAMA LIVE ONBOARDING RESULT:",
      onboarding
    );


    /* ===================================================
       6. VERIFY ONBOARDING
    =================================================== */

    if (
      !onboarding ||
      onboarding.success !== true
    ) {

      throw new Error(
        "Group onboarding did not complete successfully."
      );

    }


    if (!onboarding.group_id) {

      throw new Error(
        "Group was created but no group ID was returned."
      );

    }


    /* ===================================================
       7. DISPLAY SUCCESS DETAILS
    =================================================== */

    console.log(
      "CHAMA LIVE GROUP ID:",
      onboarding.group_id
    );


    console.log(
      "CHAMA LIVE MEMBER ID:",
      onboarding.member_id
    );


    console.log(
      "CHAMA LIVE MEMBER NUMBER:",
      onboarding.member_number
    );


    console.log(
      "CHAMA LIVE ACCESS CODE:",
      onboarding.access_code
    );


    setStatus(
      "✓ Your email has been confirmed and your group has been created successfully."
    );


    /* ===================================================
       8. CLEAR ONBOARDING METADATA
    =================================================== */

    /*
     * The onboarding information has now
     * been consumed.
     *
     * Remove it from Auth metadata.
     */

    const {
      error: metadataError
    } =
      await supabase.auth.updateUser({

        data: {

          chama_onboarding: null

        }

      });


    if (metadataError) {

      /*
       * Do not fail onboarding just because
       * metadata cleanup failed.
       */

      console.warn(
        "CHAMA LIVE: Could not clear onboarding metadata:",
        metadataError
      );

    }


    /* ===================================================
       9. REDIRECT
    =================================================== */

    setStatus(
      "✓ Setup complete. Opening your dashboard..."
    );


    setTimeout(
      () => {

        window.location.href =
          `${APP_URL}/dashboard.html`;

      },
      1200
    );

  }


  /* =====================================================
     START
  ===================================================== */

  completeOnboarding()
    .catch(
      (err) => {

        console.error(
          "CHAMA LIVE confirmation error:",
          err
        );


        setStatus(
          "Account confirmation could not be completed."
        );


        showError(
          err?.message ||
          "Unable to complete account confirmation."
        );

      }
    );

</script>

</body>

</html>
