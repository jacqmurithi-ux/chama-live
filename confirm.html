
<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Confirm Account — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>

<body>

<main
  class="main"
  style="max-width:600px;margin:60px auto;"
>

  <section class="card">

    <div
      class="brand"
      style="margin-bottom:20px;"
    >
      CHAMA <span>LIVE</span>
    </div>


    <h1>
      Confirming Your Account
    </h1>


    <p
      id="status"
      class="muted"
    >
      Please wait while we confirm your account...
    </p>


    <div
      id="error"
      class="error"
      hidden
      style="margin-top:20px;"
    ></div>

  </section>

</main>


<script type="module">

import {
  supabase
} from "./js/supabase.js";


/* =======================================================
   CONFIGURATION
======================================================= */

const APP_URL =
  "https://jacqmurithi-ux.github.io/chama-live";


/* =======================================================
   ELEMENTS
======================================================= */

const status =
  document.getElementById("status");

const error =
  document.getElementById("error");


/* =======================================================
   HELPERS
======================================================= */

function setStatus(message) {

  if (status) {
    status.textContent = message;
  }

}


function showError(message) {

  console.error(
    "CHAMA LIVE confirmation error:",
    message
  );


  if (error) {

    error.textContent =
      message;

    error.hidden = false;

  }

}


/* =======================================================
   COMPLETE ONBOARDING
======================================================= */

async function completeOnboarding() {

  setStatus(
    "Checking your confirmed account..."
  );


  /* =====================================================
     GET USER
  ===================================================== */

  const {
    data: userData,
    error: userError
  } =
    await supabase.auth.getUser();


  if (userError) {

    throw userError;

  }


  const user =
    userData?.user;


  if (!user) {

    throw new Error(
      "Your confirmation session could not be established. Please sign in and try again."
    );

  }


  console.log(
    "CHAMA LIVE CONFIRMED USER:",
    user.id
  );


  console.log(
    "CHAMA LIVE USER METADATA:",
    user.user_metadata
  );


  /* =====================================================
     CHECK ONBOARDING METADATA
  ===================================================== */

  const metadata =
    user.user_metadata || {};


  if (
    metadata.onboarding_type !==
    "new_group"
  ) {

    setStatus(
      "Your account has been confirmed. Redirecting to login..."
    );


    setTimeout(
      () => {

        window.location.href =
          `${APP_URL}/login.html`;

      },
      1000
    );


    return;

  }


  /* =====================================================
     READ DATA
  ===================================================== */

  const groupName =
    metadata.group_name;

  const category =
    metadata.group_category || "other";

  const monthlyContribution =
    Number(
      metadata.monthly_contribution || 0
    );

  const openingBalance =
    Number(
      metadata.opening_balance || 0
    );

  const description =
    metadata.group_description || null;

  const adminName =
    metadata.admin_name ||
    metadata.full_name ||
    "";

  const adminPhone =
    metadata.admin_phone ||
    "";


  if (!groupName) {

    throw new Error(
      "Your account was confirmed, but your group name could not be found."
    );

  }


  if (!adminName) {

    throw new Error(
      "Your account was confirmed, but the administrator name could not be found."
    );

  }


  /* =====================================================
     CREATE GROUP
  ===================================================== */

  setStatus(
    "Email confirmed. Creating your group..."
  );


  console.log(
    "CHAMA LIVE: Calling onboard_new_group..."
  );


  const {
    data: onboarding,
    error: onboardingError
  } =
    await supabase.rpc(
      "onboard_new_group",
      {

        /*
         * NO group_id.
         *
         * The database gets:
         *
         * auth.uid()
         */

        p_group_name:
          groupName,

        p_category:
          category,

        p_monthly_contribution:
          monthlyContribution,

        p_opening_balance:
          openingBalance,

        p_description:
          description,

        p_admin_name:
          adminName,

        p_admin_phone:
          adminPhone,

        p_country:
          "Kenya"

      }
    );


  if (onboardingError) {

    throw onboardingError;

  }


  console.log(
    "CHAMA LIVE ONBOARDING RESULT:",
    onboarding
  );


  /* =====================================================
     VERIFY
  ===================================================== */

  if (
    !onboarding ||
    onboarding.success !== true
  ) {

    throw new Error(
      "Group onboarding failed."
    );

  }


  if (!onboarding.group_id) {

    throw new Error(
      "Group onboarding completed without a group ID."
    );

  }


  /* =====================================================
     SUCCESS
  ===================================================== */

  console.log(
    "======================================"
  );

  console.log(
    "CHAMA LIVE ONBOARDING SUCCESS"
  );

  console.log(
    "User:",
    user.id
  );

  console.log(
    "Group:",
    onboarding.group_id
  );

  console.log(
    "Member:",
    onboarding.member_id
  );

  console.log(
    "Member Number:",
    onboarding.member_number
  );

  console.log(
    "Access Code:",
    onboarding.access_code
  );

  console.log(
    "======================================"
  );


  setStatus(
    "✓ Account confirmed and group created successfully. Redirecting..."
  );


  /*
   * Do NOT expose group_id in URL.
   */

  setTimeout(
    () => {

      window.location.href =
        `${APP_URL}/dashboard.html`;

    },
    1000
  );

}


/* =======================================================
   WAIT FOR AUTH SESSION
======================================================= */

async function init() {

  try {

    setStatus(
      "Confirming your email..."
    );


    /*
     * Supabase automatically processes the
     * authentication redirect when the client
     * is initialized.
     *
     * getSession() retrieves the resulting
     * session from the client storage.
     */

    const {
      data,
      error: sessionError
    } =
      await supabase.auth.getSession();


    if (sessionError) {

      throw sessionError;

    }


    if (data?.session) {

      await completeOnboarding();

      return;

    }


    /*
     * Sometimes the auth redirect event is
     * still being processed.
     *
     * Wait for the auth state event.
     */

    setStatus(
      "Waiting for confirmation session..."
    );


    let handled = false;


    const {
      data: listener
    } =
      supabase.auth.onAuthStateChange(
        async (event, session) => {

          console.log(
            "CHAMA LIVE AUTH EVENT:",
            event
          );


          if (
            handled
          ) {
            return;
          }


          if (
            session &&
            (
              event === "SIGNED_IN" ||
              event === "INITIAL_SESSION"
            )
          ) {

            handled = true;


            try {

              await completeOnboarding();

            } catch (err) {

              showError(
                err?.message ||
                "Unable to complete group onboarding."
              );

              setStatus(
                "Account confirmation completed, but group setup failed."
              );

            }


            listener?.subscription?.unsubscribe();

          }

        }
      );


    /*
     * Give the auth client time to
     * process the redirect.
     */

    setTimeout(
      async () => {

        if (handled) {
          return;
        }


        const {
          data: retryData
        } =
          await supabase.auth.getSession();


        if (
          retryData?.session
        ) {

          handled = true;

          try {

            await completeOnboarding();

          } catch (err) {

            showError(
              err?.message ||
              "Unable to complete group onboarding."
            );

            setStatus(
              "Account confirmation completed, but group setup failed."
            );

          }

          listener?.subscription?.unsubscribe();

          return;

        }


        showError(
          "Your confirmation session could not be established. Please sign in and try again."
        );

        setStatus(
          "Account confirmation could not be completed."
        );


        listener?.subscription?.unsubscribe();

      },
      2500
    );


  } catch (err) {

    console.error(
      "CHAMA LIVE confirmation error:",
      err
    );


    setStatus(
      "Account confirmation could not be completed."
    );


    showError(
      err?.message ||
      "Unable to complete account confirmation."
    );

  }

}


init();

</script>

</body>

</html>
