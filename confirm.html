<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Confirm Account — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>

<main
  class="main"
  style="max-width:600px;margin:60px auto;"
>

  <section class="card">

    <div
      class="brand"
      style="margin-bottom:20px;"
    >
      CHAMA <span>LIVE</span>
    </div>


    <h1>
      Confirming Your Account
    </h1>


    <p
      id="status"
      class="muted"
    >
      Please wait while we confirm your account...
    </p>


    <div
      id="error"
      class="error"
      hidden
      style="margin-top:20px;"
    ></div>

  </section>

</main>


<script type="module">

import {
  supabase
} from "./js/supabase.js";


/* =======================================================
   CONFIGURATION
======================================================= */

const APP_URL =
  window.location.origin;


const LOGIN_URL =
  `${APP_URL}/login.html`;


/* =======================================================
   ELEMENTS
======================================================= */

const status =
  document.getElementById(
    "status"
  );


const error =
  document.getElementById(
    "error"
  );


/* =======================================================
   HELPERS
======================================================= */

function setStatus(message) {

  if (status) {

    status.textContent =
      message;

  }

}


function showError(message) {

  console.error(
    "CHAMA LIVE confirmation error:",
    message
  );


  setStatus(
    "Account confirmation could not be completed."
  );


  if (error) {

    error.textContent =
      message ||
      "Unable to complete account confirmation.";

    error.hidden =
      false;

  }

}


/* =======================================================
   SUBMIT GROUP APPLICATION
   -------------------------------------------------------
   IMPORTANT
   -------------------------------------------------------
   Email confirmation does NOT create a group.

   The authenticated user submits a pending application
   through the server-side RPC:

     submit_group_application(
       p_group_name,
       p_category,
       p_description,
       p_admin_name,
       p_admin_phone,
       p_country,
       p_location,
       p_town
     )

   Platform Admin approval remains the group-creation
   boundary.
======================================================= */

async function submitGroupApplication(
  user
) {

  const metadata =
    user.user_metadata ||
    {};


  console.log(
    "CHAMA LIVE CONFIRMED USER:",
    user.id
  );


  /* =====================================================
     ONBOARDING MARKER
  ====================================================== */

  /*
   * Only accounts explicitly carrying the onboarding
   * marker may submit a new group application through
   * this confirmation boundary.
   *
   * Ordinary existing accounts are redirected to login.
   */

  const isOnboarding =
    metadata.chama_onboarding === true;


  if (!isOnboarding) {

    setStatus(
      "Account confirmed. Redirecting to sign in..."
    );


    setTimeout(
      () => {

        window.location.replace(
          LOGIN_URL
        );

      },
      1000
    );


    return;

  }


  /* =====================================================
     READ APPLICATION INFORMATION
  ====================================================== */

  const groupName =
    String(
      metadata.group_name ||
      ""
    ).trim();


  const category =
    String(
      metadata.category ||
      "other"
    ).trim();


  const description =
    metadata.description ?
      String(
        metadata.description
      ).trim() :
      null;


  const adminName =
    String(
      metadata.admin_name ||
      ""
    ).trim();


  const adminPhone =
    String(
      metadata.admin_phone ||
      ""
    ).trim();


  const country =
    String(
      metadata.country ||
      "Kenya"
    ).trim();


  const location =
    String(
      metadata.location ||
      ""
    ).trim();


  const town =
    String(
      metadata.town ||
      ""
    ).trim();


  /* =====================================================
     VALIDATE
  ====================================================== */

  if (!groupName) {

    throw new Error(
      "Your account was confirmed, but your group name is missing."
    );

  }


  if (!adminName) {

    throw new Error(
      "Your account was confirmed, but the administrator name is missing."
    );

  }


  if (!adminPhone) {

    throw new Error(
      "Your account was confirmed, but the administrator phone number is missing."
    );

  }


  if (!location) {

    throw new Error(
      "Your account was confirmed, but the group location is missing."
    );

  }


  if (!town) {

    throw new Error(
      "Your account was confirmed, but the town is missing."
    );

  }


  /* =====================================================
     SUBMIT APPLICATION
  ====================================================== */

  setStatus(
    "Email confirmed. Submitting your group application for review..."
  );


  const {
    data: application,
    error: applicationError
  } =
    await supabase.rpc(
      "submit_group_application",
      {

        p_group_name:
          groupName,

        p_category:
          category,

        p_description:
          description,

        p_admin_name:
          adminName,

        p_admin_phone:
          adminPhone,

        p_country:
          country,

        p_location:
          location,

        p_town:
          town

      }
    );


  if (applicationError) {

    throw applicationError;

  }


  console.log(
    "CHAMA LIVE GROUP APPLICATION RESULT:",
    application
  );


  /* =====================================================
     VERIFY RESULT
  ====================================================== */

  if (
    !application ||
    application.success !== true
  ) {

    throw new Error(
      "Your group application could not be submitted successfully."
    );

  }


  if (!application.application_id) {

    throw new Error(
      "Your application was submitted, but no application ID was returned."
    );

  }


  /* =====================================================
     VERIFY PENDING STATE
  ====================================================== */

  if (
    application.status !==
    "pending"
  ) {

    throw new Error(
      "Your application was submitted, but its review status could not be confirmed."
    );

  }


  /* =====================================================
     SUCCESS
  ====================================================== */

  /*
   * IMPORTANT:
   *
   * No group was created here.
   *
   * The database has only accepted the authenticated
   * group application.
   *
   * Platform Admin approval remains responsible for:
   *
   *   group creation
   *   creator member creation
   *   financial period creation
   *   subscription initialization
   *   invoice/cycle initialization
   *
   * The user therefore stops at the pending-review
   * boundary.
   */

  setStatus(
    "✓ Email confirmed and group application submitted successfully. Your application is now pending platform-admin review."
  );


  /*
   * Do not redirect to the dashboard.
   *
   * The account does not have an approved group yet.
   *
   * Keep the user on this confirmation page so the
   * application remains explicitly separated from
   * group creation.
   */

}


/* =======================================================
   INITIALIZE
======================================================= */

async function init() {

  try {

    setStatus(
      "Processing your email confirmation..."
    );


    /* ===================================================
       STEP 1 — CHECK AUTH CALLBACK
    =================================================== */

    const url =
      new URL(
        window.location.href
      );


    const errorParam =
      url.searchParams.get(
        "error"
      );


    const errorDescription =
      url.searchParams.get(
        "error_description"
      );


    if (errorParam) {

      throw new Error(
        errorDescription ||
        "The email confirmation link is invalid or has expired."
      );

    }


    /* ===================================================
       STEP 2 — PKCE CALLBACK
    =================================================== */

    /*
     * CHAMA LIVE uses:
     *
     *   flowType: "pkce"
     *
     * When Supabase returns an authorization code,
     * explicitly exchange that code for the authenticated
     * session.
     *
     * This is the critical session-establishment step.
     */

    setStatus(
      "Confirming your email address..."
    );


    let session =
      null;


    const code =
      url.searchParams.get(
        "code"
      );


    if (code) {

      console.log(
        "CHAMA LIVE: PKCE authorization code detected."
      );


      const {
        data: exchangeData,
        error: exchangeError
      } =
        await supabase.auth.exchangeCodeForSession(
          code
        );


      if (exchangeError) {

        throw exchangeError;

      }


      session =
        exchangeData?.session ||
        null;


      if (!session) {

        throw new Error(
          "Email confirmation succeeded, but Supabase did not return a login session."
        );

      }


      console.log(
        "CHAMA LIVE: PKCE session established."
      );

    }


    /*
     * If there was no authorization code, check whether
     * Supabase already has an authenticated session.
     *
     * This also supports callbacks where the Supabase
     * client has already processed the authentication URL.
     */

    if (!session) {

      const {
        data: existingSessionData,
        error: existingSessionError
      } =
        await supabase.auth.getSession();


      if (existingSessionError) {

        throw existingSessionError;

      }


      session =
        existingSessionData?.session ||
        null;

    }


    /* ===================================================
       STEP 3 — WAIT FOR AUTH SESSION
    =================================================== */

    /*
     * Normally the PKCE exchange above establishes the
     * session immediately.
     *
     * The fallback listener protects against a small
     * initialization race in which the Supabase client
     * has not finished restoring the session yet.
     */

    if (!session) {

      session =
        await new Promise(
          async resolve => {

            let settled =
              false;

            let subscription =
              null;

            let timeout =
              null;


            const finish =
              value => {

                if (settled) {

                  return;

                }


                settled =
                  true;


                if (timeout) {

                  clearTimeout(
                    timeout
                  );

                }


                if (subscription) {

                  subscription.unsubscribe();

                }


                resolve(
                  value ||
                  null
                );

              };


            const {
              data: authListener
            } =
              await supabase.auth.onAuthStateChange(
                (
                  event,
                  nextSession
                ) => {

                  console.log(
                    "CHAMA LIVE AUTH EVENT:",
                    event
                  );


                  if (
                    nextSession &&
                    (
                      event ===
                        "SIGNED_IN" ||
                      event ===
                        "INITIAL_SESSION" ||
                      event ===
                        "TOKEN_REFRESHED"
                    )
                  ) {

                    finish(
                      nextSession
                    );

                  }

                }
              );


            subscription =
              authListener?.subscription ||
              null;


            timeout =
              setTimeout(
                async () => {

                  try {

                    const {
                      data:
                        finalSessionData
                    } =
                      await supabase.auth.getSession();


                    finish(
                      finalSessionData?.session ||
                      null
                    );

                  }

                  catch (
                    sessionCheckError
                  ) {

                    console.error(
                      "CHAMA LIVE session retry error:",
                      sessionCheckError
                    );


                    finish(
                      null
                    );

                  }

                },
                2000
              );


            /*
             * Re-check after registering the listener.
             *
             * This prevents a race where the session
             * becomes available between the first
             * getSession() call and listener setup.
             */

            try {

              const {
                data:
                  currentSessionData
              } =
                await supabase.auth.getSession();


              if (
                currentSessionData?.session
              ) {

                finish(
                  currentSessionData.session
                );

              }

            }

            catch (
              currentSessionError
            ) {

              console.error(
                "CHAMA LIVE current session check error:",
                currentSessionError
              );

            }

          }
        );

    }


    if (!session) {

      throw new Error(
        "Your email was confirmed, but a login session could not be established. Please sign in and try again."
      );

    }


    /* ===================================================
       STEP 4 — CLEAN AUTH CALLBACK URL
    =================================================== */

    /*
     * Remove the PKCE code and authentication parameters
     * from the browser URL after the session has been
     * established.
     */

    window.history.replaceState(
      {},
      document.title,
      `${APP_URL}/confirm.html`
    );


    /* ===================================================
       STEP 5 — GET CURRENT USER
    =================================================== */

    setStatus(
      "Loading your account..."
    );


    const {
      data: userData,
      error: userError
    } =
      await supabase.auth.getUser();


    if (userError) {

      throw userError;

    }


    const user =
      userData?.user;


    if (!user) {

      throw new Error(
        "The confirmed user could not be found."
      );

    }


    console.log(
      "CHAMA LIVE CONFIRMED USER:",
      user.id
    );


    /* ===================================================
       STEP 6 — SUBMIT GROUP APPLICATION
    =================================================== */

    await submitGroupApplication(
      user
    );

  }

  catch (err) {

    console.error(
      "CHAMA LIVE confirmation error:",
      err
    );


    showError(
      err?.message ||
      "Unable to complete account confirmation."
    );

  }

}


/* =======================================================
   START
======================================================= */

init();

</script>


</body>

</html>
