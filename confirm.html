<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Confirm Account — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>


<main
  class="main"
  style="max-width:600px;margin:60px auto;"
>


  <section class="card">


    <div
      class="brand"
      style="margin-bottom:20px;"
    >

      CHAMA <span>LIVE</span>

    </div>


    <h1>
      Confirming Your Account
    </h1>


    <p
      id="status"
      class="muted"
    >
      Please wait while we confirm your account...
    </p>


    <div
      id="error"
      class="error"
      hidden
      style="margin-top:20px;"
    ></div>


  </section>


</main>



<script type="module">

import { supabase } from "./js/supabase.js";


const APP_URL =
  "https://jacqmurithi-ux.github.io/chama-live";


const status =
  document.getElementById("status");


const error =
  document.getElementById("error");



function showError(message) {

  console.error(
    "CHAMA LIVE confirmation error:",
    message
  );


  status.textContent =
    "Account confirmation could not be completed.";


  error.textContent =
    message;


  error.hidden = false;

}



async function init() {

  try {


    /* ===================================================
       STEP 1 — PROCESS CONFIRMATION CODE
    =================================================== */

    status.textContent =
      "Processing your email confirmation...";


    const params =
      new URLSearchParams(
        window.location.search
      );


    const code =
      params.get("code");


    /*
     * Supabase email confirmation using
     * PKCE normally returns ?code=...
     */

    if (code) {

      const {
        error: exchangeError
      } =
        await supabase.auth.exchangeCodeForSession(
          code
        );


      if (exchangeError) {

        throw exchangeError;

      }


      /*
       * Remove the confirmation code
       * from the browser address bar.
       */

      window.history.replaceState(
        {},
        document.title,
        `${APP_URL}/confirm.html`
      );

    }


    /* ===================================================
       STEP 2 — GET SESSION
    =================================================== */

    status.textContent =
      "Confirmation successful. Loading your account...";


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabase.auth.getSession();


    if (sessionError) {

      throw sessionError;

    }


    const session =
      sessionData?.session;


    if (!session) {

      throw new Error(
        "Your confirmation was received, but a login session could not be established. Please sign in and try again."
      );

    }


    const user =
      session.user;


    console.log(
      "CHAMA LIVE CONFIRMED USER:",
      user.id
    );


    /* ===================================================
       STEP 3 — GET ONBOARDING DATA
    =================================================== */

    /*
     * We no longer use sessionStorage.
     *
     * The signup information was stored
     * in the Auth user's metadata.
     */

    const metadata =
      user.user_metadata || {};


    console.log(
      "CHAMA LIVE USER METADATA:",
      metadata
    );


    const isOnboarding =
      metadata.chama_onboarding === true;


    /* ===================================================
       EXISTING ACCOUNT
    =================================================== */

    if (!isOnboarding) {

      status.textContent =
        "Account confirmed. Redirecting to sign in...";


      setTimeout(() => {

        window.location.href =
          `${APP_URL}/login.html`;

      }, 1000);


      return;

    }


    /* ===================================================
       VALIDATE ONBOARDING DATA
    =================================================== */

    const groupName =
      metadata.group_name;


    const category =
      metadata.category || "other";


    const monthlyContribution =
      Number(
        metadata.monthly_contribution || 0
      );


    const openingBalance =
      Number(
        metadata.opening_balance || 0
      );


    const description =
      metadata.description || null;


    const adminName =
      metadata.admin_name || "";


    const adminPhone =
      metadata.admin_phone || "";


    if (!groupName) {

      throw new Error(
        "Your account is confirmed, but the group name could not be found."
      );

    }


    /* ===================================================
       STEP 4 — CREATE GROUP
    =================================================== */

    status.textContent =
      "Email confirmed. Creating your group...";


    const {
      data: onboarding,
      error: onboardingError
    } =
      await supabase.rpc(
        "onboard_new_group",
        {

          /*
           * NO group_id.
           */

          p_group_name:
            groupName,

          p_category:
            category,

          p_monthly_contribution:
            monthlyContribution,

          p_opening_balance:
            openingBalance,

          p_description:
            description,

          p_admin_name:
            adminName,

          p_admin_phone:
            adminPhone,

          p_country:
            "Kenya"

        }
      );


    if (onboardingError) {

      throw onboardingError;

    }


    console.log(
      "CHAMA LIVE ONBOARDING:",
      onboarding
    );


    /* ===================================================
       STEP 5 — VERIFY
    =================================================== */

    if (
      !onboarding ||
      onboarding.success !== true
    ) {

      throw new Error(
        "Group onboarding did not complete successfully."
      );

    }


    if (!onboarding.group_id) {

      throw new Error(
        "Group was created but no group ID was returned."
      );

    }


    console.log(
      "CHAMA LIVE GROUP CREATED:",
      onboarding.group_id
    );


    console.log(
      "CHAMA LIVE MEMBER CREATED:",
      onboarding.member_id
    );


    console.log(
      "CHAMA LIVE MEMBER NUMBER:",
      onboarding.member_number
    );


    console.log(
      "CHAMA LIVE ACCESS CODE:",
      onboarding.access_code
    );


    /* ===================================================
       STEP 6 — REMOVE ONBOARDING METADATA
    =================================================== */

    /*
     * The metadata was only temporary.
     *
     * Do not keep group setup information
     * in the user's metadata after onboarding.
     */

    const cleanedMetadata = {
      ...metadata
    };


    delete cleanedMetadata.chama_onboarding;
    delete cleanedMetadata.admin_name;
    delete cleanedMetadata.admin_phone;
    delete cleanedMetadata.group_name;
    delete cleanedMetadata.category;
    delete cleanedMetadata.monthly_contribution;
    delete cleanedMetadata.opening_balance;
    delete cleanedMetadata.description;
    delete cleanedMetadata.country;


    const {
      error: metadataError
    } =
      await supabase.auth.updateUser({
        data: cleanedMetadata
      });


    if (metadataError) {

      /*
       * Do not fail onboarding just because
       * metadata cleanup failed.
       */

      console.warn(
        "CHAMA LIVE metadata cleanup warning:",
        metadataError
      );

    }


    /* ===================================================
       SUCCESS
    =================================================== */

    status.textContent =
      "✓ Account confirmed and group created successfully. Redirecting...";


    setTimeout(() => {

      window.location.href =
        `${APP_URL}/dashboard.html`;

    }, 1000);


  } catch (err) {

    console.error(
      "CHAMA LIVE confirmation error:",
      err
    );


    showError(
      err?.message ||
      "Unable to complete account confirmation."
    );

  }

}


init();

</script>


</body>

</html>
