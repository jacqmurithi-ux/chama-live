<script type="module">

import { supabase } from "./js/supabase.js";

import {
  getCurrentGroupId,
  money
} from "./js/app.js";


/* =====================================================
   ELEMENTS
===================================================== */

const statusBox =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");

const descriptionInput =
  document.getElementById("description");

const categorySelect =
  document.getElementById("category");

const amountInput =
  document.getElementById("amount");

const dateInput =
  document.getElementById("expenseDate");

const expenseStatusSelect =
  document.getElementById("expenseStatus");

const saveButton =
  document.getElementById("saveExpense");

const rows =
  document.getElementById("rows");

const logoutButton =
  document.getElementById("logout");


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  statusBox.textContent = message;

}


/* =====================================================
   ERROR
===================================================== */

function showPageError(error) {

  console.error(
    "CHAMA LIVE EXPENSES:",
    error
  );

  const message =
    error?.message ||
    String(error);

  errorBox.textContent =
    "Error: " + message;

  errorBox.hidden = false;

  setStatus(
    "Something went wrong."
  );

}


/* =====================================================
   CLEAR ERROR
===================================================== */

function clearError() {

  errorBox.textContent = "";

  errorBox.hidden = true;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin() {

  const result =
    await supabase.auth.getSession();

  if (result.error) {
    throw result.error;
  }

  if (!result.data.session) {

    window.location.href =
      "login.html";

    return false;

  }

  return true;

}


/* =====================================================
   GET CURRENT MEMBER
===================================================== */

async function getCurrentMember() {

  const result =
    await supabase.auth.getUser();

  if (result.error) {
    throw result.error;
  }

  const user =
    result.data?.user;

  if (!user) {

    window.location.href =
      "login.html";

    return null;

  }


  const memberResult =
    await supabase

      .from("members")

      .select(
        "id,name,user_id,group_id"
      )

      .eq(
        "user_id",
        user.id
      )

      .limit(1);


  if (memberResult.error) {
    throw memberResult.error;
  }


  const members =
    memberResult.data || [];


  if (members.length === 0) {

    throw new Error(
      "No member record is linked to your login."
    );

  }


  const member =
    members[0];


  if (!member.group_id) {

    throw new Error(
      "Your member record has no group."
    );

  }


  return member;

}


/* =====================================================
   LOAD EXPENSES
===================================================== */

async function loadExpenses() {

  clearError();

  setStatus(
    "Loading expense ledger..."
  );


  const groupId =
    await getCurrentGroupId();


  if (!groupId) {

    throw new Error(
      "No group is linked to this account."
    );

  }


  const result =
    await supabase

      .from("expenses")

      .select(`
        id,
        date,
        description,
        category,
        amount,
        approval_status,
        recorded_by
      `)

      .eq(
        "group_id",
        groupId
      )

      .order(
        "date",
        {
          ascending: false
        }
      );


  if (result.error) {
    throw result.error;
  }


  const expenses =
    result.data || [];


  if (expenses.length === 0) {

    rows.innerHTML = `
      <tr>
        <td colspan="6">
          No expenses yet.
        </td>
      </tr>
    `;

    setStatus(
      "No expenses found."
    );

    return;

  }


  /* =================================================
     GET RECORDER MEMBER IDS
  ================================================= */

  const recorderIds = [
    ...new Set(

      expenses

        .map(
          expense =>
            expense.recorded_by
        )

        .filter(Boolean)

    )
  ];


  const recorderNames = {};


  if (recorderIds.length > 0) {

    const membersResult =
      await supabase

        .from("members")

        .select(
          "id,name"
        )

        .in(
          "id",
          recorderIds
        );


    if (membersResult.error) {
      throw membersResult.error;
    }


    (
      membersResult.data || []
    ).forEach(
      member => {

        recorderNames[
          member.id
        ] =
          member.name;

      }
    );

  }


  /* =================================================
     DISPLAY LEDGER
  ================================================= */

  rows.innerHTML =

    expenses

      .map(
        expense => {

          const recorder =
            recorderNames[
              expense.recorded_by
            ] ||
            "—";


          return `

            <tr>

              <td>
                ${escapeHtml(
                  expense.date || "—"
                )}
              </td>

              <td>
                ${escapeHtml(
                  expense.description || "—"
                )}
              </td>

              <td>
                ${escapeHtml(
                  expense.category || "—"
                )}
              </td>

              <td>
                ${escapeHtml(
                  money(
                    Number(
                      expense.amount || 0
                    )
                  )
                )}
              </td>

              <td>
                ${escapeHtml(
                  expense.approval_status || "—"
                )}
              </td>

              <td>
                ${escapeHtml(
                  recorder
                )}
              </td>

            </tr>

          `;

        }
      )

      .join("");


  setStatus(
    expenses.length +
    " expense(s) loaded."
  );

}


/* =====================================================
   SAVE EXPENSE
===================================================== */

async function saveExpense() {

  clearError();


  const originalText =
    saveButton.textContent;


  try {

    /* ================================================
       GET CURRENT MEMBER
    ================================================ */

    setStatus(
      "Checking member..."
    );


    const member =
      await getCurrentMember();


    if (!member) {
      return;
    }


    /* ================================================
       FORM VALUES
    ================================================ */

    const description =
      descriptionInput.value.trim();


    const category =
      categorySelect.value;


    const amount =
      Number(
        amountInput.value
      );


    const expenseDate =
      dateInput.value;


    const approvalStatus =
      expenseStatusSelect.value;


    /* ================================================
       VALIDATION
    ================================================ */

    if (!description) {

      throw new Error(
        "Please enter an expense description."
      );

    }


    if (
      !amount ||
      amount <= 0
    ) {

      throw new Error(
        "Please enter a valid expense amount."
      );

    }


    if (!expenseDate) {

      throw new Error(
        "Please select the expense date."
      );

    }


    /* ================================================
       GROUP
    ================================================ */

    const groupId =
      member.group_id;


    /* ================================================
       SAVE
    ================================================ */

    saveButton.disabled = true;

    saveButton.textContent =
      "Saving...";


    setStatus(
      "Saving expense..."
    );


    const result =
      await supabase

        .from("expenses")

        .insert({

          group_id:
            groupId,

          description:
            description,

          category:
            category,

          amount:
            amount,

          date:
            expenseDate,

          recorded_by:
            member.id,

          approval_status:
            approvalStatus

        });


    if (result.error) {
      throw result.error;
    }


    /* ================================================
       CLEAR FORM
    ================================================ */

    descriptionInput.value =
      "";

    amountInput.value =
      "";


    /* ================================================
       SUCCESS
    ================================================ */

    setStatus(
      "Expense recorded successfully."
    );


    alert(
      "Expense recorded successfully."
    );


    /* ================================================
       REFRESH
    ================================================ */

    await loadExpenses();

  }

  catch (error) {

    showPageError(error);

  }

  finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      originalText;

  }

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
  "click",
  async function () {

    try {

      await supabase.auth.signOut();

      window.location.href =
        "login.html";

    }

    catch (error) {

      showPageError(error);

    }

  }
);


/* =====================================================
   SAVE BUTTON
===================================================== */

saveButton.addEventListener(
  "click",
  saveExpense
);


/* =====================================================
   START
===================================================== */

async function start() {

  try {

    clearError();

    setStatus(
      "Starting Expenses..."
    );


    const loggedIn =
      await checkLogin();


    if (!loggedIn) {
      return;
    }


    /* SET TODAY */

    dateInput.value =
      new Date()
        .toISOString()
        .slice(
          0,
          10
        );


    /* LOAD LEDGER */

    await loadExpenses();

  }

  catch (error) {

    showPageError(error);

  }

}


/* =====================================================
   START APPLICATION
===================================================== */

start();

</script>
