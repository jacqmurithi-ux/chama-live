<script type="module">

import { supabase } from "./js/supabase.js";

import {
  getCurrentGroupId,
  money
} from "./js/app.js";


/* =====================================================
   ELEMENTS
===================================================== */

const statusBox =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");

const descriptionInput =
  document.getElementById("description");

const categorySelect =
  document.getElementById("category");

const amountInput =
  document.getElementById("amount");

const dateInput =
  document.getElementById("expenseDate");

const expenseStatusSelect =
  document.getElementById("expenseStatus");

const saveButton =
  document.getElementById("saveExpense");

const rows =
  document.getElementById("rows");

const logoutButton =
  document.getElementById("logout");


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  statusBox.textContent =
    message;

}


/* =====================================================
   ERROR
===================================================== */

function showPageError(error) {

  console.error(
    "CHAMA LIVE EXPENSES:",
    error
  );

  const message =
    error?.message ||
    String(error);

  errorBox.textContent =
    "Error: " + message;

  errorBox.hidden =
    false;

  setStatus(
    "Something went wrong."
  );

}


/* =====================================================
   CLEAR ERROR
===================================================== */

function clearError() {

  errorBox.textContent =
    "";

  errorBox.hidden =
    true;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
  "click",
  async function () {

    try {

      await supabase.auth.signOut();

      window.location.href =
        "login.html";

    }

    catch (error) {

      showPageError(error);

    }

  }
);


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin() {

  setStatus(
    "Checking login..."
  );


  const result =
    await supabase.auth.getSession();


  if (result.error) {

    throw result.error;

  }


  if (!result.data.session) {

    window.location.href =
      "login.html";

    return false;

  }


  return true;

}


/* =====================================================
   LOAD EXPENSES
===================================================== */

async function loadExpenses() {

  clearError();

  setStatus(
    "Finding your group..."
  );


  const groupId =
    await getCurrentGroupId();


  if (!groupId) {

    throw new Error(
      "No group is linked to this account."
    );

  }


  setStatus(
    "Loading expense ledger..."
  );


  /*
   * IMPORTANT:
   *
   * These column names match the actual
   * public.expenses table:
   *
   * date
   * description
   * category
   * amount
   * approval_status
   */

  const result =
    await supabase

      .from("expenses")

      .select(
        "id,date,description,category,amount,approval_status"
      )

      .eq(
        "group_id",
        groupId
      )

      .order(
        "date",
        {
          ascending: false
        }
      );


  if (result.error) {

    throw result.error;

  }


  const expenses =
    result.data || [];


  if (
    expenses.length === 0
  ) {

    rows.innerHTML = `
      <tr>
        <td colspan="5">
          No expenses yet.
        </td>
      </tr>
    `;


    setStatus(
      "No expenses found."
    );

    return;

  }


  rows.innerHTML =

    expenses

      .map(
        function (expense) {

          return `

            <tr>

              <td>
                ${escapeHtml(
                  expense.date || "—"
                )}
              </td>

              <td>
                ${escapeHtml(
                  expense.description || "—"
                )}
              </td>

              <td>
                ${escapeHtml(
                  expense.category || "—"
                )}
              </td>

              <td>
                ${escapeHtml(
                  money(
                    Number(
                      expense.amount || 0
                    )
                  )
                )}
              </td>

              <td>
                ${escapeHtml(
                  expense.approval_status || "—"
                )}
              </td>

            </tr>

          `;

        }
      )

      .join("");


  setStatus(
    expenses.length +
    " expense(s) loaded."
  );

}


/* =====================================================
   SAVE EXPENSE
===================================================== */

async function saveExpense() {

  clearError();


  const originalText =
    saveButton.textContent;


  try {

    const description =
      descriptionInput.value.trim();


    const category =
      categorySelect.value;


    const amount =
      Number(
        amountInput.value
      );


    const expenseDate =
      dateInput.value;


    const approvalStatus =
      expenseStatusSelect.value;


    /* ================================================
       VALIDATION
    ================================================ */

    if (!description) {

      throw new Error(
        "Please enter an expense description."
      );

    }


    if (
      !amount ||
      amount <= 0
    ) {

      throw new Error(
        "Please enter a valid expense amount."
      );

    }


    if (!expenseDate) {

      throw new Error(
        "Please select the expense date."
      );

    }


    /* ================================================
       GET GROUP
    ================================================ */

    const groupId =
      await getCurrentGroupId();


    if (!groupId) {

      throw new Error(
        "No group is linked to this account."
      );

    }


    /* ================================================
       SAVE
    ================================================ */

    saveButton.disabled =
      true;

    saveButton.textContent =
      "Saving...";


    setStatus(
      "Saving expense..."
    );


    /*
     * IMPORTANT:
     *
     * Do NOT send:
     *
     * expense_date
     * status
     * payment_method
     * reference
     * recorded_by
     *
     * because those columns do not match
     * the current database schema.
     */


    const result =
      await supabase

        .from("expenses")

        .insert({

          group_id:
            groupId,

          description:
            description,

          category:
            category,

          amount:
            amount,

          date:
            expenseDate,

          approval_status:
            approvalStatus

        });


    if (result.error) {

      throw result.error;

    }


    /* ================================================
       CLEAR FORM
    ================================================ */

    descriptionInput.value =
      "";

    amountInput.value =
      "";


    /* ================================================
       SUCCESS
    ================================================ */

    setStatus(
      "Expense recorded successfully."
    );


    alert(
      "Expense recorded successfully."
    );


    /* ================================================
       REFRESH
    ================================================ */

    await loadExpenses();

  }

  catch (error) {

    showPageError(
      error
    );

  }

  finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      originalText;

  }

}


/* =====================================================
   BUTTON
===================================================== */

saveButton.addEventListener(
  "click",
  saveExpense
);


/* =====================================================
   START
===================================================== */

async function start() {

  try {

    clearError();

    setStatus(
      "Starting Expenses..."
    );


    const loggedIn =
      await checkLogin();


    if (!loggedIn) {

      return;

    }


    /* CURRENT DATE */

    dateInput.value =
      new Date()
        .toISOString()
        .slice(
          0,
          10
        );


    /* LOAD LEDGER */

    await loadExpenses();

  }

  catch (error) {

    showPageError(
      error
    );

  }

}


/* =====================================================
   RUN
===================================================== */

start();

</script>
