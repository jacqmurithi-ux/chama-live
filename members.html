
```html
<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Members — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>
<body data-page="members">
<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <button
    class="btn btn-secondary"
    id="logout"
    type="button"
  >
    Sign out
  </button>

</header>


<main class="container">

  <div
    style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
      margin-bottom:25px;
    "
  >

    <div>

      <h1>Members</h1>

      <p class="muted">
        Manage members of your group.
      </p>

    </div>


    <button
      id="addMemberButton"
      class="btn btn-primary"
      type="button"
    >
      + Add Member
    </button>

  </div>


  <div
    id="status"
    class="card"
    style="margin-bottom:20px;"
  >
    Loading members...
  </div>


  <div
    id="error"
    class="error"
    hidden
    style="margin-bottom:20px;"
  ></div>


  <div
    id="success"
    class="card"
    hidden
    style="margin-bottom:20px;"
  ></div>


  <!-- SEARCH -->

  <section
    class="card"
    style="margin-bottom:20px;"
  >

    <div
      style="
        display:flex;
        justify-content:space-between;
        gap:15px;
        align-items:center;
        flex-wrap:wrap;
      "
    >

      <div>

        <strong id="memberCount">
          Loading...
        </strong>

      </div>


      <input
        id="search"
        type="search"
        placeholder="Search members..."
        autocomplete="off"
        style="
          min-width:250px;
          max-width:400px;
          width:100%;
        "
      >

    </div>

  </section>


  <!-- MEMBER FORM -->

  <section
    id="memberFormCard"
    class="card"
    hidden
    style="margin-bottom:25px;"
  >

    <h2 id="formTitle">
      Add Member
    </h2>


    <p class="muted">
      Create or update a member record.
    </p>


    <form id="memberForm">

      <div style="margin-bottom:15px;">

        <label for="memberNumber">
          Member Number
        </label>

        <input
          id="memberNumber"
          name="memberNumber"
          required
          autocomplete="off"
          style="width:100%;"
        >

      </div>


      <div style="margin-bottom:15px;">

        <label for="membershipNumber">
          Membership Number
        </label>

        <input
          id="membershipNumber"
          name="membershipNumber"
          autocomplete="off"
          style="width:100%;"
        >

      </div>


      <div style="margin-bottom:15px;">

        <label for="name">
          Full Name
        </label>

        <input
          id="name"
          name="name"
          required
          autocomplete="name"
          style="width:100%;"
        >

      </div>


      <div style="margin-bottom:15px;">

        <label for="phone">
          Phone Number
        </label>

        <input
          id="phone"
          name="phone"
          type="tel"
          required
          autocomplete="tel"
          style="width:100%;"
        >

      </div>


      <div style="margin-bottom:15px;">

        <label for="email">
          Email Address
        </label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          style="width:100%;"
        >

      </div>


      <div style="margin-bottom:15px;">

        <label for="role">
          Role
        </label>

        <select
          id="role"
          name="role"
          style="width:100%;"
        >

          <option value="member">
            Member
          </option>

          <option value="secretary">
            Secretary
          </option>

          <option value="treasurer">
            Treasurer
          </option>

          <option value="chairperson">
            Chairperson
          </option>

          <option value="admin">
            Admin
          </option>

        </select>

      </div>


      <div style="margin-bottom:15px;">

        <label for="joinDate">
          Join Date
        </label>

        <input
          id="joinDate"
          name="joinDate"
          type="date"
          style="width:100%;"
        >

      </div>


      <div style="margin-bottom:20px;">

        <label for="status">
          Status
        </label>

        <select
          id="status"
          name="status"
          style="width:100%;"
        >

          <option value="active">
            Active
          </option>

          <option value="inactive">
            Inactive
          </option>

        </select>

      </div>


      <div
        style="
          display:flex;
          gap:10px;
          flex-wrap:wrap;
        "
      >

        <button
          type="submit"
          id="saveMember"
          class="btn btn-primary"
        >
          Save Member
        </button>


        <button
          type="button"
          id="cancelMember"
          class="btn btn-secondary"
        >
          Cancel
        </button>

      </div>

    </form>

  </section>


  <!-- MEMBERS -->

  <section class="card">

    <h2>
      Group Members
    </h2>

    <p class="muted">
      Members registered in your group.
    </p>


    <div
      style="
        overflow-x:auto;
        margin-top:15px;
      "
    >

      <table class="table">

        <thead>

          <tr>

            <th>Member No.</th>

            <th>Membership No.</th>

            <th>Name</th>

            <th>Phone</th>

            <th>Email</th>

            <th>Role</th>

            <th>Account</th>

            <th>Status</th>

            <th>Actions</th>

          </tr>

        </thead>


        <tbody id="memberRows">

          <tr>

            <td
              colspan="9"
              class="muted"
            >
              Loading...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<script type="module">

  import { boot }
    from "./js/layout.js";

  boot();

</script>

</body>

</html>
```
