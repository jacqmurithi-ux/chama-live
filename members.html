<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Members - Chama Live</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f5;
  color:#17221c;
}

header{
  background:#17663f;
  color:white;
  padding:14px 16px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.group-name{
  font-size:13px;
  margin-top:3px;
  opacity:.9;
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-actions a,
.header-actions button{
  border-radius:8px;
  padding:9px 13px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
}

.dashboard-btn{
  background:white;
  color:#17663f;
}

.logout-btn{
  background:transparent;
  color:white;
  border:1px solid rgba(255,255,255,.7);
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px 14px 50px;
}

h1{
  margin:0;
  font-size:27px;
}

.subtitle{
  color:#68736e;
  margin:6px 0 20px;
  font-size:14px;
}

.card{
  background:white;
  border:1px solid #e0e7e2;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
}

.card h2{
  margin:0 0 16px;
  font-size:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #ccd6d0;
  border-radius:8px;
  font-size:15px;
  background:white;
}

.field input:focus,
.field select:focus{
  outline:none;
  border-color:#17663f;
}

.add-btn{
  margin-top:16px;
  padding:12px 18px;
  background:#17663f;
  color:white;
  border:0;
  border-radius:8px;
  font-weight:800;
  cursor:pointer;
}

.add-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:13px;
  border-radius:8px;
  margin-bottom:18px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
}

.message.show{
  display:block;
  background:#fdebea;
  color:#8b3028;
  border:1px solid #efc5c0;
}

.message.success{
  display:block;
  background:#e8f5ec;
  color:#17663f;
  border:1px solid #c9e4d1;
}

.loading{
  padding:25px;
  text-align:center;
  color:#68736e;
}

.table-container{
  overflow-x:auto;
  display:none;
}

table{
  width:100%;
  min-width:760px;
  border-collapse:collapse;
}

th,
td{
  text-align:left;
  padding:12px 9px;
  border-bottom:1px solid #edf0ee;
  font-size:13px;
}

th{
  color:#68736e;
  font-size:11px;
  text-transform:uppercase;
}

.role{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#e7f4eb;
  color:#17663f;
  font-size:11px;
  font-weight:800;
}

.empty{
  text-align:center;
  padding:25px;
  color:#68736e;
}

@media(max-width:650px){

  .header-inner{
    align-items:flex-start;
  }

  .header-actions{
    flex-direction:column;
  }

  main{
    padding:18px 12px 40px;
  }

  h1{
    font-size:23px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:14px;
  }

}
</style>
</head>


<body>

<header>

  <div class="header-inner">

    <div>

      <div class="logo">
        Chama Live
      </div>

      <div
        id="groupName"
        class="group-name"
      >
        Loading group...
      </div>

    </div>


    <div class="header-actions">

      <a
        href="dashboard.html"
        class="dashboard-btn"
      >
        Dashboard
      </a>

      <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>

</header>


<main>

  <h1>
    Members
  </h1>

  <p class="subtitle">
    Manage members and roles in your Chama.
  </p>


  <div
    id="message"
    class="message"
  ></div>


  <!-- ADD MEMBER -->

  <section class="card">

    <h2>
      Add New Member
    </h2>


    <form id="memberForm">

      <div class="form-grid">


        <div class="field">

          <label for="memberName">
            Full Name
          </label>

          <input
            id="memberName"
            name="name"
            type="text"
            autocomplete="name"
            required
          >

        </div>


        <div class="field">

          <label for="memberEmail">
            Email Address
          </label>

          <input
            id="memberEmail"
            name="email"
            type="email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="memberPhone">
            Phone Number
          </label>

          <input
            id="memberPhone"
            name="phone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            required
          >

        </div>


        <div class="field">

          <label for="memberRole">
            Role
          </label>

          <select
            id="memberRole"
            name="role"
          >

            <option value="member">
              Member
            </option>

            <option value="secretary">
              Secretary
            </option>

            <option value="treasurer">
              Treasurer
            </option>

          </select>

        </div>


      </div>


      <button
        id="addMemberBtn"
        class="add-btn"
        type="submit"
      >
        Add Member
      </button>

    </form>

  </section>


  <!-- MEMBER LIST -->

  <section class="card">

    <h2>
      Group Members
    </h2>


    <div
      id="loading"
      class="loading"
    >
      Loading members...
    </div>


    <div
      id="tableContainer"
      class="table-container"
    >

      <table>

        <thead>

          <tr>

            <th>
              Member No.
            </th>

            <th>
              Name
            </th>

            <th>
              Email
            </th>

            <th>
              Phone
            </th>

            <th>
              Role
            </th>

            <th>
              Status
            </th>

          </tr>

        </thead>


        <tbody
          id="memberRows"
        ></tbody>

      </table>

    </div>

  </section>

</main>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-client.js"></script>


<script>

"use strict";


/*
==================================================
SUPABASE CLIENT
==================================================
*/

const supabase =
  window.chamaSupabase;


let currentUser = null;
let currentMember = null;
let currentGroup = null;


const message =
  document.getElementById("message");

const form =
  document.getElementById("memberForm");

const addButton =
  document.getElementById("addMemberBtn");

const loading =
  document.getElementById("loading");

const tableContainer =
  document.getElementById("tableContainer");

const memberRows =
  document.getElementById("memberRows");

const groupName =
  document.getElementById("groupName");


/*
==================================================
MESSAGE
==================================================
*/

function showMessage(
  text,
  success = false
){

  message.textContent = text;

  message.className =
    success
      ? "message success"
      : "message show";

}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHtml(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(character){

      const entities = {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      };

      return entities[character];

    }
  );

}


/*
==================================================
CHECK SUPABASE
==================================================
*/

if(!supabase){

  showMessage(
    "Supabase client is unavailable. Check js/supabase-client.js."
  );

  throw new Error(
    "Supabase client unavailable."
  );

}


/*
==================================================
GET CURRENT USER
==================================================
*/

async function getCurrentUser(){

  const result =
    await supabase.auth.getUser();


  if(result.error){

    throw result.error;

  }


  if(!result.data.user){

    window.location.href =
      "login.html";

    return null;

  }


  return result.data.user;

}


/*
==================================================
GET CURRENT MEMBER
==================================================
*/

async function getCurrentMember(
  user
){

  /*
   * Your live table uses user_id.
   */

  let result =
    await supabase
      .from("members")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(result.error){

    throw result.error;

  }


  if(result.data){

    return result.data;

  }


  /*
   * Fallback using email.
   */

  result =
    await supabase
      .from("members")
      .select("*")
      .eq(
        "email",
        user.email
      )
      .maybeSingle();


  if(result.error){

    throw result.error;

  }


  if(!result.data){

    throw new Error(
      "Your account is not linked to a member in this Chama."
    );

  }


  return result.data;

}


/*
==================================================
GET GROUP
==================================================
*/

async function getCurrentGroup(
  member
){

  if(!member.group_id){

    throw new Error(
      "Your member record has no group ID."
    );

  }


  const result =
    await supabase
      .from("groups")
      .select("*")
      .eq(
        "id",
        member.group_id
      )
      .maybeSingle();


  if(result.error){

    throw result.error;

  }


  if(!result.data){

    throw new Error(
      "The group linked to your account could not be found."
    );

  }


  return result.data;

}


/*
==================================================
GENERATE NEXT MEMBER NUMBER
==================================================
*/

async function getNextMemberNumber(){

  const result =
    await supabase
      .from("members")
      .select(
        "member_number,membership_number"
      )
      .eq(
        "group_id",
        currentGroup.id
      );


  if(result.error){

    throw result.error;

  }


  let highest = 0;


  (result.data || []).forEach(
    function(member){

      const number1 =
        parseInt(
          String(
            member.member_number || ""
          ).replace(
            /\D/g,
            ""
          ),
          10
        );


      const number2 =
        parseInt(
          String(
            member.membership_number || ""
          ).replace(
            /\D/g,
            ""
          ),
          10
        );


      if(
        Number.isFinite(number1) &&
        number1 > highest
      ){

        highest = number1;

      }


      if(
        Number.isFinite(number2) &&
        number2 > highest
      ){

        highest = number2;

      }

    }
  );


  /*
   * Your existing member is 1504.
   * Therefore the first new member becomes 1505.
   */

  if(highest < 1504){

    highest = 1504;

  }


  return String(
    highest + 1
  );

}


/*
==================================================
LOAD MEMBERS
==================================================
*/

async function loadMembers(){

  loading.style.display =
    "block";

  tableContainer.style.display =
    "none";


  const result =
    await supabase
      .from("members")
      .select(
        "id,group_id,user_id,member_number,name,phone,role,join_date,status,created_at,email,membership_number,onboarding_status"
      )
      .eq(
        "group_id",
        currentGroup.id
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(result.error){

    throw result.error;

  }


  memberRows.innerHTML =
    "";


  if(
    !result.data ||
    result.data.length === 0
  ){

    memberRows.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty"
        >
          No members found.
        </td>

      </tr>

    `;

  }
  else{

    result.data.forEach(
      function(member){

        const number =
          member.member_number ||
          member.membership_number ||
          "—";


        const name =
          member.name ||
          "—";


        const email =
          member.email ||
          "—";


        const phone =
          member.phone ||
          "—";


        const role =
          member.role ||
          "member";


        const status =
          member.status ||
          member.onboarding_status ||
          "—";


        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>
            ${escapeHtml(number)}
          </td>

          <td>
            <strong>
              ${escapeHtml(name)}
            </strong>
          </td>

          <td>
            ${escapeHtml(email)}
          </td>

          <td>
            ${escapeHtml(phone)}
          </td>

          <td>

            <span class="role">
              ${escapeHtml(role)}
            </span>

          </td>

          <td>
            ${escapeHtml(status)}
          </td>

        `;


        memberRows.appendChild(row);

      }
    );

  }


  loading.style.display =
    "none";

  tableContainer.style.display =
    "block";

}


/*
==================================================
ADD MEMBER
==================================================
*/

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    addButton.disabled =
      true;

    addButton.textContent =
      "Adding...";


    showMessage(
      "Creating member...",
      true
    );


    try{

      /*
       * Read form
       */

      const name =
        document
          .getElementById("memberName")
          .value
          .trim();


      const email =
        document
          .getElementById("memberEmail")
          .value
          .trim()
          .toLowerCase();


      const phone =
        document
          .getElementById("memberPhone")
          .value
          .trim();


      const role =
        document
          .getElementById("memberRole")
          .value;


      /*
       * Validate
       */

      if(!name){

        throw new Error(
          "Please enter the member's full name."
        );

      }


      if(!email){

        throw new Error(
          "Please enter the member's email address."
        );

      }


      if(!phone){

        throw new Error(
          "Please enter the member's phone number."
        );

      }


      /*
       * Generate the next number.
       */

      const nextNumber =
        await getNextMemberNumber();


      /*
       * IMPORTANT:
       *
       * These are the actual required
       * columns from your live database.
       */

      const payload = {

        group_id:
          currentGroup.id,

        member_number:
          nextNumber,

        membership_number:
          nextNumber,

        name:
          name,

        phone:
          phone,

        role:
          role,

        email:
          email,

        status:
          "active",

        onboarding_status:
          "pending"

      };


      console.log(
        "CHAMA LIVE INSERT:",
        payload
      );


      /*
       * Insert member.
       */

      const result =
        await supabase
          .from("members")
          .insert(
            payload
          )
          .select()
          .single();


      if(result.error){

        console.error(
          "SUPABASE INSERT ERROR:",
          result.error
        );


        throw new Error(
          result.error.message
        );

      }


      /*
       * Success
       */

      showMessage(
        "Member " +
        nextNumber +
        " added successfully.",
        true
      );


      /*
       * Clear form.
       */

      form.reset();


      document.getElementById(
        "memberRole"
      ).value =
        "member";


      /*
       * Refresh list.
       */

      await loadMembers();


    }
    catch(error){

      console.error(
        "ADD MEMBER ERROR:",
        error
      );


      showMessage(
        "Unable to add member:\n\n" +
        (
          error.message ||
          "Unknown error"
        )
      );

    }
    finally{

      addButton.disabled =
        false;

      addButton.textContent =
        "Add Member";

    }

  }
);


/*
==================================================
LOGOUT
==================================================
*/

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async function(){

      await supabase.auth.signOut();

      window.location.href =
        "login.html";

    }
  );


/*
==================================================
INITIALISE PAGE
==================================================
*/

(async function(){

  try{

    currentUser =
      await getCurrentUser();


    if(!currentUser){

      return;

    }


    currentMember =
      await getCurrentMember(
        currentUser
      );


    currentGroup =
      await getCurrentGroup(
        currentMember
      );


    groupName.textContent =
      currentGroup.name ||
      "Chama";


    await loadMembers();

  }
  catch(error){

    console.error(
      "MEMBERS PAGE ERROR:",
      error
    );


    loading.style.display =
      "none";


    showMessage(
      error.message ||
      "Unable to load members."
    );

  }

})();

</script>

</body>
</html>
