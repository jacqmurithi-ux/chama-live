```html
<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Members — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>

<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <button
    class="btn btn-secondary"
    id="logout"
  >
    Sign out
  </button>

</header>


<main class="container">

  <div
    style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:25px;
      flex-wrap:wrap;
    "
  >

    <div>

      <h1>Members</h1>

      <p class="muted">
        Manage members of your group.
      </p>

    </div>


    <button
      id="addMemberButton"
      class="btn btn-primary"
    >
      + Add Member
    </button>

  </div>


  <div
    id="message"
    class="error"
    hidden
    style="margin-bottom:20px;"
  ></div>


  <div
    id="success"
    class="card"
    hidden
    style="margin-bottom:20px;"
  ></div>


  <!-- ADD MEMBER -->

  <section
    id="memberFormCard"
    class="card"
    hidden
    style="margin-bottom:25px;"
  >

    <h2>Add Member</h2>

    <p class="muted">
      Add the member to the group first.
      They can activate their login account later.
    </p>


    <form id="memberForm">


      <div style="margin-bottom:15px;">

        <label for="name">
          Full name
        </label>

        <input
          id="name"
          required
          style="width:100%;"
        >

      </div>


      <div style="margin-bottom:15px;">

        <label for="phone">
          Phone number
        </label>

        <input
          id="phone"
          type="tel"
          required
          style="width:100%;"
        >

      </div>


      <div style="margin-bottom:15px;">

        <label for="email">
          Email address
        </label>

        <input
          id="email"
          type="email"
          style="width:100%;"
        >

        <small class="muted">
          Required if the member will activate online.
        </small>

      </div>


      <div style="margin-bottom:15px;">

        <label for="memberNumber">
          Member Number
        </label>

        <input
          id="memberNumber"
          required
          style="width:100%;"
        >

      </div>


      <div style="margin-bottom:15px;">

        <label for="membershipNumber">
          Membership Number
        </label>

        <input
          id="membershipNumber"
          required
          style="width:100%;"
        >

      </div>


      <div style="margin-bottom:20px;">

        <label for="role">
          Role
        </label>

        <select
          id="role"
          required
          style="width:100%;"
        >

          <option value="member">
            Member
          </option>

          <option value="secretary">
            Secretary
          </option>

          <option value="treasurer">
            Treasurer
          </option>

          <option value="chairperson">
            Chairperson
          </option>

          <option value="admin">
            Admin
          </option>

        </select>

      </div>


      <div
        style="
          display:flex;
          gap:10px;
        "
      >

        <button
          type="submit"
          id="saveMember"
          class="btn btn-primary"
        >
          Add Member
        </button>

        <button
          type="button"
          id="cancelMember"
          class="btn btn-secondary"
        >
          Cancel
        </button>

      </div>


    </form>

  </section>


  <!-- MEMBERS -->

  <section class="card">

    <h2>Group Members</h2>

    <div
      style="
        overflow-x:auto;
        margin-top:15px;
      "
    >

      <table>

        <thead>

          <tr>

            <th>Member No.</th>

            <th>Name</th>

            <th>Phone</th>

            <th>Email</th>

            <th>Role</th>

            <th>Login</th>

            <th>Status</th>

          </tr>

        </thead>


        <tbody id="membersBody">

          <tr>

            <td
              colspan="7"
              class="muted"
            >
              Loading...

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<script type="module">

  import {
    supabase,
    requireAuth,
    getMyMember,
    getMyGroup,
    getMyGroupId,
    getMyRole,
    logout
  } from "./js/auth.js";


  const addButton =
    document.getElementById(
      "addMemberButton"
    );

  const formCard =
    document.getElementById(
      "memberFormCard"
    );

  const form =
    document.getElementById(
      "memberForm"
    );

  const cancelButton =
    document.getElementById(
      "cancelMember"
    );

  const saveButton =
    document.getElementById(
      "saveMember"
    );

  const body =
    document.getElementById(
      "membersBody"
    );

  const message =
    document.getElementById(
      "message"
    );

  const success =
    document.getElementById(
      "success"
    );



  function showError(text) {

    message.hidden = false;

    message.textContent = text;

    success.hidden = true;

  }


  function showSuccess(text) {

    success.hidden = false;

    success.textContent = text;

    message.hidden = true;

  }


  function clearMessages() {

    message.hidden = true;

    success.hidden = true;

  }



  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }



  async function boot() {

    try {

      await requireAuth();


      const member =
        await getMyMember();


      if (!member) {
        return;
      }


      const role =
        String(
          member.role || "member"
        ).toLowerCase();


      /*
       * Frontend protection.
       * Database RPC also enforces this.
       */

      if (
        ![
          "admin",
          "chairperson"
        ].includes(role)
      ) {

        addButton.remove();

      }


      await loadMembers();


    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        "Unable to load members."
      );

    }

  }



  async function loadMembers() {

    const groupId =
      await getMyGroupId();


    if (!groupId) {

      throw new Error(
        "Your account is not linked to a group."
      );

    }


    const {
      data,
      error
    } =
      await supabase
        .from("members")
        .select(`
          id,
          member_number,
          membership_number,
          name,
          phone,
          email,
          role,
          status,
          onboarding_status
        `)
        .eq(
          "group_id",
          groupId
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {
      throw error;
    }


    if (!data?.length) {

      body.innerHTML = `
        <tr>
          <td colspan="7" class="muted">
            No members found.
          </td>
        </tr>
      `;

      return;

    }


    body.innerHTML =
      data.map(
        member => `

          <tr>

            <td>
              ${escapeHtml(
                member.membership_number ||
                member.member_number
              )}
            </td>

            <td>
              <strong>
                ${escapeHtml(member.name)}
              </strong>
            </td>

            <td>
              ${escapeHtml(member.phone)}
            </td>

            <td>
              ${escapeHtml(member.email || "—")}
            </td>

            <td>
              ${escapeHtml(
                member.role
              )}
            </td>

            <td>
              ${
                member.auth_user_id
                  ? "Active"
                  : "Not activated"
              }
            </td>

            <td>
              ${escapeHtml(
                member.onboarding_status ||
                member.status
              )}
            </td>

          </tr>

        `
      ).join("");

  }



  addButton.addEventListener(
    "click",
    () => {

      clearMessages();

      form.reset();

      formCard.hidden =
        false;

      window.scrollTo({
        top: formCard.offsetTop - 20,
        behavior: "smooth"
      });

    }
  );



  cancelButton.addEventListener(
    "click",
    () => {

      formCard.hidden =
        true;

      form.reset();

    }
  );



  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      clearMessages();


      const groupId =
        await getMyGroupId();


      if (!groupId) {

        showError(
          "Your account is not linked to a group."
        );

        return;

      }


      const payload = {

        p_group_id:
          groupId,

        p_name:
          document
            .getElementById("name")
            .value
            .trim(),

        p_member_number:
          document
            .getElementById("memberNumber")
            .value
            .trim(),

        p_membership_number:
          document
            .getElementById("membershipNumber")
            .value
            .trim(),

        p_phone:
          document
            .getElementById("phone")
            .value
            .trim(),

        p_email:
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase() || null,

        p_role:
          document
            .getElementById("role")
            .value,

        p_join_date:
          new Date()
            .toISOString()
            .slice(0,10)

      };


      saveButton.disabled =
        true;

      saveButton.textContent =
        "Adding member...";


      try {

        const {
          error
        } =
          await supabase.rpc(
            "add_group_member",
            payload
          );


        if (error) {
          throw error;
        }


        showSuccess(
          `${payload.p_name} has been added successfully.`
        );


        form.reset();

        formCard.hidden =
          true;


        await loadMembers();


      } catch (error) {

        console.error(
          "Add member:",
          error
        );


        showError(
          error.message ||
          "Unable to add member."
        );

      } finally {

        saveButton.disabled =
          false;

        saveButton.textContent =
          "Add Member";

      }

    }
  );



  document
    .getElementById("logout")
    .addEventListener(
      "click",
      logout
    );



  boot();

</script>


</body>
</html>
```
