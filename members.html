<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members - Chama Live</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f5;
  color:#17221c
}

header{
  background:#17663f;
  color:#fff;
  padding:14px 16px
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.logo{
  font-size:21px;
  font-weight:800
}

.group{
  font-size:13px;
  margin-top:3px;
  opacity:.9
}

.actions{
  display:flex;
  gap:8px
}

.actions a,
.actions button{
  padding:9px 13px;
  border-radius:8px;
  font-weight:700;
  text-decoration:none;
  cursor:pointer
}

.actions a{
  background:#fff;
  color:#17663f
}

.actions button{
  background:transparent;
  color:#fff;
  border:1px solid #fff
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px 14px 50px
}

h1{
  margin:0;
  font-size:27px
}

.subtitle{
  color:#68736e;
  font-size:14px;
  margin:6px 0 20px
}

.card{
  background:#fff;
  border:1px solid #e0e7e2;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px
}

.card h2{
  margin:0 0 16px;
  font-size:18px
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccd6d0;
  border-radius:8px;
  font-size:15px;
  background:#fff
}

button.add{
  margin-top:16px;
  padding:12px 18px;
  border:0;
  border-radius:8px;
  background:#17663f;
  color:#fff;
  font-weight:800;
  cursor:pointer
}

button.add:disabled{
  opacity:.6
}

.message{
  display:none;
  padding:13px;
  border-radius:8px;
  margin-bottom:18px;
  white-space:pre-wrap;
  font-size:14px
}

.message.show{
  display:block;
  background:#fdebea;
  color:#8b3028
}

.message.success{
  display:block;
  background:#e8f5ec;
  color:#17663f
}

.loading{
  padding:25px;
  text-align:center;
  color:#68736e
}

.table-wrap{
  display:none;
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px
}

th,td{
  padding:12px 9px;
  text-align:left;
  border-bottom:1px solid #edf0ee;
  font-size:13px
}

th{
  font-size:11px;
  color:#68736e;
  text-transform:uppercase
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#e7f4eb;
  color:#17663f;
  font-size:11px;
  font-weight:800
}

@media(max-width:650px){
  .header{
    align-items:flex-start
  }

  .actions{
    flex-direction:column
  }

  .form-grid{
    grid-template-columns:1fr
  }

  main{
    padding:18px 12px 40px
  }
}
</style>
</head>

<body>

<header>

<div class="header">

<div>
<div class="logo">Chama Live</div>
<div id="groupName" class="group">
Loading group...
</div>
</div>

<div class="actions">

<a href="dashboard.html">
Dashboard
</a>

<button id="logoutBtn" type="button">
Logout
</button>

</div>

</div>

</header>


<main>

<h1>Members</h1>

<p class="subtitle">
Manage members and roles in your Chama.
</p>


<div id="message" class="message"></div>


<section class="card">

<h2>Add New Member</h2>

<form id="memberForm">

<div class="form-grid">

<div>
<label for="memberName">
Full Name
</label>

<input
id="memberName"
name="name"
type="text"
autocomplete="name"
required>
</div>


<div>
<label for="memberEmail">
Email Address
</label>

<input
id="memberEmail"
name="email"
type="email"
autocomplete="email"
required>
</div>


<div>
<label for="memberPhone">
Phone Number
</label>

<input
id="memberPhone"
name="phone"
type="tel"
inputmode="tel"
autocomplete="tel"
required>
</div>


<div>
<label for="memberRole">
Role
</label>

<select
id="memberRole"
name="role">

<option value="member">
Member
</option>

<option value="secretary">
Secretary
</option>

<option value="treasurer">
Treasurer
</option>

</select>
</div>

</div>


<button
id="addButton"
class="add"
type="submit">

Add Member

</button>

</form>

</section>


<section class="card">

<h2>Group Members</h2>

<div
id="loading"
class="loading">

Loading members...

</div>


<div
id="tableWrap"
class="table-wrap">

<table>

<thead>

<tr>

<th>Member No.</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Role</th>
<th>Status</th>

</tr>

</thead>

<tbody id="memberRows"></tbody>

</table>

</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-client.js"></script>


<script>

"use strict";


const supabase =
window.chamaSupabase;


const loading =
document.getElementById("loading");

const tableWrap =
document.getElementById("tableWrap");

const rows =
document.getElementById("memberRows");

const message =
document.getElementById("message");

const groupName =
document.getElementById("groupName");

const form =
document.getElementById("memberForm");

const addButton =
document.getElementById("addButton");


let user = null;
let member = null;
let group = null;


/* MESSAGE */

function showMessage(text,success=false){

message.textContent=text;

message.className=
success
?"message success"
:"message show";

}


/* ESCAPE */

function safe(value){

return String(value ?? "")
.replace(/[&<>"']/g,function(x){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[x];

});

}


/* USER */

async function getUser(){

const result =
await supabase.auth.getUser();

if(result.error)
throw result.error;

if(!result.data.user){

window.location.href="login.html";

return null;

}

return result.data.user;

}


/* MEMBER */

async function getMember(){

/*
Only request columns we actually need.
*/

let result =
await supabase
.from("members")
.select(
"id,group_id,user_id,name,email,role,member_number,membership_number,phone,status,onboarding_status"
)
.eq(
"user_id",
user.id
)
.maybeSingle();


if(result.error)
throw result.error;


if(result.data)
return result.data;


/*
Fallback to email.
*/

result =
await supabase
.from("members")
.select(
"id,group_id,user_id,name,email,role,member_number,membership_number,phone,status,onboarding_status"
)
.eq(
"email",
user.email
)
.maybeSingle();


if(result.error)
throw result.error;


if(!result.data){

throw new Error(
"Your account is not linked to a Chama member."
);

}

return result.data;

}


/* GROUP */

async function getGroup(){

const result =
await supabase
.from("groups")
.select("id,name")
.eq(
"id",
member.group_id
)
.maybeSingle();


if(result.error)
throw result.error;


if(!result.data){

throw new Error(
"Your Chama could not be found."
);

}

return result.data;

}


/*
================================================
LOAD MEMBERS
================================================
*/

async function loadMembers(){

loading.style.display="block";

tableWrap.style.display="none";

loading.textContent=
"Loading members...";


console.log(
"MEMBERS: Loading group:",
group.id
);


try{

/*
IMPORTANT:
Use only the columns confirmed
to exist in your database.
*/

const result =
await supabase
.from("members")
.select(
"id,group_id,user_id,member_number,membership_number,name,phone,role,status,email,onboarding_status"
)
.eq(
"group_id",
group.id
);


console.log(
"MEMBERS RESULT:",
result
);


if(result.error){

throw result.error;

}


const list =
result.data || [];


rows.innerHTML="";


if(list.length===0){

rows.innerHTML=`

<tr>
<td colspan="6"
style="text-align:center;padding:25px">

No members found.

</td>
</tr>

`;

}else{

list.forEach(function(m){

const number =
m.member_number ||
m.membership_number ||
"—";

const status =
m.status ||
m.onboarding_status ||
"—";


const tr =
document.createElement("tr");


tr.innerHTML=`

<td>
${safe(number)}
</td>

<td>
<strong>
${safe(m.name)}
</strong>
</td>

<td>
${safe(m.email || "—")}
</td>

<td>
${safe(m.phone || "—")}
</td>

<td>
<span class="badge">
${safe(m.role || "member")}
</span>
</td>

<td>
${safe(status)}
</td>

`;


rows.appendChild(tr);

});

}


loading.style.display="none";

tableWrap.style.display="block";


}catch(error){

console.error(
"MEMBERS LOAD ERROR:",
error
);


loading.textContent=
"Unable to load members.";


showMessage(
"Unable to load members:\n\n"+
(error.message || error)
);

}

}


/*
================================================
ADD MEMBER
================================================
*/

form.addEventListener(
"submit",
async function(e){

e.preventDefault();


addButton.disabled=true;

addButton.textContent=
"Adding...";


try{

const name =
document
.getElementById("memberName")
.value
.trim();

const email =
document
.getElementById("memberEmail")
.value
.trim()
.toLowerCase();

const phone =
document
.getElementById("memberPhone")
.value
.trim();

const role =
document
.getElementById("memberRole")
.value;


if(!name)
throw new Error("Enter the member's full name.");

if(!email)
throw new Error("Enter the member's email.");

if(!phone)
throw new Error("Enter the member's phone number.");


/*
Get existing member numbers.
*/

const existing =
await supabase
.from("members")
.select(
"member_number,membership_number"
)
.eq(
"group_id",
group.id
);


if(existing.error)
throw existing.error;


let highest=1504;


(existing.data || [])
.forEach(function(m){

const a =
parseInt(
String(
m.member_number || ""
).replace(/\D/g,""),
10
);

const b =
parseInt(
String(
m.membership_number || ""
).replace(/\D/g,""),
10
);


if(Number.isFinite(a) && a>highest)
highest=a;

if(Number.isFinite(b) && b>highest)
highest=b;

});


const next =
String(highest+1);


/*
Insert using your confirmed schema.
*/

const payload={

group_id:group.id,

member_number:next,

membership_number:next,

name:name,

phone:phone,

role:role,

email:email,

status:"active",

onboarding_status:"pending"

};


console.log(
"ADDING MEMBER:",
payload
);


const result =
await supabase
.from("members")
.insert(payload)
.select()
.single();


console.log(
"INSERT RESULT:",
result
);


if(result.error)
throw result.error;


showMessage(
"Member "+next+" added successfully.",
true
);


form.reset();


document.getElementById(
"memberRole"
).value="member";


await loadMembers();


}catch(error){

console.error(
"ADD MEMBER ERROR:",
error
);


showMessage(
"Unable to add member:\n\n"+
(error.message || error)
);

}finally{

addButton.disabled=false;

addButton.textContent=
"Add Member";

}

});


/*
================================================
LOGOUT
================================================
*/

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async function(){

await supabase.auth.signOut();

window.location.href=
"login.html";

});


/*
================================================
START
================================================
*/

(async function(){

try{

if(!supabase){

throw new Error(
"Supabase client is unavailable."
);

}


user =
await getUser();


if(!user)
return;


member =
await getMember();


group =
await getGroup();


groupName.textContent =
group.name ||
"Chama";


console.log(
"CURRENT USER:",
user.id
);

console.log(
"CURRENT MEMBER:",
member
);

console.log(
"CURRENT GROUP:",
group
);


await loadMembers();


}catch(error){

console.error(
"MEMBERS STARTUP ERROR:",
error
);


loading.textContent=
"Unable to load Members.";


showMessage(
error.message ||
"Unable to load Members."
);

}

})();

</script>

</body>
</html>
