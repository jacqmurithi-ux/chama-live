<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Members — Chama Live</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f5;
  color:#17221c;
}

header{
  background:#17663f;
  color:white;
  padding:14px 16px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.logo{
  font-size:21px;
  font-weight:900;
}

.group-name{
  font-size:12px;
  opacity:.9;
  margin-top:3px;
}

.actions{
  display:flex;
  gap:8px;
}

button,.back{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:800;
  cursor:pointer;
}

.back{
  background:white;
  color:#17663f;
  text-decoration:none;
}

.logout{
  background:transparent;
  color:white;
  border:1px solid rgba(255,255,255,.7);
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px 14px 45px;
}

h1{
  margin:0;
  font-size:27px;
}

.intro{
  color:#68736e;
  font-size:14px;
  margin:6px 0 20px;
}

.panel{
  background:white;
  border:1px solid #e1e7e3;
  border-radius:12px;
  padding:17px;
  margin-bottom:18px;
}

.panel h2{
  margin:0 0 15px;
  font-size:18px;
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:5px;
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #ccd5cf;
  border-radius:8px;
  outline:none;
  background:white;
}

input:focus,select:focus{
  border-color:#17663f;
}

.primary{
  margin-top:14px;
  background:#17663f;
  color:white;
}

.primary:disabled{
  opacity:.6;
}

.notice{
  display:none;
  padding:13px;
  border-radius:9px;
  margin-bottom:16px;
  font-size:14px;
  white-space:pre-wrap;
}

.notice.show{
  display:block;
  background:#fde9e7;
  color:#8a3329;
}

.notice.ok{
  display:block;
  background:#e7f4eb;
  color:#17663f;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  text-align:left;
  padding:11px 9px;
  border-bottom:1px solid #edf0ee;
  font-size:13px;
}

th{
  font-size:11px;
  color:#68736e;
  text-transform:uppercase;
}

.loading{
  padding:25px;
  text-align:center;
  color:#68736e;
}

.empty{
  text-align:center;
  color:#68736e;
  padding:25px;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#e7f4eb;
  color:#17663f;
  font-size:11px;
  font-weight:800;
}

@media(max-width:650px){

  .header{
    align-items:flex-start;
  }

  main{
    padding:17px 12px 35px;
  }

  .formgrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  h1{
    font-size:23px;
  }

  .panel{
    padding:14px;
  }
}
</style>
</head>

<body>

<header>

<div class="header">

<div>

<div class="logo">
Chama Live
</div>

<div
id="groupName"
class="group-name"
>
Loading group...
</div>

</div>

<div class="actions">

<a
href="dashboard.html"
class="back"
>
Dashboard
</a>

<button
id="logout"
class="logout"
type="button"
>
Logout
</button>

</div>

</div>

</header>


<main>

<h1>
Members
</h1>

<p class="intro">
Manage members and their roles in your Chama.
</p>


<div
id="notice"
class="notice"
></div>


<section class="panel">

<h2>
Add New Member
</h2>


<form id="memberForm">

<div class="formgrid">


<div>

<label for="fullName">
Full Name
</label>

<input
id="fullName"
name="full_name"
type="text"
autocomplete="name"
required
>

</div>


<div>

<label for="email">
Email Address
</label>

<input
id="email"
name="email"
type="email"
autocomplete="email"
required
>

</div>


<div>

<label for="phone">
Phone Number
</label>

<input
id="phone"
name="phone"
type="tel"
inputmode="tel"
autocomplete="tel"
>

</div>


<div>

<label for="role">
Role
</label>

<select
id="role"
name="role"
required
>

<option value="member">
Member
</option>

<option value="secretary">
Secretary
</option>

<option value="treasurer">
Treasurer
</option>

</select>

</div>


</div>


<button
id="addButton"
class="primary"
type="submit"
>
Add Member
</button>

</form>

</section>


<section class="panel">

<h2>
Group Members
</h2>


<div
id="loading"
class="loading"
>
Loading members...
</div>


<div
id="tableWrap"
class="table-wrap"
style="display:none"
>

<table>

<thead>

<tr>

<th>
Name
</th>

<th>
Email
</th>

<th>
Phone
</th>

<th>
Role
</th>

</tr>

</thead>

<tbody
id="memberRows"
></tbody>

</table>

</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-client.js"></script>


<script>

"use strict";


const supabase =
window.chamaSupabase;


let currentUser = null;

let currentMember = null;

let currentGroup = null;


const notice =
document.getElementById("notice");

const loading =
document.getElementById("loading");

const tableWrap =
document.getElementById("tableWrap");

const rows =
document.getElementById("memberRows");

const addButton =
document.getElementById("addButton");


function showMessage(
message,
success=false
){

notice.textContent =
message;

notice.className =
"notice show" +
(success ? " ok" : "");

}


function escapeHtml(value){

return String(
value ?? ""
).replace(
/[&<>"']/g,
function(character){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[character];

}
);

}


/*
==================================================
GET CURRENT USER
==================================================
*/

async function getUser(){

const session =
await supabase.auth.getSession();

if(session.error)
throw session.error;

if(
!session.data ||
!session.data.session
){

window.location.href =
"login.html";

return null;

}

const result =
await supabase.auth.getUser();

if(result.error)
throw result.error;

return result.data.user;

}


/*
==================================================
GET MEMBER ACCOUNT
==================================================
*/

async function getMember(user){

let result =
await supabase
.from("members")
.select("*")
.eq(
"auth_user_id",
user.id
)
.maybeSingle();

if(result.error)
throw result.error;

if(result.data)
return result.data;


/*
Older Chama Live records may use
user_id.
*/

result =
await supabase
.from("members")
.select("*")
.eq(
"user_id",
user.id
)
.maybeSingle();

if(result.error)
throw result.error;

if(!result.data){

throw new Error(
"Your account is not linked to a member record."
);

}

return result.data;

}


/*
==================================================
LOAD GROUP
==================================================
*/

async function getGroup(member){

if(!member.group_id){

throw new Error(
"Your member account has no group assigned."
);

}

const result =
await supabase
.from("groups")
.select("*")
.eq(
"id",
member.group_id
)
.maybeSingle();

if(result.error)
throw result.error;

if(!result.data){

throw new Error(
"Your group could not be found."
);

}

return result.data;

}


/*
==================================================
LOAD MEMBERS
==================================================
*/

async function loadMembers(){

loading.style.display =
"block";

tableWrap.style.display =
"none";


const result =
await supabase
.from("members")
.select("*")
.eq(
"group_id",
currentGroup.id
)
.order(
"created_at",
{
ascending:true
}
);


if(result.error){

throw result.error;

}


rows.innerHTML = "";


if(
!result.data ||
result.data.length === 0
){

rows.innerHTML = `
<tr>
<td
colspan="4"
class="empty"
>
No members found.
</td>
</tr>
`;

}else{

result.data.forEach(
function(member){

const name =
member.full_name ||
member.name ||
"—";

const email =
member.email ||
"—";

const phone =
member.phone ||
"—";

const role =
member.role ||
member.member_role ||
"member";


const tr =
document.createElement("tr");

tr.innerHTML = `

<td>
<strong>
${escapeHtml(name)}
</strong>
</td>

<td>
${escapeHtml(email)}
</td>

<td>
${escapeHtml(phone)}
</td>

<td>
<span class="badge">
${escapeHtml(role)}
</span>
</td>

`;

rows.appendChild(tr);

}
);

}


loading.style.display =
"none";

tableWrap.style.display =
"block";

}


/*
==================================================
ADD MEMBER
==================================================
*/

document
.getElementById("memberForm")
.addEventListener(
"submit",
async function(event){

event.preventDefault();


addButton.disabled =
true;

addButton.textContent =
"Adding member...";

notice.className =
"notice";


try{

const fullName =
document.getElementById(
"fullName"
).value.trim();


const email =
document.getElementById(
"email"
).value.trim()
.toLowerCase();


const phone =
document.getElementById(
"phone"
).value.trim();


const role =
document.getElementById(
"role"
).value;


if(!fullName){

throw new Error(
"Enter the member's full name."
);

}


if(!email){

throw new Error(
"Enter the member's email address."
);

}


/*
----------------------------------------------
IMPORTANT

We first create the member record.

This does NOT create the Auth account.

The email is stored so the invitation /
account-activation process can use it.
----------------------------------------------
*/

const record = {

group_id:
currentGroup.id,

full_name:
fullName,

email:
email,

phone:
phone || null,

role:
role

};


const result =
await supabase
.from("members")
.insert(record)
.select()
.single();


if(result.error){

throw new Error(
"Unable to add member:\n\n" +
result.error.message
);

}


showMessage(
"Member added successfully.",
true
);


document
.getElementById("memberForm")
.reset();


document
.getElementById("role")
.value =
"member";


await loadMembers();


}catch(error){

console.error(
"ADD MEMBER ERROR:",
error
);

showMessage(
error.message ||
"Unable to add member."
);

}finally{

addButton.disabled =
false;

addButton.textContent =
"Add Member";

}

});


/*
==================================================
LOGOUT
==================================================
*/

document
.getElementById("logout")
.addEventListener(
"click",
async function(){

await supabase.auth.signOut();

window.location.href =
"login.html";

});


/*
==================================================
START
==================================================
*/

(async function(){

try{

if(!supabase){

throw new Error(
"Supabase client is unavailable. Check js/supabase-client.js."
);

}


currentUser =
await getUser();


if(!currentUser)
return;


currentMember =
await getMember(
currentUser
);


currentGroup =
await getGroup(
currentMember
);


document.getElementById(
"groupName"
).textContent =
currentGroup.name ||
"Chama";


await loadMembers();


}catch(error){

console.error(
"MEMBERS PAGE ERROR:",
error
);

loading.style.display =
"none";

showMessage(
error.message ||
"Unable to load members."
);

}

})();

</script>

</body>
</html>
