<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Members — CHAMA LIVE</title>

<link
  rel="stylesheet"
  href="css/app.css"
>

</head>


<body>


<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>


  <button
    class="btn btn-secondary"
    id="logout"
  >
    Sign out
  </button>

</header>



<main class="container">


<div
  style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:25px;
  "
>

  <div>

    <h1>
      Members
    </h1>

    <p class="muted">
      Manage your group members.
    </p>

  </div>


  <button
    id="addMemberButton"
    class="btn btn-primary"
  >
    + Add Member
  </button>

</div>



<div
  id="error"
  class="error"
  hidden
  style="margin-bottom:20px;"
></div>


<div
  id="success"
  class="card"
  hidden
  style="margin-bottom:20px;"
></div>



<!-- ADD MEMBER -->

<section
  id="memberFormCard"
  class="card"
  hidden
  style="margin-bottom:25px;"
>


<h2>
  Add Member
</h2>


<p class="muted">
  Add a new member to your group.
</p>



<form id="memberForm">


<div style="margin-bottom:15px;">

<label for="memberNumber">
Member Number
</label>

<input
  id="memberNumber"
  required
  style="width:100%;"
>

</div>



<div style="margin-bottom:15px;">

<label for="name">
Full Name
</label>

<input
  id="name"
  required
  style="width:100%;"
>

</div>



<div style="margin-bottom:15px;">

<label for="phone">
Phone Number
</label>

<input
  id="phone"
  type="tel"
  required
  style="width:100%;"
>

</div>



<div style="margin-bottom:15px;">

<label for="email">
Email Address
</label>

<input
  id="email"
  type="email"
  style="width:100%;"
>

</div>



<div style="margin-bottom:20px;">

<label for="role">
Role
</label>


<select
  id="role"
  style="width:100%;"
>

<option value="member">
Member
</option>

<option value="secretary">
Secretary
</option>

<option value="treasurer">
Treasurer
</option>

<option value="chairperson">
Chairperson
</option>

<option value="admin">
Admin
</option>

</select>

</div>



<div
  style="
    display:flex;
    gap:10px;
  "
>

<button
  type="submit"
  id="saveMember"
  class="btn btn-primary"
>
Add Member
</button>


<button
  type="button"
  id="cancelMember"
  class="btn btn-secondary"
>
Cancel
</button>

</div>


</form>


</section>



<!-- MEMBERS TABLE -->

<section class="card">


<h2>
Group Members
</h2>


<div
  style="
    overflow-x:auto;
    margin-top:15px;
  "
>


<table>

<thead>

<tr>

<th>
Member No.
</th>

<th>
Name
</th>

<th>
Phone
</th>

<th>
Email
</th>

<th>
Role
</th>

<th>
Status
</th>

</tr>

</thead>


<tbody id="membersBody">

<tr>

<td
  colspan="6"
  class="muted"
>
Loading...
</td>

</tr>

</tbody>


</table>


</div>


</section>


</main>



<script type="module">

import {
  supabase
} from "./js/supabase.js";


import {
  requireAuth,
  getMyMember,
  getMyGroupId,
  canManageGroup,
  logout
} from "./js/auth.js";



const addButton =
  document.getElementById(
    "addMemberButton"
  );


const formCard =
  document.getElementById(
    "memberFormCard"
  );


const form =
  document.getElementById(
    "memberForm"
  );


const cancelButton =
  document.getElementById(
    "cancelMember"
  );


const saveButton =
  document.getElementById(
    "saveMember"
  );


const body =
  document.getElementById(
    "membersBody"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const successBox =
  document.getElementById(
    "success"
  );



function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}



function showError(
  message
) {

  errorBox.hidden =
    false;

  errorBox.textContent =
    message;

  successBox.hidden =
    true;

}



function showSuccess(
  message
) {

  successBox.hidden =
    false;

  successBox.textContent =
    message;

  errorBox.hidden =
    true;

}



async function loadMembers() {

  const groupId =
    await getMyGroupId();


  if (!groupId) {

    throw new Error(
      "Your account is not linked to a group."
    );

  }


  const {
    data,
    error
  } =
    await supabase
      .from("members")
      .select(`
        id,
        member_number,
        name,
        phone,
        email,
        role,
        status
      `)
      .eq(
        "group_id",
        groupId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {
    throw error;
  }


  if (!data?.length) {

    body.innerHTML = `
      <tr>
        <td
          colspan="6"
          class="muted"
        >
          No members found.
        </td>
      </tr>
    `;

    return;

  }


  body.innerHTML =
    data.map(
      member => `

        <tr>

          <td>
            ${escapeHtml(
              member.member_number
            )}
          </td>

          <td>
            <strong>
              ${escapeHtml(
                member.name
              )}
            </strong>
          </td>

          <td>
            ${escapeHtml(
              member.phone
            )}
          </td>

          <td>
            ${escapeHtml(
              member.email || "—"
            )}
          </td>

          <td>
            ${escapeHtml(
              member.role
            )}
          </td>

          <td>
            ${escapeHtml(
              member.status
            )}
          </td>

        </tr>

      `
    ).join("");

}



async function boot() {

  try {

    await requireAuth();


    const member =
      await getMyMember();


    if (!member) {
      return;
    }


    const manager =
      await canManageGroup();


    if (!manager) {

      addButton.hidden =
        true;

    }


    await loadMembers();


  } catch (error) {

    console.error(
      error
    );

    showError(
      error.message ||
      "Unable to load members."
    );

  }

}



addButton.addEventListener(
  "click",
  () => {

    form.reset();

    errorBox.hidden =
      true;

    successBox.hidden =
      true;

    formCard.hidden =
      false;

  }
);



cancelButton.addEventListener(
  "click",
  () => {

    form.reset();

    formCard.hidden =
      true;

  }
);



form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    errorBox.hidden =
      true;

    successBox.hidden =
      true;


    saveButton.disabled =
      true;

    saveButton.textContent =
      "Adding...";


    try {

      const groupId =
        await getMyGroupId();


      if (!groupId) {

        throw new Error(
          "No group was found for your account."
        );

      }


      const memberNumber =
        document
          .getElementById(
            "memberNumber"
          )
          .value
          .trim();


      const name =
        document
          .getElementById(
            "name"
          )
          .value
          .trim();


      const phone =
        document
          .getElementById(
            "phone"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim()
          .toLowerCase();


      const role =
        document
          .getElementById(
            "role"
          )
          .value;


      /*
       * Database RPC.
       *
       * This is preferable to allowing
       * the browser to decide which
       * group a new member belongs to.
       */

      const {
        data,
        error
      } =
        await supabase.rpc(
          "add_group_member",
          {
            p_group_id:
              groupId,

            p_member_number:
              memberNumber,

            p_name:
              name,

            p_phone:
              phone,

            p_email:
              email || null,

            p_role:
              role,

            p_join_date:
              new Date()
                .toISOString()
                .slice(
                  0,
                  10
                )
          }
        );


      if (error) {
        throw error;
      }


      console.log(
        "Member created:",
        data
      );


      form.reset();

      formCard.hidden =
        true;


      showSuccess(
        `${name} has been added successfully.`
      );


      await loadMembers();


    } catch (error) {

      console.error(
        "ADD MEMBER ERROR:",
        error
      );


      showError(
        error.message ||
        "Unable to add member."
      );


    } finally {

      saveButton.disabled =
        false;

      saveButton.textContent =
        "Add Member";

    }

  }
);



document
  .getElementById(
    "logout"
  )
  .addEventListener(
    "click",
    logout
  );



boot();

</script>


</body>

</html>
