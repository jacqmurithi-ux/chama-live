<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Members — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >
</head>

<body>

<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <div
    style="
      display:flex;
      align-items:center;
      gap:15px;
    "
  >

    <div
      id="currentUser"
      class="muted"
    ></div>

    <button
      class="btn btn-secondary"
      id="logout"
      type="button"
    >
      Sign out
    </button>

  </div>

</header>


<div class="layout">

  <aside class="sidebar">

    <nav class="nav">

      <a href="dashboard.html">
        Dashboard
      </a>

      <a
        href="members.html"
        class="active"
      >
        Members
      </a>

      <a href="contributions.html">
        Contributions
      </a>

      <a href="expenses.html">
        Expenses
      </a>

      <a href="meetings.html">
        Meetings
      </a>

      <a href="reports.html">
        Reports
      </a>

      <a href="monthly-closing.html">
        Monthly Closing
      </a>

      <a href="group-management.html">
        Group Management
      </a>

    </nav>

  </aside>


  <main class="main">

    <div class="page-head">

      <div>

        <h1>
          Members
        </h1>

        <p class="muted">
          Manage your group's members and roles.
        </p>

      </div>

      <button
        id="addMemberButton"
        class="btn btn-primary"
        type="button"
      >
        + Add Member
      </button>

    </div>


    <div
      id="error"
      class="error"
      hidden
      style="margin-bottom:20px;"
    ></div>


    <div
      id="success"
      hidden
      style="
        padding:12px;
        margin-bottom:20px;
        border-radius:8px;
        background:#e8f7ed;
      "
    ></div>


    <!-- MEMBER FORM -->

    <section
      id="memberFormCard"
      class="card"
      hidden
      style="margin-bottom:20px;"
    >

      <h2 id="formTitle">
        Add Member
      </h2>


      <form id="memberForm">

        <input
          type="hidden"
          id="memberId"
        >


        <div class="grid grid-3">


          <!-- NAME -->

          <div>

            <label for="name">
              Full Name
            </label>

            <input
              id="name"
              type="text"
              required
              placeholder="Full name"
              style="width:100%;"
            >

          </div>


          <!-- MEMBER NUMBER -->

          <div>

            <label for="memberNumber">
              Member Number
            </label>

            <input
              id="memberNumber"
              type="text"
              required
              placeholder="e.g. 0004"
              style="width:100%;"
            >

          </div>


          <!-- PHONE -->

          <div>

            <label for="phone">
              Phone
            </label>

            <input
              id="phone"
              type="tel"
              required
              placeholder="07XXXXXXXX"
              style="width:100%;"
            >

          </div>


          <!-- EMAIL -->

          <div>

            <label for="email">
              Email
            </label>

            <input
              id="email"
              type="email"
              placeholder="member@example.com"
              style="width:100%;"
            >

          </div>


          <!-- ROLE -->

          <div>

            <label for="role">
              Role
            </label>

            <select
              id="role"
              required
              style="width:100%;"
            >

              <option value="member">
                Member
              </option>

              <option value="secretary">
                Secretary
              </option>

              <option value="treasurer">
                Treasurer
              </option>

              <option value="chairperson">
                Chairperson
              </option>

              <option value="admin">
                Admin
              </option>

            </select>

          </div>


          <!-- JOIN DATE -->

          <div>

            <label for="joinDate">
              Join Date
            </label>

            <input
              id="joinDate"
              type="date"
              style="width:100%;"
            >

          </div>


          <!-- STATUS -->

          <div>

            <label for="status">
              Status
            </label>

            <select
              id="status"
              style="width:100%;"
            >

              <option value="active">
                Active
              </option>

              <option value="inactive">
                Inactive
              </option>

            </select>

          </div>

        </div>


        <br>


        <div
          style="
            display:flex;
            gap:10px;
            flex-wrap:wrap;
          "
        >

          <button
            class="btn btn-primary"
            id="saveMember"
            type="submit"
          >
            Save Member
          </button>

          <button
            class="btn btn-secondary"
            id="cancelMember"
            type="button"
          >
            Cancel
          </button>

        </div>

      </form>

    </section>


    <!-- MEMBERS -->

    <section class="card">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:15px;
          flex-wrap:wrap;
          margin-bottom:15px;
        "
      >

        <div>

          <h2>
            Group Members
          </h2>

          <p
            class="muted"
            id="memberCount"
          >
            Loading...
          </p>

        </div>


        <input
          id="search"
          type="search"
          placeholder="Search members..."
          style="
            max-width:280px;
            width:100%;
          "
        >

      </div>


      <div class="table-wrap">

        <table class="table">

          <thead>

            <tr>

              <th>
                Member
              </th>

              <th>
                Member No.
              </th>

              <th>
                Phone
              </th>

              <th>
                Role
              </th>

              <th>
                Status
              </th>

              <th>
                Account
              </th>

              <th>
                Actions
              </th>

            </tr>

          </thead>


          <tbody id="memberRows">

            <tr>

              <td colspan="7">
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>

</div>


<script type="module">

  import {
    boot
  } from "./js/layout.js";

  await boot();

  import "./js/members.js";

</script>

</body>
</html>
