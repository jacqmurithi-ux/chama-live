<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expenses — Chama Live</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
 background:#f5f7f5;
 color:#1d2521
}

header{
 background:#17663f;
 color:white;
 padding:14px 16px
}

.header{
 max-width:1100px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px
}

.brand{
 font-size:20px;
 font-weight:900
}

.sub{
 font-size:12px;
 opacity:.9;
 margin-top:2px
}

.actions{
 display:flex;
 gap:8px
}

button,.back{
 border:0;
 border-radius:8px;
 padding:10px 13px;
 font-weight:800;
 cursor:pointer;
 text-decoration:none
}

.back{
 background:white;
 color:#17663f
}

.logout{
 background:transparent;
 color:white;
 border:1px solid rgba(255,255,255,.7)
}

main{
 max-width:1100px;
 margin:auto;
 padding:20px 14px 45px
}

h1{
 margin:0;
 font-size:26px
}

.intro{
 color:#68736e;
 font-size:14px;
 margin:6px 0 20px
}

.notice{
 display:none;
 padding:12px 14px;
 border-radius:9px;
 margin-bottom:16px;
 font-size:14px;
 white-space:pre-wrap
}

.notice.show{
 display:block;
 background:#f8e6e3;
 color:#87392d
}

.notice.ok{
 background:#e5f1e9;
 color:#17663f
}

.summary{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
 margin-bottom:18px
}

.card{
 background:white;
 border:1px solid #e1e7e3;
 border-radius:12px;
 padding:16px
}

.card small{
 color:#68736e;
 font-weight:700
}

.card strong{
 display:block;
 color:#17663f;
 font-size:22px;
 margin-top:5px
}

.panel{
 background:white;
 border:1px solid #e1e7e3;
 border-radius:12px;
 padding:17px;
 margin-bottom:18px;
 box-shadow:0 3px 12px rgba(0,0,0,.04)
}

.panel h2{
 font-size:17px;
 margin:0 0 14px
}

.formgrid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px
}

label{
 display:block;
 font-size:12px;
 font-weight:800;
 margin-bottom:5px
}

input,select,textarea{
 width:100%;
 padding:11px;
 border:1px solid #ccd5cf;
 border-radius:8px;
 background:white;
 outline:none
}

textarea{
 min-height:75px;
 resize:vertical
}

input:focus,select:focus,textarea:focus{
 border-color:#17663f
}

.full{
 grid-column:1/-1
}

.add{
 background:#17663f;
 color:white;
 margin-top:14px
}

.add:disabled{
 opacity:.6
}

.tablewrap{
 overflow-x:auto
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:850px
}

th,td{
 text-align:left;
 padding:11px 9px;
 border-bottom:1px solid #edf0ee;
 font-size:13px
}

th{
 font-size:11px;
 text-transform:uppercase;
 color:#68736e
}

.loading{
 text-align:center;
 color:#68736e;
 padding:30px
}

.empty{
 text-align:center;
 color:#68736e;
 padding:25px
}

@media(max-width:650px){

 .header{
  align-items:flex-start
 }

 .actions{
  flex-wrap:wrap;
  justify-content:flex-end
 }

 main{
  padding:17px 12px 35px
 }

 .formgrid,.summary{
  grid-template-columns:1fr
 }

 .full{
  grid-column:auto
 }

 h1{
  font-size:23px
 }

 .panel{
  padding:14px
 }
}
</style>
</head>

<body>

<header>

<div class="header">

<div>

<div class="brand">
Chama Live
</div>

<div
id="groupName"
class="sub"
>
Loading group...
</div>

</div>

<div class="actions">

<a
class="back"
href="dashboard.html"
>
Dashboard
</a>

<button
id="logout"
class="logout"
type="button"
>
Logout
</button>

</div>

</div>

</header>


<main>

<h1>Expenses</h1>

<p class="intro">
Record and track money spent by your Chama.
</p>


<div
id="notice"
class="notice"
></div>


<div class="summary">

<div class="card">

<small>
Total Expenses
</small>

<strong id="total">
KSh 0
</strong>

</div>


<div class="card">

<small>
This Month
</small>

<strong id="monthTotal">
KSh 0
</strong>

</div>


<div class="card">

<small>
Expense Records
</small>

<strong id="recordCount">
0
</strong>

</div>

</div>


<section class="panel">

<h2>
Record Expense
</h2>


<form id="expenseForm">

<div class="formgrid">


<div>

<label for="category">
Expense Category
</label>

<select
id="category"
required
>

<option value="">
Select category
</option>

<option>
Administration
</option>

<option>
Food / Refreshments
</option>

<option>
Transport
</option>

<option>
Equipment
</option>

<option>
Training
</option>

<option>
Welfare
</option>

<option>
Events
</option>

<option>
Bank Charges
</option>

<option>
Other
</option>

</select>

</div>


<div>

<label for="amount">
Amount (KSh)
</label>

<input
id="amount"
type="number"
min="0.01"
step="0.01"
inputmode="decimal"
required
>

</div>


<div>

<label for="date">
Expense Date
</label>

<input
id="date"
type="date"
required
>

</div>


<div>

<label for="payment">
Payment Method
</label>

<select id="payment">

<option value="">
Select method
</option>

<option>
M-Pesa
</option>

<option>
Cash
</option>

<option>
Bank
</option>

<option>
Mobile Money
</option>

<option>
Other
</option>

</select>

</div>


<div>

<label for="reference">
Reference
</label>

<input
id="reference"
type="text"
placeholder="Receipt / M-Pesa reference"
>

</div>


<div>

<label for="payee">
Paid To
</label>

<input
id="payee"
type="text"
placeholder="Person or business"
>

</div>


<div class="full">

<label for="description">
Description / Notes
</label>

<textarea
id="description"
placeholder="Explain what the expense was for"
></textarea>

</div>

</div>


<button
id="saveButton"
class="add"
type="submit"
>
Save Expense
</button>

</form>

</section>


<section class="panel">

<h2>
Expense History
</h2>

<div
id="loading"
class="loading"
>
Loading expenses...
</div>


<div
id="tableWrap"
class="tablewrap"
style="display:none"
>

<table>

<thead>

<tr>

<th>Date</th>
<th>Category</th>
<th>Description</th>
<th>Paid To</th>
<th>Amount</th>
<th>Payment</th>
<th>Reference</th>

</tr>

</thead>

<tbody id="rows"></tbody>

</table>

</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-client.js"></script>


<script>

"use strict";


const supabase =
window.chamaSupabase;


const notice =
document.getElementById("notice");

const loading =
document.getElementById("loading");

const tableWrap =
document.getElementById("tableWrap");

const rows =
document.getElementById("rows");

const saveButton =
document.getElementById("saveButton");


let currentAccount = null;


function showNotice(
text,
ok=false
){

notice.textContent =
text;

notice.className =
"notice show" +
(ok ? " ok" : "");

}


function money(value){

return "KSh " +
Number(
value || 0
).toLocaleString(
"en-KE",
{
minimumFractionDigits:0,
maximumFractionDigits:2
}
);

}


function escapeHtml(value){

return String(
value ?? ""
).replace(
/[&<>"']/g,
c => ({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c])
);

}


/*
AUTHENTICATION
*/

async function getAccount(){

if(!supabase){

throw new Error(
"Supabase client is unavailable."
);

}


const session =
await supabase.auth.getSession();


if(session.error)
throw session.error;


if(!session.data.session){

location.replace(
"login.html"
);

return null;

}


const userResult =
await supabase.auth.getUser();


if(userResult.error)
throw userResult.error;


const user =
userResult.data.user;


if(!user){

location.replace(
"login.html"
);

return null;

}


let result =
await supabase
.from("members")
.select("*")
.eq(
"auth_user_id",
user.id
)
.maybeSingle();


if(result.error)
throw result.error;


let member =
result.data;


if(!member){

result =
await supabase
.from("members")
.select("*")
.eq(
"user_id",
user.id
)
.maybeSingle();


if(result.error)
throw result.error;


member =
result.data;

}


if(!member){

throw new Error(
"Your login is not linked to a Chama member account."
);

}


if(!member.group_id){

throw new Error(
"Your member account has no group."
);

}


const groupResult =
await supabase
.from("groups")
.select(
"id,name"
)
.eq(
"id",
member.group_id
)
.maybeSingle();


if(groupResult.error)
throw groupResult.error;


if(!groupResult.data){

throw new Error(
"Your group could not be found."
);

}


return {

user:user,

member:member,

group:groupResult.data

};

}


/*
LOAD EXPENSES
*/

async function loadExpenses(){

const result =
await supabase
.from("expenses")
.select("*")
.eq(
"group_id",
currentAccount.group.id
)
.order(
"expense_date",
{
ascending:false
}
)
.order(
"created_at",
{
ascending:false
}
);


if(result.error){

throw new Error(
"Unable to load expenses: " +
result.error.message
);

}


const list =
result.data || [];


rows.innerHTML =
"";


if(!list.length){

rows.innerHTML = `
<tr>
<td
colspan="7"
class="empty"
>
No expenses recorded yet.
</td>
</tr>
`;

}else{

list.forEach(
item => {

const tr =
document.createElement("tr");


const category =
item.category ||
item.expense_category ||
"—";


const description =
item.description ||
item.notes ||
"—";


const payee =
item.payee ||
item.paid_to ||
"—";


const payment =
item.payment_method ||
"—";


const reference =
item.reference ||
"—";


const date =
item.expense_date ||
item.date ||
(
item.created_at
?
item.created_at.substring(
0,
10
)
:
"—"
);


tr.innerHTML = `

<td>
${escapeHtml(date)}
</td>

<td>
${escapeHtml(category)}
</td>

<td>
${escapeHtml(description)}
</td>

<td>
${escapeHtml(payee)}
</td>

<td>
<strong>
${money(item.amount)}
</strong>
</td>

<td>
${escapeHtml(payment)}
</td>

<td>
${escapeHtml(reference)}
</td>

`;


rows.appendChild(tr);

});

}


const total =
list.reduce(
(sum,item) =>
sum +
Number(
item.amount || 0
),
0
);


const currentMonth =
new Date()
.toISOString()
.slice(
0,
7
);


const monthTotal =
list
.filter(
item => {

const date =
item.expense_date ||
item.date ||
(
item.created_at
?
item.created_at.substring(
0,
10
)
:
""
);

return date.startsWith(
currentMonth
);

}
)
.reduce(
(sum,item) =>
sum +
Number(
item.amount || 0
),
0
);


document.getElementById(
"total"
).textContent =
money(total);


document.getElementById(
"monthTotal"
).textContent =
money(monthTotal);


document.getElementById(
"recordCount"
).textContent =
list.length;


loading.style.display =
"none";

tableWrap.style.display =
"block";

}


/*
SAVE EXPENSE
*/

document
.getElementById(
"expenseForm"
)
.addEventListener(
"submit",
async event => {

event.preventDefault();


saveButton.disabled =
true;

saveButton.textContent =
"Saving...";

notice.className =
"notice";


try{

const category =
document
.getElementById("category")
.value;


const amount =
Number(
document
.getElementById("amount")
.value
);


const date =
document
.getElementById("date")
.value;


const payment =
document
.getElementById("payment")
.value;


const reference =
document
.getElementById("reference")
.value
.trim();


const payee =
document
.getElementById("payee")
.value
.trim();


const description =
document
.getElementById("description")
.value
.trim();


if(!category){

throw new Error(
"Select an expense category."
);

}


if(!amount || amount <= 0){

throw new Error(
"Enter a valid expense amount."
);

}


if(!date){

throw new Error(
"Select the expense date."
);

}


/*
The code first attempts the
standard expense column names.
*/

const record = {

group_id:
currentAccount.group.id,

category:
category,

amount:
amount,

expense_date:
date,

payment_method:
payment || null,

reference:
reference || null,

payee:
payee || null,

description:
description || null

};


const result =
await supabase
.from("expenses")
.insert(record)
.select()
.single();


if(result.error){

throw new Error(
"Unable to save expense: " +
result.error.message
);

}


showNotice(
"Expense recorded successfully.",
true
);


document
.getElementById(
"expenseForm"
)
.reset();


document
.getElementById(
"date"
)
.value =
new Date()
.toISOString()
.slice(
0,
10
);


await loadExpenses();


}catch(error){

console.error(
"EXPENSE ERROR:",
error
);

showNotice(
error.message ||
"Unable to save expense."
);

}finally{

saveButton.disabled =
false;

saveButton.textContent =
"Save Expense";

}

});


/*
LOGOUT
*/

document
.getElementById(
"logout"
)
.addEventListener(
"click",
async () => {

await supabase.auth.signOut();

location.replace(
"login.html"
);

});


/*
INITIALIZE
*/

(async function(){

try{

currentAccount =
await getAccount();


if(!currentAccount)
return;


document.getElementById(
"groupName"
).textContent =
currentAccount.group.name;


document.getElementById(
"date"
).value =
new Date()
.toISOString()
.slice(
0,
10
);


await loadExpenses();


}catch(error){

console.error(
"EXPENSES PAGE ERROR:",
error
);

loading.style.display =
"none";


showNotice(
error.message ||
"Unable to load expenses."
);

}

})();

</script>

</body>
  </html>
