<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meetings — Chama Live</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7f5;color:#1d2521}
header{background:#17663f;color:#fff;padding:14px 16px}
.header{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:20px;font-weight:900}.sub{font-size:12px;opacity:.9;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.back{border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none}
.back{background:#fff;color:#17663f}.logout{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7)}
main{max-width:1100px;margin:auto;padding:20px 14px 45px}
h1{margin:0;font-size:26px}.intro{color:#68736e;font-size:14px;margin:6px 0 20px}
.panel{background:#fff;border:1px solid #e1e7e3;border-radius:12px;padding:17px;margin-bottom:18px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.panel h2{font-size:17px;margin:0 0 14px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5cf;border-radius:8px;background:#fff;outline:none}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#17663f}
.primary{background:#17663f;color:#fff;margin-top:14px}
.secondary{background:#eef3ef;color:#17663f}
.primary:disabled{opacity:.6}
.notice{display:none;padding:12px 14px;border-radius:9px;margin-bottom:16px;font-size:14px;white-space:pre-wrap}
.notice.show{display:block;background:#f8e6e3;color:#87392d}.notice.ok{background:#e5f1e9;color:#17663f}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0ee;font-size:13px}
th{font-size:11px;text-transform:uppercase;color:#68736e}
.loading{text-align:center;color:#68736e;padding:30px}.empty{text-align:center;color:#68736e;padding:25px}
.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#e5f1e9;color:#17663f;font-size:11px;font-weight:800}
@media(max-width:650px){
.header{align-items:flex-start}main{padding:17px 12px 35px}
.formgrid{grid-template-columns:1fr}.full{grid-column:auto}
h1{font-size:23px}.panel{padding:14px}
}
</style>
</head>

<body>

<header>
<div class="header">
<div>
<div class="brand">Chama Live</div>
<div id="groupName" class="sub">Loading group...</div>
</div>
<div class="actions">
<a class="back" href="dashboard.html">Dashboard</a>
<button id="logout" class="logout" type="button">Logout</button>
</div>
</div>
</header>

<main>

<h1>Meetings</h1>
<p class="intro">Schedule and keep a record of your Chama meetings.</p>

<div id="notice" class="notice"></div>

<section class="panel">
<h2>Schedule Meeting</h2>

<form id="meetingForm">

<div class="formgrid">

<div>
<label for="title">Meeting Title</label>
<input id="title" required placeholder="e.g. Monthly Chama Meeting">
</div>

<div>
<label for="date">Meeting Date</label>
<input id="date" type="date" required>
</div>

<div>
<label for="venue">Venue</label>
<input id="venue" placeholder="e.g. Group office">
</div>

<div>
<label for="status">Status</label>
<select id="status">
<option value="scheduled">Scheduled</option>
<option value="completed">Completed</option>
<option value="cancelled">Cancelled</option>
</select>
</div>

<div class="full">
<label for="agenda">Agenda / Notes</label>
<textarea id="agenda" placeholder="Meeting agenda or notes"></textarea>
</div>

</div>

<button id="saveButton" class="primary" type="submit">
Save Meeting
</button>

</form>
</section>

<section class="panel">
<h2>Meeting History</h2>

<div id="loading" class="loading">
Loading meetings...
</div>

<div id="tableWrap" class="tablewrap" style="display:none">

<table>
<thead>
<tr>
<th>Date</th>
<th>Meeting</th>
<th>Venue</th>
<th>Status</th>
<th>Agenda / Notes</th>
</tr>
</thead>

<tbody id="rows"></tbody>
</table>

</div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>

<script>

"use strict";

const supabase = window.chamaSupabase;

let account = null;

const notice = document.getElementById("notice");
const loading = document.getElementById("loading");
const tableWrap = document.getElementById("tableWrap");
const rows = document.getElementById("rows");
const saveButton = document.getElementById("saveButton");

function showNotice(text,ok=false){
  notice.textContent=text;
  notice.className="notice show"+(ok?" ok":"");
}

function escapeHtml(value){
  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}

async function getAccount(){

  if(!supabase){
    throw new Error("Supabase client is unavailable.");
  }

  const session=await supabase.auth.getSession();

  if(session.error) throw session.error;

  if(!session.data.session){
    location.replace("login.html");
    return null;
  }

  const userResult=await supabase.auth.getUser();

  if(userResult.error) throw userResult.error;

  const user=userResult.data.user;

  let result=await supabase
    .from("members")
    .select("*")
    .eq("auth_user_id",user.id)
    .maybeSingle();

  if(result.error) throw result.error;

  let member=result.data;

  if(!member){

    result=await supabase
      .from("members")
      .select("*")
      .eq("user_id",user.id)
      .maybeSingle();

    if(result.error) throw result.error;

    member=result.data;
  }

  if(!member){
    throw new Error(
      "Your login is not linked to a Chama member account."
    );
  }

  const groupResult=await supabase
    .from("groups")
    .select("id,name")
    .eq("id",member.group_id)
    .maybeSingle();

  if(groupResult.error) throw groupResult.error;

  if(!groupResult.data){
    throw new Error("Your group could not be found.");
  }

  return {
    user:user,
    member:member,
    group:groupResult.data
  };
}

async function loadMeetings(){

  const result=await supabase
    .from("meetings")
    .select("*")
    .eq("group_id",account.group.id)
    .order("meeting_date",{ascending:false});

  if(result.error){
    throw new Error(
      "Unable to load meetings: "+result.error.message
    );
  }

  const list=result.data||[];

  rows.innerHTML="";

  if(!list.length){

    rows.innerHTML=`
      <tr>
        <td colspan="5" class="empty">
          No meetings recorded yet.
        </td>
      </tr>
    `;

  }else{

    list.forEach(item=>{

      const tr=document.createElement("tr");

      const title=
        item.title ||
        item.meeting_title ||
        item.name ||
        "—";

      const date=
        item.meeting_date ||
        item.date ||
        "—";

      const venue=
        item.venue ||
        item.location ||
        "—";

      const status=
        item.status ||
        "scheduled";

      const notes=
        item.agenda ||
        item.notes ||
        item.description ||
        "—";

      tr.innerHTML=`
        <td>${escapeHtml(date)}</td>
        <td><strong>${escapeHtml(title)}</strong></td>
        <td>${escapeHtml(venue)}</td>
        <td><span class="status">${escapeHtml(status)}</span></td>
        <td>${escapeHtml(notes)}</td>
      `;

      rows.appendChild(tr);
    });
  }

  loading.style.display="none";
  tableWrap.style.display="block";
}

document
.getElementById("meetingForm")
.addEventListener("submit",async event=>{

  event.preventDefault();

  saveButton.disabled=true;
  saveButton.textContent="Saving...";
  notice.className="notice";

  try{

    const title=
      document.getElementById("title").value.trim();

    const date=
      document.getElementById("date").value;

    const venue=
      document.getElementById("venue").value.trim();

    const status=
      document.getElementById("status").value;

    const agenda=
      document.getElementById("agenda").value.trim();

    if(!title){
      throw new Error("Enter a meeting title.");
    }

    if(!date){
      throw new Error("Select the meeting date.");
    }

    const record={
      group_id:account.group.id,
      title:title,
      meeting_date:date,
      venue:venue||null,
      status:status,
      agenda:agenda||null,
      created_by:account.user.id
    };

    const result=await supabase
      .from("meetings")
      .insert(record)
      .select()
      .single();

    if(result.error){
      throw new Error(
        "Unable to save meeting: "+
        result.error.message
      );
    }

    showNotice(
      "Meeting saved successfully.",
      true
    );

    document.getElementById("meetingForm").reset();

    document.getElementById("date").value=
      new Date().toISOString().slice(0,10);

    await loadMeetings();

  }catch(error){

    console.error(error);

    showNotice(
      error.message ||
      "Unable to save meeting."
    );

  }finally{

    saveButton.disabled=false;
    saveButton.textContent="Save Meeting";
  }

});

document
.getElementById("logout")
.addEventListener("click",async()=>{

  await supabase.auth.signOut();
  location.replace("login.html");

});

(async function(){

  try{

    account=await getAccount();

    if(!account) return;

    document.getElementById("groupName").textContent=
      account.group.name;

    document.getElementById("date").value=
      new Date().toISOString().slice(0,10);

    await loadMeetings();

  }catch(error){

    console.error("MEETINGS ERROR:",error);

    loading.style.display="none";

    showNotice(
      error.message ||
      "Unable to load meetings."
    );
  }

})();

</script>

</body>
  </html>
