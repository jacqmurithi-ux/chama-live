<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Meetings — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >
</head>


<body>


<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <button
    class="btn btn-secondary"
    id="logout"
    type="button"
  >
    Sign out
  </button>

</header>



<div class="layout">


  <!-- ==================================================
       SIDEBAR
  =================================================== -->

  <aside class="sidebar">

    <nav class="nav">

      <a href="dashboard.html">
        Dashboard
      </a>

      <a href="members.html">
        Members
      </a>

      <a href="contributions.html">
        Contributions
      </a>

      <a href="expenses.html">
        Expenses
      </a>

      <a
        class="active"
        href="meetings.html"
      >
        Meetings
      </a>

      <a href="reports.html">
        Reports
      </a>

      <a href="group-management.html">
        Group Management
      </a>

    </nav>

  </aside>



  <!-- ==================================================
       MAIN
  =================================================== -->

  <main class="main">


    <div class="page-head">

      <div>

        <h1>
          Meetings
        </h1>

        <p class="muted">
          Plan, record and manage group meetings.
        </p>

      </div>

    </div>



    <!-- STATUS -->

    <div
      id="status"
      class="card"
      style="margin-bottom:20px;"
    >
      Loading meetings...
    </div>



    <!-- ERROR -->

    <div
      id="error"
      class="error"
      hidden
      style="margin-bottom:20px;"
    ></div>



    <!-- ==================================================
         METRICS
    =================================================== -->

    <div class="grid grid-3">


      <div class="card">

        <div class="muted">
          Upcoming
        </div>

        <div
          class="metric"
          id="upcomingCount"
        >
          0
        </div>

      </div>



      <div class="card">

        <div class="muted">
          Completed
        </div>

        <div
          class="metric"
          id="completedCount"
        >
          0
        </div>

      </div>



      <div class="card">

        <div class="muted">
          Cancelled
        </div>

        <div
          class="metric"
          id="cancelledCount"
        >
          0
        </div>

      </div>

    </div>



    <br>



    <!-- ==================================================
         CREATE MEETING
    =================================================== -->

    <section class="card">

      <h2>
        Schedule Meeting
      </h2>


      <form id="meetingForm">


        <div class="form-group">

          <label for="title">
            Meeting Title
          </label>

          <input
            id="title"
            type="text"
            required
            placeholder="e.g. Monthly Chama Meeting"
          >

        </div>



        <div class="form-group">

          <label for="meetingDate">
            Date
          </label>

          <input
            id="meetingDate"
            type="date"
            required
          >

        </div>



        <div class="form-group">

          <label for="venue">
            Venue
          </label>

          <input
            id="venue"
            type="text"
            placeholder="e.g. Timau"
          >

        </div>



        <div class="form-group">

          <label for="agenda">
            Agenda
          </label>

          <textarea
            id="agenda"
            rows="4"
            placeholder="Enter meeting agenda..."
          ></textarea>

        </div>



        <button
          class="btn"
          id="saveMeeting"
          type="submit"
        >
          Schedule Meeting
        </button>


      </form>

    </section>



    <br>



    <!-- ==================================================
         MEETING LEDGER
    =================================================== -->

    <section class="card">

      <h2>
        Meeting Records
      </h2>


      <div
        style="
          display:flex;
          gap:10px;
          flex-wrap:wrap;
          margin-bottom:20px;
        "
      >

        <select id="statusFilter">

          <option value="all">
            All Meetings
          </option>

          <option value="upcoming">
            Upcoming
          </option>

          <option value="completed">
            Completed
          </option>

          <option value="cancelled">
            Cancelled
          </option>

        </select>

      </div>



      <div class="table-wrap">

        <table class="table">

          <thead>

            <tr>

              <th>
                Date
              </th>

              <th>
                Meeting
              </th>

              <th>
                Venue
              </th>

              <th>
                Status
              </th>

              <th>
                Actions
              </th>

            </tr>

          </thead>


          <tbody id="meetingRows">

            <tr>

              <td colspan="5">
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>



    <br>



    <!-- ==================================================
         MEETING DETAILS
    =================================================== -->

    <section
      class="card"
      id="detailsCard"
      hidden
    >

      <h2>
        Meeting Details
      </h2>


      <div id="meetingDetails"></div>


      <br>


      <div
        style="
          display:flex;
          gap:10px;
          flex-wrap:wrap;
        "
      >

        <button
          class="btn btn-secondary"
          id="editMeeting"
          type="button"
        >
          Edit Meeting
        </button>


        <button
          class="btn btn-secondary"
          id="completeMeeting"
          type="button"
        >
          Mark Completed
        </button>


        <button
          class="btn btn-secondary"
          id="cancelMeeting"
          type="button"
        >
          Cancel Meeting
        </button>


        <button
          class="btn btn-secondary"
          id="deleteMeeting"
          type="button"
        >
          Delete Meeting
        </button>

      </div>


      <br>


      <div class="form-group">

        <label for="minutes">
          Minutes
        </label>

        <textarea
          id="minutes"
          rows="6"
          placeholder="Enter meeting minutes..."
        ></textarea>

      </div>


      <div class="form-group">

        <label for="resolution">
          Resolutions
        </label>

        <textarea
          id="resolution"
          rows="6"
          placeholder="Enter resolutions..."
        ></textarea>

      </div>


      <button
        class="btn"
        id="saveMinutes"
        type="button"
      >
        Save Minutes & Resolutions
      </button>

    </section>


  </main>

</div>



<script type="module">

  import {
    boot
  } from "./js/layout.js";

  await boot();

  import "./js/meetings.js";

</script>


</body>

</html>
