<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Forgot Password — CHAMA LIVE</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="brand">
        CHAMA <span>LIVE</span>
      </div>

      <h1>Forgot Password?</h1>

      <p>
        Enter the email address registered with your CHAMA LIVE account.
        We'll send you a password reset link.
      </p>


      <!-- ERROR -->

      <div
        id="error"
        class="alert alert-error"
        hidden
        role="alert"
      ></div>


      <!-- SUCCESS -->

      <div
        id="success"
        class="alert alert-success"
        hidden
        role="status"
      ></div>


      <!-- FORM -->

      <form id="forgotPasswordForm">

        <div class="form-group">

          <label for="email">
            Registered Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >

        </div>


        <button
          type="submit"
          id="resetButton"
          class="btn btn-primary"
        >
          Send Reset Link
        </button>

      </form>


      <div
        style="
          margin-top:20px;
          text-align:center;
        "
      >

        <a href="login.html">
          ← Back to Sign In
        </a>

      </div>

    </section>

  </main>


  <script
    type="module"
    src="js/forgot-password.js"
  ></script>

</body>

</html>
