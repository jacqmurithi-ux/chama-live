<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Contributions — CHAMA LIVE</title>

  <link rel="stylesheet" href="css/app.css">
</head>

<body>

<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <button class="btn btn-secondary" id="logout">
    Sign out
  </button>

</header>


<div class="layout">

  <aside class="sidebar">

    <nav class="nav">

      <a href="dashboard.html">
        Dashboard
      </a>

      <a href="members.html">
        Members
      </a>

      <a class="active" href="contributions.html">
        Contributions
      </a>

      <a href="expenses.html">
        Expenses
      </a>

      <a href="meetings.html">
        Meetings
      </a>

      <a href="reports.html">
        Reports
      </a>

      <a href="group-management.html">
        Group Management
      </a>

    </nav>

  </aside>


  <main class="main">

    <div class="page-head">

      <div>

        <h1>
          Contributions
        </h1>

        <p class="muted">
          Record and manage group contributions.
        </p>

      </div>

    </div>


    <!-- =========================
         RECORD CONTRIBUTION
    ========================== -->

    <section class="card">

      <h2>
        Record Contribution
      </h2>


      <div class="form">


        <!-- MEMBER -->

        <div class="field">

          <label for="member">
            Member
          </label>

          <select id="member">

            <option value="">
              Loading members...
            </option>

          </select>

        </div>


        <!-- AMOUNT -->

        <div class="field">

          <label for="amount">
            Amount (KSh)
          </label>

          <input
            id="amount"
            type="number"
            min="1"
            step="1"
            placeholder="200"
          >

        </div>


        <!-- TYPE -->

        <div class="field">

          <label for="type">
            Contribution Type
          </label>

          <select id="type">

            <option value="monthly">
              Monthly
            </option>

            <option value="registration">
              Registration
            </option>

            <option value="welfare">
              Welfare
            </option>

            <option value="fundraising">
              Fundraising
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>


        <!-- MONTH -->

        <div class="field">

          <label for="month">
            Month
          </label>

          <input
            id="month"
            type="month"
          >

        </div>


        <!-- PAYMENT METHOD -->

        <div class="field">

          <label for="method">
            Payment Method
          </label>

          <select id="method">

            <option value="M-Pesa">
              M-Pesa
            </option>

            <option value="Cash">
              Cash
            </option>

            <option value="Bank">
              Bank
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <!-- REFERENCE -->

        <div class="field">

          <label for="reference">
            M-Pesa Reference
          </label>

          <input
            id="reference"
            type="text"
            placeholder="e.g. SH12ABC345"
          >

        </div>


        <!-- SAVE -->

        <button
          class="btn btn-primary"
          id="saveContribution"
          type="button"
        >
          Record Contribution
        </button>


      </div>

    </section>


    <!-- =========================
         ERROR
    ========================== -->

    <div
      class="error"
      data-error
      hidden
    ></div>


    <!-- =========================
         CONTRIBUTION LEDGER
    ========================== -->

    <section class="card">

      <h2>
        Contribution Ledger
      </h2>


      <div class="table-wrap">

        <table class="table">

          <thead>

            <tr>

              <th>
                Date
              </th>

              <th>
                Member
              </th>

              <th>
                Amount
              </th>

              <th>
                Type
              </th>

              <th>
                Method
              </th>

              <th>
                M-Pesa Ref
              </th>

            </tr>

          </thead>


          <tbody id="rows">

            <tr>

              <td colspan="6">
                Loading…
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>


  </main>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script type="module">

import { boot } from "./js/layout.js";

import {
  getCurrentGroupId,
  money,
  showError
} from "./js/app.js";

import { supabase } from "./js/supabase.js";


/* =========================
   START
========================= */

await boot();


/* =========================
   ELEMENTS
========================= */

const memberSelect =
  document.querySelector("#member");

const amountInput =
  document.querySelector("#amount");

const typeSelect =
  document.querySelector("#type");

const monthInput =
  document.querySelector("#month");

const methodSelect =
  document.querySelector("#method");

const referenceInput =
  document.querySelector("#reference");

const saveButton =
  document.querySelector("#saveContribution");

const rows =
  document.querySelector("#rows");


/* =========================
   CHECK ELEMENTS
========================= */

if (!memberSelect) {
  throw new Error("Missing #member");
}

if (!amountInput) {
  throw new Error("Missing #amount");
}

if (!typeSelect) {
  throw new Error("Missing #type");
}

if (!monthInput) {
  throw new Error("Missing #month");
}

if (!methodSelect) {
  throw new Error("Missing #method");
}

if (!referenceInput) {
  throw new Error("Missing #reference");
}

if (!saveButton) {
  throw new Error("Missing #saveContribution");
}

if (!rows) {
  throw new Error("Missing #rows");
}


/* =========================
   CURRENT MONTH
========================= */

monthInput.value =
  new Date()
    .toISOString()
    .slice(0, 7);


/* =========================
   LOAD MEMBERS
========================= */

async function loadMembers() {

  try {

    console.log(
      "CHAMA LIVE: loading members..."
    );


    const groupId =
      await getCurrentGroupId();


    console.log(
      "CHAMA LIVE group:",
      groupId
    );


    if (!groupId) {

      throw new Error(
        "No group is linked to this account."
      );

    }


    const result =
      await supabase
        .from("members")
        .select("id,name")
        .eq(
          "group_id",
          groupId
        )
        .order("name");


    if (result.error) {
      throw result.error;
    }


    const members =
      result.data || [];


    console.log(
      "CHAMA LIVE members:",
      members
    );


    memberSelect.innerHTML =
      '<option value="">Select member</option>';


    if (members.length === 0) {

      memberSelect.innerHTML =
        '<option value="">No members found</option>';

      return;

    }


    members.forEach(
      function(member) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          member.id;


        option.textContent =
          member.name;


        memberSelect.appendChild(
          option
        );

      }
    );


  } catch (error) {

    console.error(
      "CHAMA LIVE members error:",
      error
    );


    memberSelect.innerHTML =
      '<option value="">Unable to load members</option>';


    showError(error);

  }

}


/* =========================
   LOAD CONTRIBUTIONS
========================= */

async function loadContributions() {

  try {

    console.log(
      "CHAMA LIVE: loading contributions..."
    );


    const groupId =
      await getCurrentGroupId();


    if (!groupId) {

      throw new Error(
        "No group is linked to this account."
      );

    }


    const result =
      await supabase
        .from("contributions")
        .select(
          "contribution_date,amount,contribution_type,payment_method,reference,member_id"
        )
        .eq(
          "group_id",
          groupId
        )
        .order(
          "contribution_date",
          {
            ascending: false
          }
        );


    if (result.error) {
      throw result.error;
    }


    const contributions =
      result.data || [];


    console.log(
      "CHAMA LIVE contributions:",
      contributions
    );


    if (
      contributions.length === 0
    ) {

      rows.innerHTML = `
        <tr>
          <td colspan="6">
            No contributions yet.
          </td>
        </tr>
      `;

      return;

    }


    const memberIds = [
      ...new Set(
        contributions
          .map(
            function(item) {

              return item.member_id;

            }
          )
          .filter(Boolean)
      )
    ];


    const memberNames = {};


    if (
      memberIds.length > 0
    ) {

      const memberResult =
        await supabase
          .from("members")
          .select("id,name")
          .in(
            "id",
            memberIds
          );


      if (
        memberResult.error
      ) {

        throw memberResult.error;

      }


      (
        memberResult.data || []
      ).forEach(
        function(member) {

          memberNames[
            member.id
          ] =
            member.name;

        }
      );

    }


    rows.innerHTML =
      contributions
        .map(
          function(item) {

            const date =
              item.contribution_date ||
              "—";


            const member =
              memberNames[
                item.member_id
              ] ||
              "—";


            const amount =
              money(
                Number(
                  item.amount || 0
                )
              );


            const type =
              item.contribution_type ||
              "—";


            const method =
              item.payment_method ||
              "—";


            const reference =
              item.reference ||
              "—";


            return `

              <tr>

                <td>
                  ${escapeHtml(date)}
                </td>

                <td>
                  ${escapeHtml(member)}
                </td>

                <td>
                  ${escapeHtml(amount)}
                </td>

                <td>
                  ${escapeHtml(type)}
                </td>

                <td>
                  ${escapeHtml(method)}
                </td>

                <td>
                  ${escapeHtml(reference)}
                </td>

              </tr>

            `;

          }
        )
        .join("");


  } catch (error) {

    console.error(
      "CHAMA LIVE contributions error:",
      error
    );


    rows.innerHTML = `

      <tr>

        <td colspan="6">
          Unable to load contributions.
        </td>

      </tr>

    `;


    showError(error);

  }

}


/* =========================
   SAVE CONTRIBUTION
========================= */

async function saveContribution() {

  try {

    const memberId =
      memberSelect.value;


    const amount =
      Number(
        amountInput.value
      );


    const type =
      typeSelect.value;


    const month =
      monthInput.value;


    const method =
      methodSelect.value;


    const reference =
      referenceInput.value.trim();


    if (!memberId) {

      throw new Error(
        "Please select a member."
      );

    }


    if (
      !amount ||
      amount <= 0
    ) {

      throw new Error(
        "Please enter a valid amount."
      );

    }


    if (!month) {

      throw new Error(
        "Please select the contribution month."
      );

    }


    saveButton.disabled =
      true;


    saveButton.textContent =
      "Saving...";


    const groupId =
      await getCurrentGroupId();


    if (!groupId) {

      throw new Error(
        "No group is linked to this account."
      );

    }


    const userResult =
      await supabase.auth.getUser();


    const user =
      userResult.data.user;


    const result =
      await supabase
        .from("contributions")
        .insert({

          group_id:
            groupId,

          member_id:
            memberId,

          amount:
            amount,

          contribution_type:
            type,

          month:
            month,

          payment_method:
            method,

          reference:
            reference ||
            null,

          recorded_by:
            user
              ? user.id
              : null,

          contribution_date:
            new Date()
              .toISOString()
              .slice(0, 10)

        });


    if (result.error) {
      throw result.error;
    }


    alert(
      "Contribution recorded successfully."
    );


    amountInput.value =
      "";

    referenceInput.value =
      "";


    await loadContributions();


  } catch (error) {

    console.error(
      "CHAMA LIVE save contribution error:",
      error
    );


    showError(error);


  } finally {

    saveButton.disabled =
      false;


    saveButton.textContent =
      "Record Contribution";

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   BUTTON
========================= */

saveButton.addEventListener(
  "click",
  saveContribution
);


/* =========================
   LOAD PAGE
========================= */

await loadMembers();

await loadContributions();

</script>

</body>

        </html>
