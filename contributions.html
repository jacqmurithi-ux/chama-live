<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Contributions — CHAMA LIVE</title>

  <link rel="stylesheet" href="css/app.css">
</head>

<body>

<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <button class="btn btn-secondary" id="logout">
    Sign out
  </button>

</header>

<div class="layout">

  <aside class="sidebar">

    <nav class="nav">

      <a href="dashboard.html">Dashboard</a>
      <a href="members.html">Members</a>
      <a class="active" href="contributions.html">Contributions</a>
      <a href="expenses.html">Expenses</a>
      <a href="meetings.html">Meetings</a>
      <a href="reports.html">Reports</a>
      <a href="group-management.html">Group Management</a>

    </nav>

  </aside>

  <main class="main">

    <div class="page-head">

      <div>

        <h1>Contributions</h1>

        <p class="muted">
          Record and manage group contributions.
        </p>

      </div>

    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="card"
      style="margin-bottom:20px;"
    >
      Starting Contributions...
    </div>


    <!-- RECORD -->

    <section class="card">

      <h2>Record Contribution</h2>

      <div class="form">

        <div class="field">

          <label for="member">
            Member
          </label>

          <select id="member">

            <option value="">
              Loading members...
            </option>

          </select>

        </div>


        <div class="field">

          <label for="amount">
            Amount (KSh)
          </label>

          <input
            id="amount"
            type="number"
            min="1"
            value="200"
          >

        </div>


        <div class="field">

          <label for="type">
            Contribution Type
          </label>

          <select id="type">

            <option value="monthly">
              Monthly
            </option>

            <option value="registration">
              Registration
            </option>

            <option value="welfare">
              Welfare
            </option>

            <option value="fundraising">
              Fundraising
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>


        <div class="field">

          <label for="month">
            Month
          </label>

          <input
            id="month"
            type="month"
          >

        </div>


        <div class="field">

          <label for="method">
            Payment Method
          </label>

          <select id="method">

            <option value="M-Pesa">
              M-Pesa
            </option>

            <option value="Cash">
              Cash
            </option>

            <option value="Bank">
              Bank
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <div class="field">

          <label for="reference">
            M-Pesa Reference
          </label>

          <input
            id="reference"
            type="text"
            placeholder="e.g. TEST-201"
          >

        </div>


        <button
          class="btn btn-primary"
          id="saveContribution"
          type="button"
        >
          Record Contribution
        </button>

      </div>

    </section>


    <!-- ERROR -->

    <div
      id="error"
      class="error"
      hidden
    ></div>


    <!-- LEDGER -->

    <section class="card">

      <h2>Contribution Ledger</h2>

      <div class="table-wrap">

        <table class="table">

          <thead>

            <tr>

              <th>Date</th>
              <th>Member</th>
              <th>Amount</th>
              <th>Type</th>
              <th>Method</th>
              <th>M-Pesa Ref</th>

            </tr>

          </thead>

          <tbody id="rows">

            <tr>

              <td colspan="6">
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>

</div>


<script type="module">

/* =====================================
   IMPORTS
===================================== */

import { boot } from "./js/layout.js";

import {
  getCurrentGroupId,
  money
} from "./js/app.js";

import { supabase } from "./js/supabase.js";


/* =====================================
   STATUS
===================================== */

function status(message) {

  const box =
    document.getElementById("status");

  if (box) {
    box.textContent = message;
  }

}


/* =====================================
   ERROR
===================================== */

function errorMessage(message) {

  const box =
    document.getElementById("error");

  if (box) {

    box.textContent =
      message;

    box.hidden =
      false;

  }

  status(
    "ERROR: " + message
  );

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


/* =====================================
   BOOT
===================================== */

try {

  status(
    "Checking login..."
  );

  await boot();

  status(
    "Login OK. Getting group..."
  );

} catch (error) {

  errorMessage(
    "Login failed: " +
    error.message
  );

}


/* =====================================
   MONTH
===================================== */

const monthInput =
  document.getElementById("month");

monthInput.value =
  new Date()
    .toISOString()
    .slice(0, 7);


/* =====================================
   LOAD MEMBERS
===================================== */

async function loadMembers() {

  const select =
    document.getElementById("member");

  try {

    status(
      "Getting your group..."
    );

    const groupId =
      await getCurrentGroupId();


    if (!groupId) {

      throw new Error(
        "No group is linked to this account."
      );

    }


    status(
      "Group found. Loading members..."
    );


    const result =
      await supabase
        .from("members")
        .select("id,name")
        .eq(
          "group_id",
          groupId
        )
        .order("name");


    if (result.error) {

      throw result.error;

    }


    const members =
      result.data || [];


    select.innerHTML =
      '<option value="">Select member</option>';


    members.forEach(
      member => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          member.id;

        option.textContent =
          member.name;

        select.appendChild(
          option
        );

      }
    );


    if (members.length === 0) {

      select.innerHTML =
        '<option value="">No members found</option>';

      status(
        "Group found, but no members were found."
      );

      return;

    }


    status(
      members.length +
      " member(s) loaded. Loading contributions..."
    );


  } catch (error) {

    errorMessage(
      "Members failed: " +
      error.message
    );

  }

}


/* =====================================
   LOAD CONTRIBUTIONS
===================================== */

async function loadContributions() {

  const rows =
    document.getElementById("rows");


  try {

    rows.innerHTML = `
      <tr>
        <td colspan="6">
          Loading contributions...
        </td>
      </tr>
    `;


    const groupId =
      await getCurrentGroupId();


    if (!groupId) {

      throw new Error(
        "No group is linked to this account."
      );

    }


    status(
      "Loading contribution ledger..."
    );


    const result =
      await supabase
        .from("contributions")
        .select(
          "contribution_date,amount,contribution_type,payment_method,reference,member_id"
        )
        .eq(
          "group_id",
          groupId
        )
        .order(
          "contribution_date",
          {
            ascending: false
          }
        );


    if (result.error) {

      throw result.error;

    }


    const contributions =
      result.data || [];


    if (
      contributions.length === 0
    ) {

      rows.innerHTML = `
        <tr>
          <td colspan="6">
            No contributions yet.
          </td>
        </tr>
      `;


      status(
        "No contributions found."
      );

      return;

    }


    /* ===============================
       MEMBER NAMES
    =============================== */

    const memberIds = [
      ...new Set(
        contributions
          .map(
            item =>
              item.member_id
          )
          .filter(Boolean)
      )
    ];


    const memberNames = {};


    if (
      memberIds.length > 0
    ) {

      const memberResult =
        await supabase
          .from("members")
          .select(
            "id,name"
          )
          .in(
            "id",
            memberIds
          );


      if (
        memberResult.error
      ) {

        throw memberResult.error;

      }


      (
        memberResult.data ||
        []
      ).forEach(
        member => {

          memberNames[
            member.id
          ] =
            member.name;

        }
      );

    }


    /* ===============================
       DISPLAY
    =============================== */

    rows.innerHTML =
      contributions
        .map(
          item => {

            return `

              <tr>

                <td>
                  ${escapeHtml(
                    item.contribution_date ||
                    "—"
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    memberNames[
                      item.member_id
                    ] ||
                    "—"
                  )}
                </td>

                <td>
                  ${money(
                    Number(
                      item.amount ||
                      0
                    )
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    item.contribution_type ||
                    "—"
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    item.payment_method ||
                    "—"
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    item.reference ||
                    "—"
                  )}
                </td>

              </tr>

            `;

          }
        )
        .join("");


    status(
      contributions.length +
      " contribution(s) loaded."
    );


  } catch (error) {

    rows.innerHTML = `
      <tr>
        <td colspan="6">
          Unable to load contributions.
        </td>
      </tr>
    `;


    errorMessage(
      "Contributions failed: " +
      error.message
    );

  }

}


/* =====================================
   SAVE
===================================== */

async function saveContribution() {

  const button =
    document.getElementById(
      "saveContribution"
    );


  try {

    const memberId =
      document.getElementById(
        "member"
      ).value;


    const amount =
      Number(
        document.getElementById(
          "amount"
        ).value
      );


    const type =
      document.getElementById(
        "type"
      ).value;


    const month =
      document.getElementById(
        "month"
      ).value;


    const method =
      document.getElementById(
        "method"
      ).value;


    const reference =
      document.getElementById(
        "reference"
      ).value.trim();


    if (!memberId) {

      throw new Error(
        "Select a member."
      );

    }


    if (
      !amount ||
      amount <= 0
    ) {

      throw new Error(
        "Enter a valid amount."
      );

    }


    if (!month) {

      throw new Error(
        "Select the contribution month."
      );

    }


    button.disabled =
      true;

    button.textContent =
      "Saving...";


    const groupId =
      await getCurrentGroupId();


    const userResult =
      await supabase.auth.getUser();


    const user =
      userResult.data.user;


    const result =
      await supabase
        .from("contributions")
        .insert({

          group_id:
            groupId,

          member_id:
            memberId,

          amount:
            amount,

          contribution_type:
            type,

          month:
            month,

          payment_method:
            method,

          reference:
            reference ||
            null,

          recorded_by:
            user
              ? user.id
              : null,

          contribution_date:
            new Date()
              .toISOString()
              .slice(0, 10)

        });


    if (result.error) {

      throw result.error;

    }


    alert(
      "Contribution recorded successfully."
    );


    document.getElementById(
      "reference"
    ).value = "";


    await loadContributions();


  } catch (error) {

    errorMessage(
      "Save failed: " +
      error.message
    );


  } finally {

    button.disabled =
      false;

    button.textContent =
      "Record Contribution";

  }

}


/* =====================================
   EVENT
===================================== */

document
  .getElementById(
    "saveContribution"
  )
  .addEventListener(
    "click",
    saveContribution
  );


/* =====================================
   START
===================================== */

await loadMembers();

await loadContributions();

</script>

</body>
</html>
