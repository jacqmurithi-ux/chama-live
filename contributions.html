<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Contributions — CHAMA LIVE</title>

  <link rel="stylesheet" href="./css/app.css">
</head>

<body>

<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <button
    class="btn btn-secondary"
    id="logout"
  >
    Sign out
  </button>

</header>


<div class="layout">

  <aside class="sidebar">

    <nav class="nav">

      <a href="./dashboard.html">
        Dashboard
      </a>

      <a href="./members.html">
        Members
      </a>

      <a
        class="active"
        href="./contributions.html"
      >
        Contributions
      </a>

      <a href="./expenses.html">
        Expenses
      </a>

      <a href="./meetings.html">
        Meetings
      </a>

      <a href="./reports.html">
        Reports
      </a>

      <a href="./group-management.html">
        Group Management
      </a>

    </nav>

  </aside>


  <main class="main">

    <div class="page-head">

      <div>

        <h1>
          Contributions
        </h1>

        <p class="muted">
          Live contribution ledger.
        </p>

      </div>

    </div>


    <section class="card">

      <div class="table-wrap">

        <table class="table">

          <thead>

            <tr>
              <th>Date</th>
              <th>Member</th>
              <th>Amount</th>
              <th>Type</th>
              <th>Method</th>
              <th>M-Pesa Ref</th>
            </tr>

          </thead>


          <tbody id="rows">

            <tr>

              <td colspan="6">
                Loading…
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>


    <div
      class="error"
      data-error
      hidden
    ></div>

  </main>

</div>


<script type="module">

  

  <script type="module" src="./js/contributions.js"></script>

</html>
