<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Contributions — CHAMA LIVE
  </title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>

<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <div>
    <span data-group-name>
      CHAMA
    </span>
  </div>

</header>


<main class="page-container">

  <section class="page-header">

    <h1>
      Contributions
    </h1>

    <p>
      Record and manage member contributions.
    </p>

  </section>


  <section class="card">

    <h2>
      Record Contribution
    </h2>


    <form
      id="contributionForm"
      novalidate
    >


      <!-- MEMBER -->

      <div class="form-group">

        <label for="memberId">
          Member
        </label>

        <select
          id="memberId"
          name="member_id"
          required
        >

          <option value="">
            Select member
          </option>

        </select>

      </div>


      <!-- AMOUNT -->

      <div class="form-group">

        <label for="amount">
          Amount
        </label>

        <input
          type="number"
          id="amount"
          name="amount"
          min="1"
          step="0.01"
          placeholder="200"
          required
        >

      </div>


      <!-- DATE -->

      <div class="form-group">

        <label for="contributionDate">
          Contribution Date
        </label>

        <input
          type="date"
          id="contributionDate"
          name="contribution_date"
          required
        >

      </div>


      <!-- CONTRIBUTION TYPE -->

      <div class="form-group">

        <label for="contributionType">
          Contribution Type
        </label>

        <select
          id="contributionType"
          name="contribution_type"
          required
        >

          <option value="">
            Select contribution type
          </option>

          <option value="Monthly">
            Monthly
          </option>

          <option value="Registration">
            Registration
          </option>

          <option value="Welfare">
            Welfare
          </option>

          <option value="Special">
            Special
          </option>

          <option value="__OTHER__">
            Other
          </option>

        </select>

      </div>


      <!-- CUSTOM TYPE -->

      <div
        class="form-group"
        id="otherContributionTypeContainer"
        hidden
      >

        <label for="otherContributionType">
          Other Contribution Type
        </label>

        <input
          type="text"
          id="otherContributionType"
          name="other_contribution_type"
          maxlength="100"
          placeholder="e.g. Fundraiser, Christmas Fund, Project Contribution"
          autocomplete="off"
        >

        <small>
          This category will be saved for your group
          and will appear in the Contribution Type
          list next time.
        </small>

      </div>


      <!-- PAYMENT METHOD -->

      <div class="form-group">

        <label for="paymentMethod">
          Payment Method
        </label>

        <select
          id="paymentMethod"
          name="payment_method"
        >

          <option value="">
            Select payment method
          </option>

          <option value="M-Pesa">
            M-Pesa
          </option>

          <option value="Cash">
            Cash
          </option>

          <option value="Bank">
            Bank
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <!-- M-PESA REFERENCE -->

      <div class="form-group">

        <label for="mpesaReference">
          M-Pesa Reference
        </label>

        <input
          type="text"
          id="mpesaReference"
          name="mpesa_reference"
          maxlength="100"
          placeholder="e.g. QWE123XYZ"
          autocomplete="off"
        >

      </div>


      <!-- NOTES -->

      <div class="form-group">

        <label for="notes">
          Notes
        </label>

        <textarea
          id="notes"
          name="notes"
          rows="3"
          placeholder="Optional notes"
        ></textarea>

      </div>


      <!-- MESSAGE -->

      <div
        id="formMessage"
        hidden
        role="alert"
      ></div>


      <!-- SUBMIT -->

      <button
        type="submit"
        id="saveContribution"
      >
        Record Contribution
      </button>


    </form>

  </section>


  <section class="card">

    <h2>
      Current Group
    </h2>

    <p>
      Group:
      <strong data-group-name>
        —
      </strong>
    </p>

    <p>
      Recorded by:
      <strong data-user-name>
        —
      </strong>
    </p>

  </section>


</main>


<script
  type="module"
  src="js/layout.js"
></script>

</body>

</html>
