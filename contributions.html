<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Contributions — CHAMA LIVE</title>

  <link rel="stylesheet" href="css/app.css">
</head>

<body>

<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <button
    class="btn btn-secondary"
    id="logout"
    type="button"
  >
    Sign out
  </button>

</header>


<div class="layout">

  <aside class="sidebar">

    <nav class="nav">

      <a href="dashboard.html">Dashboard</a>
      <a href="members.html">Members</a>
      <a class="active" href="contributions.html">Contributions</a>
      <a href="expenses.html">Expenses</a>
      <a href="meetings.html">Meetings</a>
      <a href="reports.html">Reports</a>
      <a href="group-management.html">Group Management</a>

    </nav>

  </aside>


  <main class="main">

    <div class="page-head">

      <div>

        <h1>Contributions</h1>

        <p class="muted">
          Record and manage group contributions.
        </p>

      </div>

    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="card"
      style="margin-bottom:20px;"
    >
      Starting Contributions...
    </div>


    <!-- ERROR -->

    <div
      id="error"
      class="error"
      hidden
      style="margin-bottom:20px;"
    ></div>


    <!-- RECORD CONTRIBUTION -->

    <section class="card">

      <h2>Record Contribution</h2>

      <div class="form">


        <!-- MEMBER -->

        <div class="field">

          <label for="member">
            Member
          </label>

          <select id="member">

            <option value="">
              Loading members...
            </option>

          </select>

        </div>


        <!-- AMOUNT -->

        <div class="field">

          <label for="amount">
            Amount (KSh)
          </label>

          <input
            id="amount"
            type="number"
            min="1"
            step="1"
            value="200"
            placeholder="200"
          >

        </div>


        <!-- TYPE -->

        <div class="field">

          <label for="type">
            Contribution Type
          </label>

          <select id="type">

            <option value="monthly">
              Monthly
            </option>

            <option value="registration">
              Registration
            </option>

            <option value="welfare">
              Welfare
            </option>

            <option value="fundraising">
              Fundraising
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>


        <!-- MONTH -->

        <div class="field">

          <label for="month">
            Month
          </label>

          <input
            id="month"
            type="month"
          >

        </div>


        <!-- METHOD -->

        <div class="field">

          <label for="method">
            Payment Method
          </label>

          <select id="method">

            <option value="M-Pesa">
              M-Pesa
            </option>

            <option value="Cash">
              Cash
            </option>

            <option value="Bank">
              Bank
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <!-- REFERENCE -->

        <div class="field">

          <label for="reference">
            M-Pesa Reference
          </label>

          <input
            id="reference"
            type="text"
            placeholder="e.g. TEST-201"
          >

        </div>


        <!-- SAVE -->

        <button
          class="btn btn-primary"
          id="saveContribution"
          type="button"
        >
          Record Contribution
        </button>


      </div>

    </section>


    <!-- LEDGER -->

    <section class="card">

      <h2>Contribution Ledger</h2>

      <div class="table-wrap">

        <table class="table">

          <thead>

            <tr>

              <th>Date</th>

              <th>Member</th>

              <th>Amount</th>

              <th>Type</th>

              <th>Method</th>

              <th>M-Pesa Ref</th>

            </tr>

          </thead>


          <tbody id="rows">

            <tr>

              <td colspan="6">
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>


  </main>

</div>


<script type="module">

/* =====================================================
   SUPABASE
===================================================== */

import { supabase } from "./js/supabase.js";


/* =====================================================
   APP HELPERS
===================================================== */

import {
  getCurrentGroupId,
  money
} from "./js/app.js";


/* =====================================================
   ELEMENTS
===================================================== */

const statusBox =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");

const memberSelect =
  document.getElementById("member");

const amountInput =
  document.getElementById("amount");

const typeSelect =
  document.getElementById("type");

const monthInput =
  document.getElementById("month");

const methodSelect =
  document.getElementById("method");

const referenceInput =
  document.getElementById("reference");

const saveButton =
  document.getElementById("saveContribution");

const rows =
  document.getElementById("rows");

const logoutButton =
  document.getElementById("logout");


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  statusBox.textContent =
    message;

}


/* =====================================================
   ERROR
===================================================== */

function showError(error) {

  console.error(
    "CHAMA LIVE:",
    error
  );

  const message =
    error?.message ||
    String(error);

  errorBox.textContent =
    "Error: " + message;

  errorBox.hidden =
    false;

  setStatus(
    "Something went wrong."
  );

}


/* =====================================================
   CLEAR ERROR
===================================================== */

function clearError() {

  errorBox.textContent =
    "";

  errorBox.hidden =
    true;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
  "click",
  async function () {

    try {

      await supabase.auth.signOut();

      window.location.href =
        "login.html";

    } catch (error) {

      showError(error);

    }

  }
);


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin() {

  setStatus(
    "Checking login..."
  );


  const result =
    await supabase.auth.getSession();


  if (result.error) {

    throw result.error;

  }


  if (!result.data.session) {

    window.location.href =
      "login.html";

    return false;

  }


  setStatus(
    "Login confirmed."
  );


  return true;

}


/* =====================================================
   LOAD MEMBERS
===================================================== */

async function loadMembers() {

  setStatus(
    "Finding your group..."
  );


  const groupId =
    await getCurrentGroupId();


  if (!groupId) {

    throw new Error(
      "No group is linked to this account."
    );

  }


  setStatus(
    "Group found. Loading members..."
  );


  const result =
    await supabase

      .from("members")

      .select(
        "id,name"
      )

      .eq(
        "group_id",
        groupId
      )

      .order(
        "name",
        {
          ascending: true
        }
      );


  if (result.error) {

    throw result.error;

  }


  const members =
    result.data || [];


  memberSelect.innerHTML =
    "";


  if (
    members.length === 0
  ) {

    memberSelect.innerHTML =
      `
        <option value="">
          No members found
        </option>
      `;

    throw new Error(
      "No members were found in this group."
    );

  }


  memberSelect.innerHTML =
    `
      <option value="">
        Select member
      </option>
    `;


  members.forEach(
    function (member) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        member.id;

      option.textContent =
        member.name;

      memberSelect.appendChild(
        option
      );

    }
  );


  setStatus(
    members.length +
    " member(s) loaded."
  );

}


/* =====================================================
   LOAD CONTRIBUTIONS
===================================================== */

async function loadContributions() {

  setStatus(
    "Loading contribution ledger..."
  );


  const groupId =
    await getCurrentGroupId();


  if (!groupId) {

    throw new Error(
      "No group is linked to this account."
    );

  }


  const result =
    await supabase

      .from("contributions")

      .select(
        "contribution_date,amount,contribution_type,payment_method,reference,member_id"
      )

      .eq(
        "group_id",
        groupId
      )

      .order(
        "contribution_date",
        {
          ascending: false
        }
      );


  if (result.error) {

    throw result.error;

  }


  const contributions =
    result.data || [];


  if (
    contributions.length === 0
  ) {

    rows.innerHTML =
      `
        <tr>

          <td colspan="6">

            No contributions yet.

          </td>

        </tr>
      `;


    setStatus(
      "No contributions found."
    );

    return;

  }


  /* ================================================
     GET MEMBER IDS
  ================================================ */

  const memberIds = [
    ...new Set(

      contributions

        .map(
          function (item) {

            return item.member_id;

          }
        )

        .filter(Boolean)

    )
  ];


  /* ================================================
     GET MEMBER NAMES
  ================================================ */

  const memberNames = {};


  if (
    memberIds.length > 0
  ) {

    const memberResult =
      await supabase

        .from("members")

        .select(
          "id,name"
        )

        .in(
          "id",
          memberIds
        );


    if (
      memberResult.error
    ) {

      throw memberResult.error;

    }


    (
      memberResult.data || []
    ).forEach(
      function (member) {

        memberNames[
          member.id
        ] =
          member.name;

      }
    );

  }


  /* ================================================
     DISPLAY LEDGER
  ================================================ */

  rows.innerHTML =

    contributions

      .map(
        function (item) {

          const date =
            item.contribution_date ||
            "—";


          const member =
            memberNames[
              item.member_id
            ] ||
            "—";


          const amount =
            money(
              Number(
                item.amount ||
                0
              )
            );


          const type =
            item.contribution_type ||
            "—";


          const method =
            item.payment_method ||
            "—";


          const reference =
            item.reference ||
            "—";


          return `

            <tr>

              <td>
                ${escapeHtml(date)}
              </td>

              <td>
                ${escapeHtml(member)}
              </td>

              <td>
                ${amount}
              </td>

              <td>
                ${escapeHtml(type)}
              </td>

              <td>
                ${escapeHtml(method)}
              </td>

              <td>
                ${escapeHtml(reference)}
              </td>

            </tr>

          `;

        }
      )

      .join("");


  setStatus(
    contributions.length +
    " contribution(s) loaded."
  );

}


/* =====================================================
   SAVE CONTRIBUTION
===================================================== */

async function saveContribution() {

  clearError();


  const originalText =
    saveButton.textContent;


  try {

    /* ================================================
       FORM VALUES
    ================================================ */

    const memberId =
      memberSelect.value;


    const amount =
      Number(
        amountInput.value
      );


    const type =
      typeSelect.value;


    const month =
      monthInput.value;


    const method =
      methodSelect.value;


    const reference =
      referenceInput.value.trim();


    /* ================================================
       VALIDATION
    ================================================ */

    if (!memberId) {

      throw new Error(
        "Please select a member."
      );

    }


    if (
      !amount ||
      amount <= 0
    ) {

      throw new Error(
        "Please enter a valid amount."
      );

    }


    if (!month) {

      throw new Error(
        "Please select the contribution month."
      );

    }


    /* ================================================
       GET GROUP
    ================================================ */

    const groupId =
      await getCurrentGroupId();


    if (!groupId) {

      throw new Error(
        "No group is linked to this account."
      );

    }


    /* ================================================
       GET USER
    ================================================ */

    const userResult =
      await supabase.auth.getUser();


    if (
      userResult.error
    ) {

      throw userResult.error;

    }


    const user =
      userResult.data.user;


    /* ================================================
       SAVE
    ================================================ */

    saveButton.disabled =
      true;

    saveButton.textContent =
      "Saving...";


    setStatus(
      "Saving contribution..."
    );


    const result =
      await supabase

        .from("contributions")

        .insert({

          group_id:
            groupId,

          member_id:
            memberId,

          amount:
            amount,

          contribution_type:
            type,

          month:
            month,

          payment_method:
            method,

          reference:
            reference ||
            null,

          recorded_by:
            user?.id ||
            null,

          contribution_date:
            new Date()
              .toISOString()
              .slice(
                0,
                10
              )

        });


    if (result.error) {

      throw result.error;

    }


    /* ================================================
       CLEAR FORM
    ================================================ */

    amountInput.value =
      "200";

    referenceInput.value =
      "";


    setStatus(
      "Contribution recorded successfully."
    );


    alert(
      "Contribution recorded successfully."
    );


    /* ================================================
       REFRESH LEDGER
    ================================================ */

    await loadContributions();


  } catch (error) {

    showError(error);

  } finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      originalText;

  }

}


/* =====================================================
   BUTTON EVENT
===================================================== */

saveButton.addEventListener(
  "click",
  saveContribution
);


/* =====================================================
   START APPLICATION
===================================================== */

async function start() {

  try {

    clearError();


    setStatus(
      "Starting Contributions..."
    );


    /* ================================================
       LOGIN
    ================================================ */

    const loggedIn =
      await checkLogin();


    if (!loggedIn) {

      return;

    }


    /* ================================================
       CURRENT MONTH
    ================================================ */

    monthInput.value =
      new Date()
        .toISOString()
        .slice(
          0,
          7
        );


    /* ================================================
       MEMBERS
    ================================================ */

    await loadMembers();


    /* ================================================
       CONTRIBUTIONS
    ================================================ */

    await loadContributions();


  } catch (error) {

    showError(error);

  }

}


/* =====================================================
   RUN
===================================================== */

start();

</script>

</body>

</html>
