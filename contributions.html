<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Contributions — CHAMA LIVE</title>

  <link rel="stylesheet" href="css/app.css">
</head>

<body>

<header class="topbar">

  <div class="brand">
    CHAMA <span>LIVE</span>
  </div>

  <button
    class="btn btn-secondary"
    id="logout"
    type="button"
  >
    Sign out
  </button>

</header>


<div class="layout">

  <aside class="sidebar">

    <nav class="nav">

      <a href="dashboard.html">Dashboard</a>
      <a href="members.html">Members</a>
      <a class="active" href="contributions.html">Contributions</a>
      <a href="expenses.html">Expenses</a>
      <a href="meetings.html">Meetings</a>
      <a href="reports.html">Reports</a>
      <a href="group-management.html">Group Management</a>

    </nav>

  </aside>


  <main class="main">

    <div class="page-head">

      <div>

        <h1>Contributions</h1>

        <p class="muted">
          Record and manage group contributions.
        </p>

      </div>

    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="card"
      style="margin-bottom:20px;"
    >
      Starting Contributions...
    </div>


    <!-- ERROR -->

    <div
      id="error"
      class="error"
      hidden
      style="margin-bottom:20px;"
    ></div>


    <!-- RECORD CONTRIBUTION -->

    <section class="card">

      <h2>Record Contribution</h2>

      <div class="form">


        <div class="field">

          <label for="member">
            Member
          </label>

          <select id="member">

            <option value="">
              Loading members...
            </option>

          </select>

        </div>


        <div class="field">

          <label for="amount">
            Amount (KSh)
          </label>

          <input
            id="amount"
            type="number"
            min="1"
            step="1"
            value="200"
          >

        </div>


        <div class="field">

          <label for="type">
            Contribution Type
          </label>

          <select id="type">

            <option value="monthly">
              Monthly
            </option>

            <option value="registration">
              Registration
            </option>

            <option value="welfare">
              Welfare
            </option>

            <option value="fundraising">
              Fundraising
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>


        <div class="field">

          <label for="month">
            Month
          </label>

          <input
            id="month"
            type="month"
          >

        </div>


        <div class="field">

          <label for="method">
            Payment Method
          </label>

          <select id="method">

            <option value="M-Pesa">
              M-Pesa
            </option>

            <option value="Cash">
              Cash
            </option>

            <option value="Bank">
              Bank
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <div class="field">

          <label for="reference">
            M-Pesa Reference
          </label>

          <input
            id="reference"
            type="text"
            placeholder="e.g. TEST-201"
          >

        </div>


        <button
          class="btn btn-primary"
          id="saveContribution"
          type="button"
        >
          Record Contribution
        </button>

      </div>

    </section>


    <!-- LEDGER -->

    <section class="card">

      <h2>Contribution Ledger</h2>

      <div class="table-wrap">

        <table class="table">

          <thead>

            <tr>
              <th>Date</th>
              <th>Member</th>
              <th>Amount</th>
              <th>Type</th>
              <th>Method</th>
              <th>M-Pesa Ref</th>
            </tr>

          </thead>

          <tbody id="rows">

            <tr>

              <td colspan="6">
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>

</div>


<script type="module">

import { supabase } from "./js/supabase.js";

import {
  getCurrentGroupId,
  money
} from "./js/app.js";


/* =====================================================
   ELEMENTS
===================================================== */

const statusBox =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");

const memberSelect =
  document.getElementById("member");

const amountInput =
  document.getElementById("amount");

const typeSelect =
  document.getElementById("type");

const monthInput =
  document.getElementById("month");

const methodSelect =
  document.getElementById("method");

const referenceInput =
  document.getElementById("reference");

const saveButton =
  document.getElementById("saveContribution");

const rows =
  document.getElementById("rows");

const logoutButton =
  document.getElementById("logout");


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  statusBox.textContent =
    message;

}


/* =====================================================
   ERROR
===================================================== */

function showPageError(error) {

  const message =
    error?.message ||
    String(error);

  console.error(
    "CHAMA LIVE:",
    error
  );

  errorBox.textContent =
    "Error: " + message;

  errorBox.hidden =
    false;

  setStatus(
    "Something went wrong."
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
  "click",
  async function () {

    await supabase.auth.signOut();

    window.location.href =
      "login.html";

  }
);


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin() {

  setStatus(
    "Checking login..."
  );

  const {
    data,
    error
  } =
    await supabase.auth.getSession();

  if (error) {
    throw error;
  }

  if (!data.session) {

    window.location.href =
      "login.html";

    return false;

  }

  setStatus(
    "Login confirmed."
  );

  return true;

}


/* =====================================================
   LOAD MEMBERS
===================================================== */

async function loadMembers() {

  setStatus(
    "Finding your group..."
  );

  const groupId =
    await getCurrentGroupId();

  if (!groupId) {

    throw new Error(
      "No group is linked to this account."
    );

  }

  setStatus(
    "Group found. Loading members..."
  );


  const {
    data,
    error
  } =
    await supabase
      .from("members")
      .select("id,name")
      .eq("group_id", groupId)
      .order("name", {
        ascending: true
      });


  if (error) {
    throw error;
  }


  const members =
    data || [];


  memberSelect.innerHTML =
    '<option value="">Select member</option>';


  if (members.length === 0) {

    memberSelect.innerHTML =
      '<option value="">No members found</option>';

    throw new Error(
      "No members were found in this group."
    );

  }


  members.forEach(
    function (member) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        member.id;

      option.textContent =
        member.name;

      memberSelect.appendChild(
        option
      );

    }
  );


  setStatus(
    members.length +
    " member(s) loaded. Loading contributions..."
  );

}


/* =====================================================
   LOAD CONTRIBUTIONS
===================================================== */

async function loadContributions() {

  setStatus(
    "Loading contribution ledger..."
  );


  const groupId =
    await getCurrentGroupId();


  if (!groupId) {

    throw new Error(
      "No group is linked to this account."
    );

  }


  const {
    data,
    error
  } =
    await supabase
      .from("contributions")
      .select(
        "contribution_date,amount,contribution_type,payment_method,reference,member_id"
      )
      .eq(
        "group_id",
        groupId
      )
      .order(
        "contribution_date",
        {
          ascending: false
        }
      );


  if (error) {
    throw error;
  }


  const contributions =
    data || [];


  if (contributions.length === 0) {

    rows.innerHTML = `
      <tr>
        <td colspan="6">
          No contributions yet.
        </td>
      </tr>
    `;

    setStatus(
      "No contributions found."
    );

    return;

  }


  /* MEMBER IDS */

  const memberIds = [
    ...new Set(
      contributions
        .map(
          function (item) {
            return item.member_id;
          }
        )
        .filter(Boolean)
    )
  ];


  /* MEMBER NAMES */

  const memberNames = {};


  if (memberIds.length > 0) {

    const {
      data: members,
      error: memberError
    } =
      await supabase
        .from("members")
        .select("id,name")
        .in(
          "id",
          memberIds
        );


    if (memberError) {
      throw memberError;
    }


    (members || []).forEach(
      function (member) {

        memberNames[
          member.id
        ] =
          member.name;

      }
    );

  }


  /* DISPLAY */

  rows.innerHTML =
    contributions
      .map(
        function (item) {

          return `
            <tr>

              <td>
                ${escapeHtml(
                  item.contribution_date ||
                  "—"
                )}
              </td>

              <td>
                ${escapeHtml(
                  memberNames[
                    item.member_id
                  ] ||
                  "—"
                )}
              </td>

              <td>
                ${money(
                  Number(
                    item.amount || 0
                  )
                )}
              </td>

              <td>
                ${escapeHtml(
                  item.contribution_type ||
                  "—"
                )}
              </td>

              <td>
                ${escapeHtml(
                  item.payment_method ||
                  "—"
                )}
              </td>

              <td>
                ${escapeHtml(
                  item.reference ||
                  "—"
                )}
              </td>

            </tr>
          `;

        }
      )
      .join("");


  setStatus(
    contributions.length +
    " contribution(s) loaded."
  );

}


/* =====================================================
   SAVE CONTRIBUTION
===================================================== */

async function saveContribution() {

  errorBox.hidden =
    true;

  const originalText =
    saveButton.textContent;


  try {

    const memberId =
      memberSelect.value;

    const amount =
      Number(
        amountInput.value
      );

    const type =
      typeSelect.value;

    const month =
      monthInput.value;

    const method =
      methodSelect.value;

    const reference =
      referenceInput.value.trim();


    if (!memberId) {

      throw new Error(
        "Please select a member."
      );

    }


    if (!amount || amount <= 0) {

      throw new Error(
        "Please enter a valid amount."
      );

    }


    if (!month) {

      throw new Error(
        "Please select the contribution month."
      );

    }


    const groupId =
      await getCurrentGroupId();


    if (!groupId) {

      throw new Error(
        "No group is linked to this account."
      );

    }


    const {
      data: userData,
      error: userError
    } =
      await supabase.auth.getUser();


    if (userError) {
      throw userError;
    }


    saveButton.disabled =
      true;

    saveButton.textContent =
      "Saving...";


    setStatus(
      "Saving contribution..."
    );


    const {
      error
    } =
      await supabase
        .from("contributions")
        .insert({

          group_id:
            groupId,

          member_id:
            memberId,

          amount:
            amount,

          contribution_type:
            type,

          month:
            month,

          payment_method:
            method,

          reference:
            reference ||
            null,

          recorded_by:
            userData.user?.id ||
            null,

          contribution_date:
            new Date()
              .toISOString()
              .slice(0, 10)

        });


    if (error) {
      throw error;
    }


    amountInput.value =
      "200";

    referenceInput.value =
      "";


    setStatus(
      "Contribution recorded successfully."
    );


    alert(
      "Contribution recorded successfully."
    );


    await loadContributions();

  } catch (error) {

    showPageError(
      error
    );

  } finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      originalText;

  }

}


/* =====================================================
   BUTTON
===================================================== */

saveButton.addEventListener(
  "click",
  saveContribution
);


/* =====================================================
   START
===================================================== */

async function start() {

  try {

    setStatus(
      "Starting Contributions..."
    );


    const loggedIn =
      await checkLogin();


    if (!loggedIn) {
      return;
    }


    /* CURRENT MONTH */

    monthInput.value =
      new Date()
        .toISOString()
        .slice(0, 7);


    /* MEMBERS */

    await loadMembers();


    /* LEDGER */

    await loadContributions();


  } catch (error) {

    showPageError(
      error
    );

  }

}


start();

</script>

</body>
</html>
